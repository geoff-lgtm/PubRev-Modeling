                                </div>
                                <div className="text-sm opacity-90">{rec.msg}</div>
                                {rec.rec && (
                                    <div className="mt-2 text-sm font-medium">
                                        {rec.cur && <span className="opacity-70">Current ${rec.cur} → </span>}
                                        Target <strong>${rec.rec}</strong>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* What-If Scenario Builder — full Financial model */}
                        <div className="border border-gray-200 rounded-xl overflow-hidden">
                            <div className="px-4 py-3 bg-gray-50 border-b border-gray-100">
                                <div className="text-sm font-semibold text-gray-700">🧪 Scenario Builder</div>
                                <div className="text-xs text-gray-400 mt-0.5">Full 24-month model · ARPDAU ${(settings.arpdau||0.035).toFixed(4)} · ARPPU ${(settings.arppu||2.70).toFixed(2)} · blended ad+sub LTV · same model as Financial tab</div>
                            </div>
                            <div className="p-4 space-y-4">
                                {/* Sliders */}
                                {[
                                    { label: 'CPI', key: 'cpi', val: wifCPI, set: setWhatIfCPI, cur: m.cpi||1.0, min: 0.10, max: 5, step: 0.05, fmt: v => '$'+v.toFixed(2) },
                                    { label: 'Opt-In Rate', key: 'opt', val: wifOptIn, set: setWhatIfOptIn, cur: (m.optInRate||0.37)*100, min: 1, max: 80, step: 1, fmt: v => v.toFixed(0)+'%' },
                                    { label: 'Trial→Paid', key: 'tri', val: wifTrialConv, set: setWhatIfTrialConv, cur: (settings.trialConvRate||0.4)*100, min: 1, max: 80, step: 1, fmt: v => v.toFixed(0)+'%' },
                                ].map(s => (
                                    <div key={s.key}>
                                        <div className="flex justify-between text-xs mb-1.5">
                                            <span className="font-medium text-gray-700">{s.label}</span>
                                            <span className="text-gray-500">Current: <span className="font-medium text-gray-800">{s.fmt(s.cur)}</span> → <span className={'font-bold ' + (s.key==='cpi' ? (s.val < s.cur ? 'text-emerald-600' : 'text-red-600') : (s.val > s.cur ? 'text-emerald-600' : 'text-red-600'))}>{s.fmt(s.val)}</span></span>
                                        </div>
                                        <input type="range" min={s.min} max={s.max} step={s.step} value={s.val}
                                            onChange={e => s.set(parseFloat(e.target.value))}
                                            className="w-full accent-indigo-600 h-2" />
                                    </div>
                                ))}

                                {/* Results */}
                                {currentCalc && wifCalc && (() => {
                                    const cur = currentCalc;
                                    const wif = wifCalc;
                                    const changed = Math.abs(wifCPI-(m.cpi||1.0)) > 0.01 || Math.abs(wifOptIn-(m.optInRate||0.37)*100) > 0.5 || Math.abs(wifTrialConv-(settings.trialConvRate||0.4)*100) > 0.5;
                                    const calc = changed ? wif : cur;

                                    // Verdict
                                    let verdict, verdictColor, verdictBg;
                                    if (!calc.paybackMonth) {
                                        verdict = 'No payback within 24 months — unit economics broken at this CPA';
                                        verdictColor = 'text-red-800'; verdictBg = 'bg-red-50 border-red-200';
                                    } else if (calc.paybackMonth <= 6) {
                                        verdict = `Fast payback — cohort cash-flow positive by Month ${calc.paybackMonth}`;
                                        verdictColor = 'text-emerald-800'; verdictBg = 'bg-emerald-50 border-emerald-200';
                                    } else if (calc.paybackMonth <= 12) {
                                        verdict = `Payback Month ${calc.paybackMonth} — viable but watch retention`;
                                        verdictColor = 'text-amber-800'; verdictBg = 'bg-amber-50 border-amber-200';
                                    } else {
                                        verdict = `Payback not until Month ${calc.paybackMonth} — slow. Needs CPA improvement.`;
                                        verdictColor = 'text-red-800'; verdictBg = 'bg-red-50 border-red-200';
                                    }

                                    return (
                                        <div className="space-y-3 pt-1">
                                            {/* Verdict bar */}
                                            <div className={'px-3 py-2.5 rounded-lg border text-xs font-medium ' + verdictBg + ' ' + verdictColor}>
                                                {verdict}
                                            </div>

                                            {/* Two column: current vs projected */}
                                            <div className="grid grid-cols-2 gap-2">
                                                {/* Current */}
                                                <div className="bg-gray-50 rounded-lg p-3 border border-gray-100">
                                                    <div className="text-xs font-semibold text-gray-500 mb-2.5">Current</div>
                                                    <div className="space-y-1.5">
                                                        {[
                                                            { label: 'Monthly paid subs', val: Math.round(cur.newSubsPerMonth) },
                                                            { label: 'CPA', val: '$'+cur.cpa.toFixed(2) },
                                                            { label: 'Payback month', val: cur.paybackMonth ? 'Mo. '+cur.paybackMonth : '>24mo' },
                                                            { label: 'Break-even month', val: cur.breakEvenMonth ? 'Mo. '+cur.breakEvenMonth : '>24mo' },
                                                            { label: 'Peak cash deficit', val: '$'+Math.abs(cur.peakDeficit).toFixed(0) },
                                                            { label: '12M ROAS', val: (cur.roas12*100).toFixed(0)+'%' },
                                                            { label: '24M ROAS', val: (cur.roas24*100).toFixed(0)+'%' },
                                                            { label: 'M24 MRR', val: '$'+cur.m24mrr.toFixed(0) },
                                                        ].map(r => (
                                                            <div key={r.label} className="flex justify-between text-xs">
                                                                <span className="text-gray-500">{r.label}</span>
                                                                <span className="font-semibold text-gray-800">{r.val}</span>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>

                                                {/* Projected */}
                                                <div className="bg-indigo-50 rounded-lg p-3 border border-indigo-200">
                                                    <div className="text-xs font-semibold text-indigo-700 mb-2.5">{changed ? 'Projected' : 'Projected (adjust sliders)'}</div>
                                                    <div className="space-y-1.5">
                                                        {[
                                                            { label: 'Monthly paid subs', cv: cur.newSubsPerMonth, wv: wif.newSubsPerMonth, fmt: v => Math.round(v), better: (c,w) => w > c },
                                                            { label: 'CPA', cv: cur.cpa, wv: wif.cpa, fmt: v => '$'+v.toFixed(2), better: (c,w) => w < c },
                                                            { label: 'Payback month', cv: cur.paybackMonth||99, wv: wif.paybackMonth||99, fmt: v => v >= 99 ? '>24mo' : 'Mo. '+v, better: (c,w) => w < c },
                                                            { label: 'Break-even month', cv: cur.breakEvenMonth||99, wv: wif.breakEvenMonth||99, fmt: v => v >= 99 ? '>24mo' : 'Mo. '+v, better: (c,w) => w < c },
                                                            { label: 'Peak cash deficit', cv: Math.abs(cur.peakDeficit), wv: Math.abs(wif.peakDeficit), fmt: v => '$'+v.toFixed(0), better: (c,w) => w < c },
                                                            { label: '12M ROAS', cv: cur.roas12, wv: wif.roas12, fmt: v => (v*100).toFixed(0)+'%', better: (c,w) => w > c },
                                                            { label: '24M ROAS', cv: cur.roas24, wv: wif.roas24, fmt: v => (v*100).toFixed(0)+'%', better: (c,w) => w > c },
                                                            { label: 'M24 MRR', cv: cur.m24mrr, wv: wif.m24mrr, fmt: v => '$'+v.toFixed(0), better: (c,w) => w > c },
                                                        ].map(r => {
                                                            const isGood = r.better(r.cv, r.wv);
                                                            const same = Math.abs(r.cv - r.wv) < 0.01;
                                                            return (
                                                                <div key={r.label} className="flex justify-between text-xs">
                                                                    <span className="text-indigo-600">{r.label}</span>
                                                                    <span className={'font-semibold ' + (same ? 'text-gray-500' : isGood ? 'text-emerald-700' : 'text-red-600')}>
                                                                        {r.fmt(r.wv)}
                                                                    </span>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                </div>
                                            </div>

                                            {/* Payback timeline strip */}
                                            {(cur.paybackMonth || wif.paybackMonth) && (
                                                <div className="bg-white border border-gray-100 rounded-lg p-3">
                                                    <div className="text-xs font-medium text-gray-500 mb-2">Cohort ROAS trajectory</div>
                                                    <div className="flex items-end gap-px h-10">
                                                        {wif.roasByMonth.map((r, i) => {
                                                            const pct = Math.min(r.roas, 2) / 2;
                                                            const isPayback = r.month === wif.paybackMonth;
                                                            return (
                                                                <div key={i} className="flex-1 flex flex-col items-center justify-end h-full relative group">
                                                                    <div
                                                                        className={'w-full rounded-sm transition-colors ' + (r.roas >= 1 ? 'bg-emerald-400' : 'bg-red-300')}
                                                                        style={{ height: Math.max(pct * 100, 4) + '%' }}
                                                                    ></div>
                                                                    {isPayback && (
                                                                        <div className="absolute -top-4 left-1/2 -translate-x-1/2 text-xs font-bold text-emerald-700 whitespace-nowrap">
                                                                            ✓ M{r.month}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                    <div className="flex justify-between text-xs text-gray-300 mt-1">
                                                        <span>M1</span><span>M12</span><span>M24</span>
                                                    </div>
                                                    <div className="flex items-center gap-3 mt-1.5 text-xs text-gray-400">
                                                        <span className="flex items-center gap-1"><span className="inline-block w-2 h-2 rounded-sm bg-red-300"></span>ROAS &lt;100%</span>
                                                        <span className="flex items-center gap-1"><span className="inline-block w-2 h-2 rounded-sm bg-emerald-400"></span>ROAS ≥100%</span>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })()}
                            </div>
                        </div>

                    </div>
                )}
            </div>
        </div>
    );
}

function History({ campaigns, snapshots, changelog }) {
    const [selected, setSelected] = useState(campaigns[0]?.name || '');

    const campSnaps = snapshots.filter(s => s.campaigns[selected]).map(s => ({
        date: s.date, time: s.time, ...s.campaigns[selected]
    }));

    return (
        <div className="space-y-6">
            <div>
                <h2 className="text-xl font-semibold mb-4">Performance History</h2>
                <select value={selected} onChange={e => setSelected(e.target.value)}
                    className="border border-gray-300 rounded-lg px-3 py-2">
                    {campaigns.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                </select>
            </div>

            {campSnaps.length > 0 ? (
                <div className="space-y-2">
                    {campSnaps.map((s, i) => (
                        <div key={i} className="bg-white border border-gray-200 rounded-lg p-4">
                            <div className="grid grid-cols-4 gap-4 text-sm">
                                <div>
                                    <div className="text-xs text-gray-500">Date</div>
                                    <div className="font-semibold">{s.date}</div>
                                    <div className="text-xs text-gray-400">{s.time}</div>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-500">CPA</div>
                                    <div className="font-semibold">${s.cpa?.toFixed(2)}</div>
                                    {i < campSnaps.length - 1 && campSnaps[i+1]?.cpa > 0 && (
                                        <div className={"text-xs " + (s.cpa < campSnaps[i+1].cpa ? 'text-green-600' : 'text-red-600')}>
                                            {s.cpa < campSnaps[i+1].cpa ? '↓' : '↑'} {Math.abs(((s.cpa - campSnaps[i+1].cpa) / campSnaps[i+1].cpa) * 100).toFixed(1)}%
                                        </div>
                                    )}
                                </div>
                                <div>
                                    <div className="text-xs text-gray-500">Conversions</div>
                                    <div className="font-semibold">{s.conversions}</div>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-500">Spend</div>
                                    <div className="font-semibold">${s.spend?.toFixed(2)}</div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            ) : (
                <p className="text-gray-500 text-sm">No snapshots yet for this campaign. Upload data to start tracking.</p>
            )}

            <div>
                <h3 className="text-lg font-semibold mb-3">Activity Log</h3>
                <div className="space-y-2">
                    {changelog.map((entry, i) => (
                        <div key={i} className="bg-white border border-gray-200 rounded-lg p-3">
                            <div className="flex items-center gap-2">
                                <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">{entry.type}</span>
                                <span className="text-xs text-gray-500">{entry.date} {entry.time}</span>
                            </div>
                            <div className="text-sm text-gray-700 mt-1">{entry.description}</div>
                        </div>
                    ))}
                    {!changelog.length && <p className="text-gray-500 text-sm">No activity yet.</p>}
                </div>
            </div>
        </div>
    );
}

function Settings({ settings, updateSettings }) {
    const [s, setS] = useState(settings);

    const Field = ({ label, fieldKey, prefix, suffix, step = '0.01', isPercent = false, hint = '' }) => (
        <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
            {hint && <div className="text-xs text-gray-400 mb-1.5">{hint}</div>}
            <div className="flex items-center gap-2">
                {prefix && <span className="text-gray-500">{prefix}</span>}
                <input type="number" step={step}
                    value={isPercent ? ((s[fieldKey] || 0) * 100).toFixed(step < 0.01 ? 3 : 1) : s[fieldKey]}
                    onChange={e => setS({...s, [fieldKey]: isPercent ? parseFloat(e.target.value) / 100 : parseFloat(e.target.value)})}
                    className="border border-gray-300 rounded-lg px-3 py-2 w-32 focus:outline-none focus:border-blue-400" />
                {suffix && <span className="text-gray-500 text-sm">{suffix}</span>}
            </div>
        </div>
    );

    return (
        <div className="space-y-8 max-w-2xl">
            <h2 className="text-xl font-semibold">Settings</h2>

            {/* ── Campaign Optimization ─────────────────────────────── */}
            <div className="bg-white border border-gray-200 rounded-xl p-5 space-y-4">
                <div className="text-sm font-bold text-gray-700 border-b border-gray-100 pb-2">📊 Campaign Optimization</div>
                <div className="grid grid-cols-2 gap-4">
                    <Field label="Target CPA" fieldKey="targetCPA" prefix="$" step="0.01" />
                    <Field label="Max Acceptable CPA" fieldKey="maxCPA" prefix="$" step="0.01" />
                    <Field label="Learning Phase Threshold" fieldKey="learningThreshold" suffix="conversions" step="1" />
                    <Field label="Min Daily Clicks" fieldKey="minDailyClicks" suffix="clicks/day" step="1" />
                </div>
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">CPC Stability Requirement</label>
                    <select value={s.stabilityDays} onChange={e => setS({...s, stabilityDays: parseInt(e.target.value)})}
                        className="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none">
                        <option value={1}>1 day (aggressive)</option>
                        <option value={3}>3 days (recommended)</option>
                        <option value={5}>5 days (conservative)</option>
                        <option value={7}>7 days (very stable)</option>
                    </select>
                </div>
            </div>

            {/* ── Ad Revenue Model (Primary) ─────────────────────────────── */}
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-5 space-y-4">
                <div className="text-sm font-bold text-amber-800 border-b border-amber-200 pb-2">💰 Ad Revenue Model <span className="font-normal text-amber-600 ml-2">(Primary revenue driver)</span></div>
                <div className="grid grid-cols-2 gap-4">
                    <Field label="ARPDAU (Ad Revenue per DAU/day)" fieldKey="arpdau" prefix="$" step="0.001"
                        hint="Total daily ad rev ÷ DAU. Derived from eCPM × fill × impressions if known." />
                    <Field label="DAU / MAU Ratio (Stickiness)" fieldKey="dauMauRatio" suffix="%" step="1" isPercent={true}
                        hint="What % of monthly actives open the app on any given day." />
                    <Field label="Avg Ad Impressions per DAU/day" fieldKey="adsPerDau" step="0.1"
                        hint="How many ads the average active user sees per session day." />
                    <Field label="Effective CPM (eCPM)" fieldKey="ecpm" prefix="$" step="0.01"
                        hint="Used to sanity-check ARPDAU. ARPDAU ≈ eCPM/1000 × ads/DAU × fill." />
                    <Field label="Ad Fill Rate" fieldKey="adFillRate" suffix="%" step="1" isPercent={true}
                        hint="% of ad requests filled by your ad network." />
                </div>
                <div className="mt-2 text-xs text-amber-700 bg-amber-100 rounded-lg p-2.5 border border-amber-200">
                    ℹ️ ARPDAU implied from eCPM: <strong>${((s.ecpm||4.5)/1000 * (s.adsPerDau||3) * (s.adFillRate||0.85)).toFixed(4)}/DAU/day</strong>
                    {Math.abs(((s.ecpm||4.5)/1000 * (s.adsPerDau||3) * (s.adFillRate||0.85)) - (s.arpdau||0.035)) > 0.005
                        ? <span className="ml-2 text-amber-800">⚠️ vs your ARPDAU ${(s.arpdau||0.035).toFixed(4)} — adjust if needed</span>
                        : <span className="ml-2 text-green-700">✅ matches your ARPDAU</span>
                    }
                </div>
            </div>

            {/* ── Subscription Revenue Model (Secondary) ─────────────────────────────── */}
            <div className="bg-violet-50 border border-violet-200 rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between border-b border-violet-200 pb-2">
                    <div className="text-sm font-bold text-violet-800">🔒 Subscription Revenue <span className="font-normal text-violet-600 ml-2">(Secondary)</span></div>
                    <label className="flex items-center gap-2 text-sm text-violet-700 cursor-pointer">
                        <input type="checkbox" checked={s.subEnabled !== false} onChange={e => setS({...s, subEnabled: e.target.checked})}
                            className="accent-violet-600" />
                        Enabled
                    </label>
                </div>
                <div className="grid grid-cols-2 gap-4">
                    <Field label="Monthly ARPPU (net of store cut)" fieldKey="arppu" prefix="$" step="0.01"
                        hint="Revenue per paying subscriber per month after app store fee." />
                    <Field label="Trial → Paid Conversion Rate" fieldKey="trialConvRate" suffix="%" step="1" isPercent={true}
                        hint="% of trial starters who become paying subscribers." />
                    <Field label="Server/API Cost per Sub/Month" fieldKey="apiCostPerSub" prefix="$" step="0.01"
                        hint="Incremental server cost per active paying subscriber." />
                </div>
            </div>

            <button onClick={() => updateSettings(s)}
                className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm">
                Save Settings
            </button>
        </div>
    );
}

// ─── RETENTION TAB ───────────────────────────────────────────────────────────
function Retention() {
    const chartRef  = useRef(null);
    const chartInst = useRef(null);
    const ltvRef    = useRef(null);
    const ltvInst   = useRef(null);

    // ── Data sources ──────────────────────────────────────────────────────────
    // Observed DAU retention from cohort data (median across 85 cohorts, Dec 2025 – Feb 2026)
    // All values = fraction of original install cohort still active as DAU on that day
    const OBSERVED = [
        { day: 1,  ret: 0.1034, label: 'D1',  type: 'observed' },
        { day: 2,  ret: 0.0546, label: 'D2',  type: 'observed' },
        { day: 3,  ret: 0.0430, label: 'D3',  type: 'observed' },
        { day: 4,  ret: 0.0351, label: 'D4',  type: 'observed' },
        { day: 5,  ret: 0.0333, label: 'D5',  type: 'observed' },
        { day: 7,  ret: 0.0333, label: 'D7',  type: 'observed' },
        { day: 10, ret: 0.0303, label: 'D10', type: 'observed' },
        { day: 14, ret: 0.0198, label: 'D14', type: 'observed' },
        { day: 21, ret: 0.0187, label: 'D21', type: 'observed' },
        { day: 30, ret: 0.0131, label: 'D30', type: 'observed' },
        { day: 45, ret: 0.0107, label: 'D45', type: 'observed' },
        { day: 75, ret: 0.0054, label: 'D75', type: 'observed' },
    ];

    // Tail fit: f(d) = 0.0236 * exp(-0.01881 * d), half-life = 37 days
    // Anchored to D30/D45/D75 actuals, extrapolated forward
    const A_TAIL = 0.0236, K_TAIL = 0.01881;
    const tailFit = (d) => A_TAIL * Math.exp(-K_TAIL * d);

    // Daily curve for chart (D0–D365)
    const chartDays = [0,1,2,3,4,5,6,7,10,14,21,30,45,60,75,90,120,150,180,240,300,365];
    const piecewise = (d) => {
        if (d === 0) return 1.0;
        const nearby = OBSERVED.find(o => o.day === d);
        if (nearby) return nearby.ret;
        // interpolate between observed points for D1-D75
        const sorted = OBSERVED.slice().sort((a,b) => a.day - b.day);
        for (let i = 0; i < sorted.length - 1; i++) {
            const lo = sorted[i], hi = sorted[i+1];
            if (d >= lo.day && d <= hi.day) {
                const t = (d - lo.day) / (hi.day - lo.day);
                return lo.ret + t * (hi.ret - lo.ret);
            }
        }
        return tailFit(d);
    };

    // End-of-month DAU retention (used in LTV model)
    const EOM_RETENTION = [
        { m: 0,  d: 0,   ret: 1.00000,  type: 'install' },
        { m: 1,  d: 30,  ret: 0.01340,  type: 'observed' },
        { m: 2,  d: 60,  ret: 0.00762,  type: 'extrapolated' },
        { m: 3,  d: 90,  ret: 0.00434,  type: 'extrapolated' },
        { m: 4,  d: 120, ret: 0.00247,  type: 'extrapolated' },
        { m: 5,  d: 150, ret: 0.00140,  type: 'extrapolated' },
        { m: 6,  d: 180, ret: 0.00080,  type: 'extrapolated' },
        { m: 7,  d: 210, ret: 0.00045,  type: 'extrapolated' },
        { m: 8,  d: 240, ret: 0.00026,  type: 'extrapolated' },
        { m: 9,  d: 270, ret: 0.00015,  type: 'extrapolated' },
        { m: 10, d: 300, ret: 0.00008,  type: 'extrapolated' },
        { m: 11, d: 330, ret: 0.00005,  type: 'extrapolated' },
        { m: 12, d: 360, ret: 0.00003,  type: 'extrapolated' },
    ];

    // Cumulative ad LTV per install (integrate DAU-days × ARPDAU)
    const ARPDAU = 0.157;
    const cumulativeLTV = [];
    let running = 0;
    for (let m = 0; m <= 12; m++) {
        const dStart = m * 30, dEnd = (m + 1) * 30;
        let dauDays = 0;
        for (let d = dStart; d < dEnd; d++) {
            dauDays += d <= 75 ? piecewise(d) : tailFit(d);
        }
        running += dauDays * ARPDAU;
        cumulativeLTV.push({ m, ltv: running, dauDays });
    }

    useEffect(() => {
        if (!chartRef.current) return;
        if (chartInst.current) chartInst.current.destroy();

        const labels = chartDays.map(d => `D${d}`);
        const curveData = chartDays.map(d => ({ x: d, y: +(piecewise(d) * 100).toFixed(3) }));
        const obsData = OBSERVED.map(o => ({ x: o.day, y: +(o.ret * 100).toFixed(3) }));
        const extraData = [30, 45, 60, 75, 90, 120, 150, 180].map(d => ({ x: d, y: +(tailFit(d) * 100).toFixed(3) }));

        chartInst.current = new Chart(chartRef.current, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'DAU Retention (interpolated)',
                        data: curveData,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59,130,246,0.08)',
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 0,
                        parsing: false,
                    },
                    {

                        backgroundColor: '#10b981',
                        pointRadius: 6,
                        pointHoverRadius: 8,
                        type: 'scatter',
                        parsing: false,
                    },
                    {
                        label: 'Tail extrapolation (half-life 37d)',
                        data: extraData,
                        borderColor: '#f59e0b',
                        borderWidth: 2,
                        borderDash: [5, 4],
                        pointRadius: 3,
                        backgroundColor: '#f59e0b',
                        parsing: false,
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    x: { type: 'linear', title: { display: true, text: 'Days since install', font: { size: 11 } },
                         ticks: { font: { size: 10 } }, grid: { color: 'rgba(0,0,0,0.05)' } },
                    y: { beginAtZero: true, title: { display: true, text: 'DAU Retention (% of install cohort)', font: { size: 11 } },
                         ticks: { callback: v => v + '%', font: { size: 10 } }, grid: { color: 'rgba(0,0,0,0.05)' } }
                },
                plugins: {
                    legend: { position: 'top', labels: { boxWidth: 12, font: { size: 11 } } },
                    tooltip: {
                        callbacks: {
                            label: (ctx) => `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)}% of cohort`
                        }
                    }
                }
            }
        });
        return () => chartInst.current?.destroy();
    }, []);

    useEffect(() => {
        if (!ltvRef.current) return;
        if (ltvInst.current) ltvInst.current.destroy();

        ltvInst.current = new Chart(ltvRef.current, {
            type: 'line',
            data: {
                labels: cumulativeLTV.map(r => `M${r.m}`),
                datasets: [
                    {
                        label: 'Cumulative ad LTV/install',
                        data: cumulativeLTV.map(r => +r.ltv.toFixed(4)),
                        borderColor: '#f59e0b',
                        backgroundColor: 'rgba(245,158,11,0.1)',
                        borderWidth: 2.5,
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, ticks: { callback: v => '$' + v.toFixed(3), font: { size: 10 } }, grid: { color: 'rgba(0,0,0,0.05)' } },
                    x: { ticks: { font: { size: 10 } } }
                },
                plugins: {
                    legend: { display: false },
                    tooltip: { callbacks: { label: ctx => `LTV: $${ctx.parsed.y.toFixed(4)}/install` } }
                }
            }
        });
        return () => ltvInst.current?.destroy();
    }, []);

    const fmtPct = v => (v * 100).toFixed(v < 0.001 ? 4 : v < 0.01 ? 3 : 2) + '%';

    return (
        <div className="space-y-6">
            {/* Header */}
            <div className="flex items-start justify-between">
                <div>
                    <h2 className="text-xl font-semibold">DAU Retention Curve</h2>
                    <p className="text-sm text-gray-500 mt-0.5">Spider Solitaire Android · 85 cohorts · Dec 1 2025 – Feb 23 2026 · US market</p>
                </div>
                <div className="bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 text-xs text-blue-700 text-right">
                    <div className="font-semibold">12M Ad LTV/install</div>
                    <div className="text-2xl font-bold text-blue-800 mt-0.5">${cumulativeLTV[12]?.ltv.toFixed(3)}</div>
                    <div className="text-blue-500 mt-0.5">@ ARPDAU ${ARPDAU}</div>
                </div>
            </div>

            {/* Key benchmarks */}
            <div className="grid grid-cols-6 gap-3">
                {[
                    { label: 'D1 Retention',  val: fmtPct(0.1034), badge: 'OBSERVED',  bg: 'bg-emerald-50', text: 'text-emerald-600', badgeCls: 'bg-emerald-50 text-emerald-700 border-emerald-200' },

            <div className="grid grid-cols-2 gap-5">
                <div className="bg-white border border-gray-200 rounded-xl p-4">
                    <div className="flex items-center justify-between mb-3">
                        <div className="text-sm font-semibold text-gray-700">DAU Retention Curve (D0–D365)</div>
                        <div className="flex gap-3 text-xs text-gray-500">
                            <span className="flex items-center gap-1"><span className="w-3 h-0.5 bg-blue-500 inline-block"></span> Interpolated</span>
                            <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Observed</span>
                            <span className="flex items-center gap-1"><span className="w-3 h-0.5 bg-amber-400 border-dashed border-t-2 inline-block"></span> Extrapolated</span>
                        </div>
                    </div>
                    <div style={{height: 240}}><canvas ref={chartRef}></canvas></div>
                </div>
                <div className="bg-white border border-gray-200 rounded-xl p-4">
                    <div className="text-sm font-semibold text-gray-700 mb-1">Cumulative Ad LTV / Install</div>
                    <div className="text-xs text-gray-400 mb-3">Integrating daily DAU × $0.157 ARPDAU over 12 months</div>
                    <div style={{height: 224}}><canvas ref={ltvRef}></canvas></div>
                </div>
            </div>

            {/* Monthly table */}
            <div className="grid grid-cols-2 gap-5">
                {/* End-of-month retention */}
                <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                    <div className="bg-gray-50 px-4 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wide">
                        Monthly DAU Retention (end of month)
                    </div>
                    <table className="w-full text-sm">
                        <thead>
                            <tr className="text-xs text-gray-400 border-b border-gray-100">
                                <th className="px-4 py-2 text-left">Month</th>
                                <th className="px-4 py-2 text-right">Day</th>
                                <th className="px-4 py-2 text-right">DAU Ret %</th>
                                <th className="px-4 py-2 text-right">DAU / 1k installs</th>
                                <th className="px-4 py-2 text-left">Source</th>
                            </tr>
                        </thead>
                        <tbody>
                            {EOM_RETENTION.map(r => (
                                <tr key={r.m} className="border-b border-gray-50 hover:bg-gray-50">
                                    <td className="px-4 py-1.5 font-medium text-gray-700">M{r.m}</td>
                                    <td className="px-4 py-1.5 text-right text-gray-500 font-mono text-xs">D{r.d}</td>
                                    <td className="px-4 py-1.5 text-right font-mono text-xs font-semibold text-blue-700">{fmtPct(r.ret)}</td>
                                    <td className="px-4 py-1.5 text-right text-gray-600">{(r.ret * 1000).toFixed(1)}</td>
                                    <td className="px-4 py-1.5">
                                        <span className={`text-xs px-1.5 py-0.5 rounded font-medium ${
                                            r.type === 'observed' ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' :
                                            r.type === 'install'  ? 'bg-blue-50 text-blue-700 border border-blue-200' :
                                            'bg-amber-50 text-amber-700 border border-amber-200'
                                        }`}>{r.type}</span>
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>

                {/* Monthly LTV buildup */}
                <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
                    <div className="bg-gray-50 px-4 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wide">
                        Monthly Ad Revenue per Install (ARPDAU ${ARPDAU})
                    </div>
                    <table className="w-full text-sm">
                        <thead>
                            <tr className="text-xs text-gray-400 border-b border-gray-100">
                                <th className="px-4 py-2 text-left">Month</th>
                                <th className="px-4 py-2 text-right">DAU-days / install</th>
                                <th className="px-4 py-2 text-right">Monthly rev / install</th>
                                <th className="px-4 py-2 text-right">Cumul LTV</th>
                            </tr>
                        </thead>
                        <tbody>
                            {cumulativeLTV.map(r => (
                                <tr key={r.m} className={`border-b border-gray-50 hover:bg-gray-50 ${r.m === 0 ? 'bg-amber-50/30' : ''}`}>
                                    <td className="px-4 py-1.5 font-medium text-gray-700">M{r.m}</td>
                                    <td className="px-4 py-1.5 text-right font-mono text-xs text-gray-500">{r.dauDays.toFixed(3)}</td>
                                    <td className="px-4 py-1.5 text-right font-mono text-xs text-amber-700">${(r.dauDays * ARPDAU).toFixed(4)}</td>
                                    <td className="px-4 py-1.5 text-right font-bold text-blue-700">${r.ltv.toFixed(4)}</td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>

            {/* Methodology note */}
            <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 text-xs text-gray-500 space-y-1.5">
                <div className="font-semibold text-gray-700 text-sm">📐 Methodology</div>
                <div><span className="font-medium text-gray-600">Data:</span> 85 daily cohorts (Dec 1 2025 – Feb 23 2026), US, Spider Solitaire Android. Cohorts &lt;20 installs excluded. Outlier retention values &gt;50% excluded.</div>
                <div><span className="font-medium text-gray-600">Observed range:</span> D1–D75. Median used across cohorts (more robust than mean given small cohort sizes).</div>
                <div><span className="font-medium text-gray-600">Extrapolation (D75+):</span> Exponential decay fitted to D30/D45/D75 anchor points: <code className="bg-gray-100 px-1 rounded">f(d) = 0.0236 × e^(−0.01881d)</code>. Half-life = 37 days. This is a <strong>lower bound</strong> — solitaire games often show a long-tail loyal-player floor not captured in 85 days of data.</div>
                <div><span className="font-medium text-gray-600">LTV:</span> Integrates daily DAU retention × $0.157 ARPDAU (from mediation report). Install month = 1.775 DAU-days/install (includes spike on install day).</div>
            </div>
        </div>
    );
}

    function parseRedditCSV(text) {
        const lines = text.split('\n');
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
        const colIdx = h => headers.indexOf(h);
        const subIdx = colIdx('Subreddit');
        const dateIdx = colIdx('Date');
        const spendIdx = colIdx('Amount Spent (USD)');
        const installIdx = colIdx('(MMP) Total App Installs');
        const trialIdx = colIdx('(MMP) App Purchases');
        const impIdx = colIdx('Impressions');

        const agg = {};
        const daily = {}; // sub -> date -> {spend, installs, trials, impressions}

        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const cols = lines[i].split(',');
            const sub = (cols[subIdx] || '').trim().replace(/^"|"$/g,'');
            const date = (cols[dateIdx] || '').trim().replace(/^"|"$/g,'');
            if (!sub) continue;
            const spend = parseFloat(cols[spendIdx]) || 0;
            if (spend === 0) continue;
            if (!agg[sub]) agg[sub] = { spend: 0, installs: 0, trials: 0, impressions: 0 };
            agg[sub].spend += spend;
            agg[sub].installs += parseInt(cols[installIdx]) || 0;
            agg[sub].trials += parseInt(cols[trialIdx]) || 0;
            agg[sub].impressions += parseInt(cols[impIdx]) || 0;
            // Daily
            if (date) {
                if (!daily[sub]) daily[sub] = {};
                if (!daily[sub][date]) daily[sub][date] = { spend: 0, installs: 0, trials: 0, impressions: 0 };
                daily[sub][date].spend = Math.round((daily[sub][date].spend + spend) * 100) / 100;
                daily[sub][date].installs += parseInt(cols[installIdx]) || 0;
                daily[sub][date].trials += parseInt(cols[trialIdx]) || 0;
                daily[sub][date].impressions += parseInt(cols[impIdx]) || 0;
            }
        }
        return Object.entries(agg)
            .filter(([, d]) => d.trials >= 3)
            .map(([sub, d]) => ({
                sub, spend: Math.round(d.spend * 100) / 100,
                installs: d.installs, trials: d.trials, impressions: d.impressions,
                cpa: Math.round(d.spend / d.trials * 100) / 100,
                cpi: d.installs ? Math.round(d.spend / d.installs * 100) / 100 : 0,
                daily: daily[sub] || {}
            }))
            .sort((a, b) => a.cpa - b.cpa);
    }

    }

// ─── COMMUNITIES INSIGHTS ────────────────────────────────────────────────────
function CommunitiesInsights({ data, periods, activePeriod, cpaThreshGreen, cpaThreshYellow, TIER }) {
    const scatterRef = useRef(null);
    const scatterInst = useRef(null);
    const donutRef = useRef(null);
    const donutInst = useRef(null);
    const sparklineRefs = useRef({});
    const sparklineInsts = useRef({});
    const [highlightSub, setHighlightSub] = useState(null);

    // ── Sorted by spend descending for the sparkline table ────────────────
    const bySpend = [...data].sort((a,b) => b.spend - a.spend).slice(0, 15);

    // ── All dates in period ───────────────────────────────────────────────
    const allDates = [...new Set(
        data.flatMap(d => Object.keys(d.daily || {}))
    )].sort();

    // ── 7-day rolling CPA per sub ─────────────────────────────────────────
    function rollingCPA(subData, windowSize = 7) {
        const daily = subData.daily || {};
        return allDates.map((date, i) => {
            const window = allDates.slice(Math.max(0, i - windowSize + 1), i + 1);
            const spend = window.reduce((s, d) => s + (daily[d]?.spend || 0), 0);
            const trials = window.reduce((s, d) => s + (daily[d]?.trials || 0), 0);
            return trials > 0 ? spend / trials : null;
        });
    }

    // ── Tier spend breakdown ───────────────────────────────────────────────
    const tierSpend = { green: 0, yellow: 0, red: 0 };
    const tierTrials = { green: 0, yellow: 0, red: 0 };
    data.forEach(d => {
        tierSpend[d.tier] += d.spend;
        tierTrials[d.tier] += d.trials;
    });
    const totalSpend = Object.values(tierSpend).reduce((a,b) => a+b, 0);
    const totalTrials = Object.values(tierTrials).reduce((a,b) => a+b, 0);

    // ── Scatter chart: Spend vs CPA, bubble = trials ──────────────────────
    useEffect(() => {
        if (!scatterRef.current) return;
        if (scatterInst.current) scatterInst.current.destroy();

        const green = data.filter(d => d.tier === 'green');
        const yellow = data.filter(d => d.tier === 'yellow');
        const red = data.filter(d => d.tier === 'red');

        const makeDataset = (arr, color, label) => ({
            label,
            data: arr.map(d => ({ x: d.spend, y: d.cpa, r: Math.max(4, Math.sqrt(d.trials) * 3), sub: d.sub })),
            backgroundColor: color + '99',
            borderColor: color,
            borderWidth: 1.5,
        });

        scatterInst.current = new Chart(scatterRef.current, {
            type: 'bubble',
            data: {
                datasets: [

                        ),
