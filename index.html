<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Solitaire Modeling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Simple localStorage helpers
const store = {
    get: (key) => {
        try {
            const v = localStorage.getItem(key);
            return v ? JSON.parse(v) : null;
        } catch(e) { return null; }
    },
    set: (key, value) => {
        try {
            localStorage.setItem(key, JSON.stringify(value));
        } catch(e) { console.error('Save error:', e); }
    }
};

// ── DUMMY DATA (pre-loaded so dashboard works out of the box) ────────────────
const DUMMY_CAMPAIGNS = (() => {
    const makeDaily = (key, baseSpend, baseCPI, baseOptIn, platform, startDate, numDays) => {
        const data = {};
        const start = new Date(startDate);
        for (let i = 0; i < numDays; i++) {
            const d = new Date(start); d.setDate(d.getDate() + i);
            const dateStr = d.toISOString().split('T')[0];
            const noise = () => 0.8 + Math.random() * 0.4;
            const spend = baseSpend * noise();
            const clicks = Math.round(spend / (0.35 * noise()));
            const impressions = clicks * Math.round(15 + Math.random() * 10);
            const installs = Math.round(spend / (baseCPI * noise()));
            const trials = Math.round(installs * baseOptIn * noise());
            const modeledPaidSubs = trials * 0.40;
            data[dateStr] = { spend, clicks, impressions, installs, trials, modeledPaidSubs, cpc: clicks > 0 ? spend / clicks : 0 };
        }
        return data;
    };
    return {
        'Meta - Puzzle Lovers (US)':       { name: 'Meta - Puzzle Lovers (US)',       platform: 'Meta',    dailyData: makeDaily('meta-puzz', 210, 0.63, 0.43, 'Meta',    '2026-01-15', 40) },
        'Meta - Brain Games 35-54 (US)':   { name: 'Meta - Brain Games 35-54 (US)',   platform: 'Meta',    dailyData: makeDaily('meta-brain', 145, 0.71, 0.39, 'Meta',    '2026-01-18', 37) },
        'Google UAC - Broad (US)':         { name: 'Google UAC - Broad (US)',         platform: 'Google',  dailyData: makeDaily('goog-broad', 185, 0.58, 0.47, 'Google',  '2026-01-15', 40) },
        'Google UAC - Card Games (US)':    { name: 'Google UAC - Card Games (US)',    platform: 'Google',  dailyData: makeDaily('goog-card',  95,  0.67, 0.41, 'Google',  '2026-01-20', 35) },
        'App Store Search - US':           { name: 'App Store Search - US',           platform: 'ASA',     dailyData: makeDaily('asa-us',     230, 0.54, 0.55, 'ASA',     '2026-01-15', 40) },
        'App Store Search - CA/AU':        { name: 'App Store Search - CA/AU',        platform: 'ASA',     dailyData: makeDaily('asa-ca',     80,  0.61, 0.48, 'ASA',     '2026-01-22', 33) },
        'TikTok - Casual Gamers 18-34':    { name: 'TikTok - Casual Gamers 18-34',   platform: 'TikTok',  dailyData: makeDaily('tik-cas',    120, 0.82, 0.36, 'TikTok',  '2026-01-25', 30) },
    };
})();

// ── DUMMY INSTALL DATA (MAU tracking) ─────────────────────────────────────
// Keyed by date, each day has total installs from all sources
const DUMMY_INSTALL_DATA = (() => {
    const data = {};
    const start = new Date('2026-01-15');
    for (let i = 0; i < 40; i++) {
        const d = new Date(start); d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const noise = () => 0.75 + Math.random() * 0.5;
        data[dateStr] = {
            organic: Math.round(120 * noise()),
            paid: Math.round(280 * noise()),
            total: 0,
            mau: 0, // will be computed
        };
        data[dateStr].total = data[dateStr].organic + data[dateStr].paid;
    }
    return data;
})();

function App() {
    const [tab, setTab] = useState('dashboard');
    const [campaigns, setCampaigns] = useState(DUMMY_CAMPAIGNS);
    const [installData, setInstallData] = useState(DUMMY_INSTALL_DATA);
    const [adRevenueData, setAdRevenueData] = useState({});   // keyed by date
    const [campaignMeta, setCampaignMeta] = useState({});
    const [snapshots, setSnapshots] = useState([]);
    const [changelog, setChangelog] = useState([{ date: new Date().toISOString().split('T')[0], time:'', type:'seed', description:'Demo data loaded' }]);
    const [settings, setSettings] = useState({
        targetCPA: 2.50,
        maxCPA: 8.00,
        minDailyClicks: 50,
        learningThreshold: 50,
        stabilityDays: 3,
        stabilityTolerance: 0.05,
        // Ad revenue params — defaults based on real Spider Solitaire data
        arpdau: 0.157,          // avg from mediation report
        dauMauRatio: 1.0,           // 1.0 = retention curve is DAU retention (fitted from cohort data)
        adsPerDau: 121,         // avg Imp/dau from report
        ecpm: 1.32,             // avg eCPM from report
        adFillRate: 0.953,      // avg Ad Viewer Rate from report
        // Subscription params (secondary)
        arppu: 2.70,
        trialConvRate: 0.40,
        apiCostPerSub: 1.00,
        subEnabled: true,
    });
    const [uploading, setUploading] = useState(false);
    const [uploadingInstalls, setUploadingInstalls] = useState(false);
    const [uploadingAdRev, setUploadingAdRev] = useState(false);
    const [timeframes, setTimeframes] = useState({});

    useEffect(() => {
        const c = store.get('nw-campaigns'); if (c) setCampaigns(prev => ({...DUMMY_CAMPAIGNS, ...c}));
        const inst = store.get('nw-installs'); if (inst) setInstallData(prev => ({...DUMMY_INSTALL_DATA, ...inst}));
        const adrev = store.get('nw-adrev'); if (adrev) setAdRevenueData(adrev);
        const m = store.get('nw-meta'); if (m) setCampaignMeta(m);
        const s = store.get('nw-snapshots'); if (s) setSnapshots(s);
        const l = store.get('nw-changelog'); if (l) setChangelog(l);
        const st = store.get('nw-settings'); if (st) setSettings(st);
    }, []);

    const save = (key, value) => store.set(key, value);

    // ── Shared date normaliser ─────────────────────────────────────────────────
    // Handles: "2026-01-25", "Sun, Jan 25, 2026", "Jan 25, 2026", "01/25/2026"
    const normaliseDate = (raw) => {
        if (!raw) return null;
        const s = raw.toString().trim().replace(/^"+|"+$/g, '');
        // Already ISO
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        // "Sun, Jan 25, 2026" or "Jan 25, 2026"
        const longMatch = s.match(/(?:\w+,\s+)?(\w+ \d{1,2},\s+\d{4})/);
        if (longMatch) {
            const d = new Date(longMatch[1]);
            if (!isNaN(d)) return d.toISOString().split('T')[0];
        }
        // MM/DD/YYYY or M/D/YYYY
        const slashMatch = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (slashMatch) return `${slashMatch[3]}-${slashMatch[1].padStart(2,'0')}-${slashMatch[2].padStart(2,'0')}`;
        // Last-ditch
        const d = new Date(s);
        if (!isNaN(d)) return d.toISOString().split('T')[0];
        return null;
    };

    // ── UA / Ad Platform upload ───────────────────────────────────────────────
    const handleUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);

        // Derive a campaign name from the filename as fallback
        const fileBaseName = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                if (!results.data.length) { alert('No rows found in CSV'); setUploading(false); return; }
                const cols = Object.keys(results.data[0]);
                const updated = { ...campaigns };
                const newDates = new Set();
                const affected = new Set();

                // ── Format detection ──────────────────────────────────────────
                const has = (c) => cols.some(k => k.trim() === c);

                // Google Ads time-series: Date, Cost, Installs (no Campaign Name)
                const isGoogleTimeSeries = has('Cost') && has('Installs') && has('Date') && !has('Campaign Name') && !has('Adset');

                // ASA: Adset + af_subscribe
                const isASA = has('Adset') && has('af_subscribe');

                // Standard MMP: Campaign Name + (MMP) columns
                const isStandard = has('Campaign Name');

                results.data.forEach(row => {
                    const rawDate = row['Date'] || row['date'] || row['Day'] || '';
                    const date = normaliseDate(rawDate);
                    if (!date) return;

                    if (isGoogleTimeSeries) {
                        // Single-campaign totals export from Google Ads
                        const name = 'Google Ads – ' + fileBaseName;
                        if (!updated[name]) updated[name] = { name, platform: 'Google', dailyData: {} };
                        if (!updated[name].dailyData[date]) newDates.add(date);

                        const spend = parseFloat((row['Cost'] || '0').toString().replace(/[$,]/g, '')) || 0;
                        const installs = Math.round(parseFloat(row['Installs'] || 0));
                        const clicks = Math.round(parseFloat((row['Clicks'] || row['clicks'] || 0).toString().replace(/,/g,'')));
                        const impressions = Math.round(parseFloat((row['Impressions'] || row['impressions'] || 0).toString().replace(/,/g,'')));

                        updated[name].dailyData[date] = {
                            spend, clicks, impressions, installs,
                            cpc: clicks > 0 ? spend / clicks : 0,
                            trials: 0, modeledPaidSubs: 0
                        };
                        affected.add(name);
                        return;
                    }

                    if (isASA) {
                        const adset = row['Adset'];
                        if (!adset) return;
                        const name = 'ASA – ' + adset;
                        if (!updated[name]) updated[name] = { name, platform: 'ASA', dailyData: {} };
                        if (!updated[name].dailyData[date]) newDates.add(date);

                        const installs = parseInt(row['Installs appsflyer']) || 0;
                        const trials   = parseInt(row['af_subscribe']) || 0;
                        updated[name].dailyData[date] = {
                            spend: parseFloat((row['Cost']||'0').toString().replace(/[$,]/g,'')) || 0,
                            clicks: 0, cpc: 0, impressions: 0,
                            installs, trials, modeledPaidSubs: trials * 0.40
                        };
                        affected.add(name);
                        return;
                    }

                    if (isStandard) {
                        const name = (row['Campaign Name'] || '').trim();
                        if (!name) return;
                        if (!updated[name]) updated[name] = { name, dailyData: {} };
                        if (!updated[name].dailyData[date]) newDates.add(date);

                        const installs = parseInt(row['(MMP) Total App Installs'] || row['Installs'] || 0);
                        const trials   = parseInt(row['(MMP) App Purchases'] || row['Trials'] || 0);
                        const spend    = parseFloat((row['Amount Spent (USD)'] || row['Cost'] || row['Spend'] || '0').toString().replace(/[$,]/g,'')) || 0;

                        updated[name].dailyData[date] = {
                            spend,
                            clicks:      parseInt((row['Clicks']||'0').toString().replace(/,/g,'')) || 0,
                            cpc:         parseFloat(row['CPC (USD)'] || 0) || 0,
                            impressions: parseInt((row['Impressions']||'0').toString().replace(/,/g,'')) || 0,
                            installs, trials, modeledPaidSubs: trials * 0.40
                        };
                        affected.add(name);
                        return;
                    }

                    // Unknown format — try to infer a single campaign from filename
                    const name = fileBaseName || 'Imported Campaign';
                    if (!updated[name]) updated[name] = { name, platform: 'Unknown', dailyData: {} };
                    const spend = parseFloat((row['Cost'] || row['Spend'] || row['Amount Spent (USD)'] || '0').toString().replace(/[$,]/g,'')) || 0;
                    const installs = Math.round(parseFloat(row['Installs'] || 0));
                    if (!updated[name].dailyData[date]) newDates.add(date);
                    updated[name].dailyData[date] = { spend, clicks:0, cpc:0, impressions:0, installs, trials:0, modeledPaidSubs:0 };
                    affected.add(name);
                });

                if (!affected.size) {
                    alert(`Couldn't detect a recognised format.\n\nColumns found: ${cols.join(', ')}\n\nExpected one of:\n• Google Ads time-series: Date, Cost, Installs\n• Standard MMP: Campaign Name, Date, Amount Spent (USD), (MMP) Total App Installs\n• ASA: Adset, Date, Cost, Installs appsflyer, af_subscribe`);
                    setUploading(false);
                    return;
                }

                const snapshot = {
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString(),
                    timestamp: new Date().toISOString(),
                    campaigns: {}
                };
                Object.keys(updated).forEach(name => {
                    const m = getMetrics(updated[name], settings);
                    if (m) snapshot.campaigns[name] = { cpa: m.cpa, cpc: m.cpc, cvr: m.cvr, conversions: m.conversions, spend: m.spend };
                });

                const newSnapshots = [snapshot, ...snapshots].slice(0, 100);
                const newLog = [{
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString(),
                    type: 'upload',
                    description: `Uploaded: ${[...affected].join(', ')} · ${newDates.size} new dates`
                }, ...changelog];

                setCampaigns(updated);
                setSnapshots(newSnapshots);
                setChangelog(newLog);
                save('nw-campaigns', updated);
                save('nw-snapshots', newSnapshots);
                save('nw-changelog', newLog);
                setUploading(false);
                setTab('dashboard');
            },
            error: () => { alert('Error parsing CSV'); setUploading(false); }
        });
    };

    // ── Install / MAU data upload ─────────────────────────────────────────────
    const handleInstallUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadingInstalls(true);
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                const updated = { ...installData };
                let newCount = 0;

                results.data.forEach(row => {
                    const rawDate = row['Date'] || row['date'] || row['Day'] || '';
                    const date = normaliseDate(rawDate);
                    if (!date) return;

                    // Strip $ and commas from any numeric field
                    const clean = (v) => parseFloat((v||'0').toString().replace(/[$,]/g,'')) || 0;

                    const total   = Math.round(clean(row['Installs'] || row['installs'] || row['Total Installs']));
                    const organic = Math.round(clean(row['Organic Installs'] || row['organic'] || row['Organic']));
                    const paid    = Math.round(clean(row['Non-organic Installs'] || row['paid'] || row['Paid'])) || (total - organic);
                    const mau     = Math.round(clean(row['MAU'] || row['Monthly Active Users'] || row['Active Users']));
                    const dau     = Math.round(clean(row['DAU'] || row['Daily Active Users']));
                    // Google Ads time-series also works here for install-level data
                    const spend   = clean(row['Cost'] || row['Amount Spent (USD)'] || row['Spend']);

                    if (!updated[date]) newCount++;
                    updated[date] = {
                        ...updated[date],
                        total:   total   || updated[date]?.total   || 0,
                        organic: organic || updated[date]?.organic || 0,
                        paid:    paid    || updated[date]?.paid    || 0,
                        mau:     mau     || updated[date]?.mau     || 0,
                        dau:     dau     || updated[date]?.dau     || 0,
                        spend:   spend   || updated[date]?.spend   || 0,
                    };
                });

                const newLog = [{
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString(),
                    type: 'install-upload',
                    description: `Install data: ${newCount} new dates, ${Object.keys(updated).length} total days`
                }, ...changelog];

                setInstallData(updated);
                setChangelog(newLog);
                save('nw-installs', updated);
                save('nw-changelog', newLog);
                setUploadingInstalls(false);
                setTab('dashboard');
            },
            error: () => { alert('Error parsing install CSV'); setUploadingInstalls(false); }
        });
    };

    // ── Ad Revenue / Mediation report upload ──────────────────────────────────
    // Supports: pub_adv_mediation_analytics format (Day, Country, DAU, ARPDAU, Est. Revenue, eCPM, ...)
    const handleAdRevUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadingAdRev(true);
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                if (!results.data.length) { alert('No rows found'); setUploadingAdRev(false); return; }
                const updated = { ...adRevenueData };
                let newCount = 0;
                const clean = (v) => parseFloat((v||'0').toString().replace(/[$,]/g,'')) || 0;

                results.data.forEach(row => {
                    // Date column: 'Day' or 'Date'
                    const rawDate = row['Day'] || row['Date'] || row['date'] || '';
                    const date = normaliseDate(rawDate);
                    if (!date) return;

                    const country  = (row['Country'] || 'ALL').trim();
                    const key      = `${date}__${country}`;   // store per date+country

                    if (!updated[key]) newCount++;
                    updated[key] = {
                        date,
                        country,
                        dau:           Math.round(clean(row['DAU'])),
                        dav:           Math.round(clean(row['DAV'] || row['Daily Ad Viewers'] || 0)),
                        requests:      Math.round(clean(row['Requests'])),
                        arpdau:        clean(row['ARPDAU']),
                        estRevenue:    clean(row['Est. Revenue'] || row['Revenue'] || row['est_revenue']),
                        ecpm:          clean(row['eCPM']),
                        adViewerRate:  clean(row['Ad Viewer Rate'] || row['Fill Rate'] || 0),
                        reqPerDau:     clean(row['Req/dau'] || 0),
                        impPerDau:     clean(row['Imp/dau'] || 0),
                        app:           (row['Application Filter'] || '').replace(/\s*\(Include\)\s*$/, '').trim(),
                    };
                });

                // Compute avg ARPDAU from loaded data to auto-update settings
                const allRows = Object.values(updated);
                const avgArpdau = allRows.length
                    ? allRows.reduce((s,r) => s + r.arpdau, 0) / allRows.length
                    : settings.arpdau;
                const avgEcpm = allRows.length
                    ? allRows.reduce((s,r) => s + r.ecpm, 0) / allRows.length
                    : settings.ecpm;
                const avgFill = allRows.length
                    ? allRows.reduce((s,r) => s + r.adViewerRate, 0) / allRows.length
                    : settings.adFillRate;
                const avgImpDau = allRows.length
                    ? allRows.reduce((s,r) => s + r.impPerDau, 0) / allRows.length
                    : settings.adsPerDau;

                const updatedSettings = {
                    ...settings,
                    arpdau:       Math.round(avgArpdau * 10000) / 10000,
                    ecpm:         Math.round(avgEcpm  * 10000) / 10000,
                    adFillRate:   Math.round(avgFill  * 10000) / 10000,
                    adsPerDau:    Math.round(avgImpDau * 10) / 10,
                };

                const newLog = [{
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString(),
                    type: 'adrev-upload',
                    description: `Ad revenue data: ${newCount} new date/country rows · avg ARPDAU ${avgArpdau.toFixed(4)} · avg eCPM ${avgEcpm.toFixed(4)} · settings auto-updated`
                }, ...changelog];

                setAdRevenueData(updated);
                setSettings(updatedSettings);
                setChangelog(newLog);
                save('nw-adrev', updated);
                save('nw-settings', updatedSettings);
                save('nw-changelog', newLog);
                setUploadingAdRev(false);
                setTab('adrevenue');
            },
            error: () => { alert('Error parsing ad revenue CSV'); setUploadingAdRev(false); }
        });
    };
        if (!campaign?.dailyData) return null;
        let dates = Object.keys(campaign.dailyData).sort();
        if (!dates.length) return null;

        if (days && days !== 'all') {
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            const cutoffStr = cutoff.toISOString().split('T')[0];
            dates = dates.filter(d => d >= cutoffStr);
        }
        if (!dates.length) return null;

        let spend = 0, clicks = 0, impressions = 0, installs = 0, trials = 0, modeledPaidSubs = 0;
        dates.forEach(d => {
            const day = campaign.dailyData[d];
            spend += day.spend;
            clicks += day.clicks;
            impressions += day.impressions || 0;
            installs += day.installs || 0;
            trials += day.trials || 0;
            modeledPaidSubs += day.modeledPaidSubs || 0;
        });

        // Opt-in rate = trials / installs (live from campaign data)
        const optInRate = installs > 0 ? trials / installs : 0;
        // Conversions = modeled paid subs (trials * 40%)
        const conversions = modeledPaidSubs;
        const daysCount = dates.length;

        return {
            name: campaign.name,
            dailyData: campaign.dailyData,
            dates,
            spend,
            clicks,
            impressions,
            installs,
            trials,
            modeledPaidSubs,
            conversions,
            optInRate,
            // CPA = spend / modeled paid subs (trials * 40%)
            cpa: conversions > 0 ? spend / conversions : 0,
            cpc: clicks > 0 ? spend / clicks : 0,
            cpi: installs > 0 ? spend / installs : 0,
            ctr: impressions > 0 ? clicks / impressions * 100 : 0,
            // CVR = trials / clicks (click to trial rate)
            cvr: clicks > 0 ? trials / clicks * 100 : 0,
            daysCount,
            avgClicks: daysCount > 0 ? clicks / daysCount : 0,
            inLearning: conversions < s.learningThreshold,
            lowVolume: (daysCount > 0 ? clicks / daysCount : 0) < s.minDailyClicks,
            startDate: dates[0],
            endDate: dates[dates.length - 1]
        };
    };

    const getBroadLearnings = (name) => {
        const meta = campaignMeta[name];
        if (!meta?.learningSource) return null;
        const broad = campaigns[meta.learningSource];
        if (!broad) return null;
        const bm = getMetrics(broad, settings, 7);
        if (!bm) return null;
        const recent = bm.dates.slice(-settings.stabilityDays);
        const cpcs = recent.map(d => broad.dailyData[d].cpc);
        const avg = cpcs.reduce((a, b) => a + b, 0) / cpcs.length;
        const stable = cpcs.every(c => Math.abs(c - avg) / avg <= settings.stabilityTolerance);
        return { broadName: meta.learningSource, metrics: bm, avgCPC: avg, stable, stableDays: cpcs.length, requiredDays: settings.stabilityDays };
    };

    const getRec = (m, broad) => {
        if (!m || m.conversions === 0) return { action: 'monitor', msg: 'No conversions yet. Keep monitoring.', priority: 'low' };
        
        if (broad?.stable && m.cpc < broad.avgCPC * 0.8) {
            return { action: 'increase', msg: `Broad stable at ${broad.avgCPC.toFixed(2)} with ${broad.metrics.cpa.toFixed(2)} CPA. Increase CPC to match.`, rec: broad.avgCPC.toFixed(2), priority: 'high' };
        }
        if (m.inLearning) {
            if (m.lowVolume) return { action: 'increase', msg: `Learning phase: Need more volume. Increase CPC to get above ${settings.minDailyClicks} clicks/day.`, priority: 'high' };
            return { action: 'maintain', msg: `Learning phase: Volume good (${m.avgClicks.toFixed(0)} clicks/day). Maintain CPC until ${settings.learningThreshold} conversions.`, priority: 'medium' };
        }
        if (m.cpa > settings.maxCPA) return { action: 'pause', msg: `CPA ${m.cpa.toFixed(2)} exceeds max ${settings.maxCPA}. Consider pausing or major changes.`, priority: 'critical' };
        if (m.cpa > settings.targetCPA * 1.3 && !m.lowVolume) {
            const recCPC = (settings.targetCPA * m.cvr / 100).toFixed(2);
            return { action: 'decrease', msg: `CPA ${((m.cpa / settings.targetCPA - 1) * 100).toFixed(0)}% above target. Decrease CPC.`, rec: recCPC, cur: m.cpc.toFixed(2), priority: 'medium' };
        }
        if (m.cpa < settings.targetCPA * 0.8) return { action: 'scale', msg: `CPA below target! Room to scale. Consider increasing budget or CPC.`, priority: 'low' };
        return { action: 'maintain', msg: `On track. CPA ${m.cpa.toFixed(2)}, ${m.avgClicks.toFixed(0)} clicks/day.`, priority: 'low' };
    };

    const updateMeta = (name, updates) => {

        setCampaignMeta(updated);
        save('nw-meta', updated);
    };

    const updateSettings = (s) => {
        setSettings(s);
        save('nw-settings', s);
    };

    const campaignList = Object.keys(campaigns).map(n => getMetrics(campaigns[n], settings)).filter(Boolean);
    const totals = campaignList.reduce((a, c) => ({ spend: a.spend + c.spend, clicks: a.clicks + c.clicks, conversions: a.conversions + c.conversions }), { spend: 0, clicks: 0, conversions: 0 });

}

    const m7  = campaigns.map(c => getMetrics(campaigns_raw[c.name], settings, 7)).filter(Boolean);

    const sum = arr => arr.reduce((s, m) => ({
        spend: s.spend + m.spend,
        trials: s.trials + (m.trials||0),
        installs: s.installs + (m.installs||0),

        clicks: s.clicks + (m.clicks||0),
    }), { spend:0, trials:0, installs:0, conversions:0, clicks:0 });

    const t30 = sum(m30);
    const t7  = sum(m7);

    const cpa30 = t30.conversions > 0 ? t30.spend / t30.conversions : 0;
    const cpa7  = t7.conversions  > 0 ? t7.spend  / t7.conversions  : 0;
    const cpaTrend = cpa30 > 0 && cpa7 > 0 ? ((cpa7 - cpa30) / cpa30 * 100) : null;

    const dauMauRatio = settings.dauMauRatio || 1.0;

    // Observed: D1=10.3%, D7=3.3%, D30=1.31%, D45=1.07%, D75=0.54% — tail extrap half-life 37d

    // Integrate: each month contributes dauRet × ARPDAU × 30 days
    const adLTV12 = dauRetCurve.reduce((s, r) => s + r * arpdau * 30, 0);

        : 0;
    const blendedLTV12 = adLTV12 + subContrib12;
    const liveOptIn30 = t30.installs > 0 ? t30.trials / t30.installs : 0;

    // Unit economics gap vs blended LTV
    const breakEvenCPA = blendedLTV12 > 0 ? blendedLTV12 : (settings.arppu||2.70) * 2.4;
    const unitEconGap = cpa7 > 0 && breakEvenCPA > 0 ? ((cpa7 - breakEvenCPA) / breakEvenCPA * 100) : null;

    // legacy arppu/apiCost for signal board
    const arppu = settings.arppu || 2.70;
    const apiCost = settings.apiCostPerSub || 1.00;

    // ── Daily trend data (last 30 days, all campaigns merged) ─────────────────
    const daily = {};
    campaigns.forEach(c => {
        if (!campaigns_raw[c.name]?.dailyData) return;
        Object.entries(campaigns_raw[c.name].dailyData).forEach(([date, day]) => {
            if (!daily[date]) daily[date] = { spend: 0, trials: 0, paid: 0 };
            daily[date].spend += day.spend || 0;
            daily[date].trials += day.trials || 0;
            daily[date].paid += day.modeledPaidSubs || 0;
        });
    });
    const cutoff30 = new Date(); cutoff30.setDate(cutoff30.getDate() - 30);
    const cutoff30Str = cutoff30.toISOString().slice(0,10);
    const trendDates = Object.keys(daily).filter(d => d >= cutoff30Str).sort();
    const trendCPAs = trendDates.map(d => daily[d].paid > 0 ? daily[d].spend / daily[d].paid : null);
    const trendTrials = trendDates.map(d => daily[d].trials);

    // 7-day rolling avg CPA
    const rollingCPA = trendCPAs.map((_, i) => {
        const window = trendCPAs.slice(Math.max(0, i-6), i+1).filter(v => v !== null);
        return window.length ? window.reduce((a,b)=>a+b,0)/window.length : null;
    });

    const signals = [];

    // Best performer
    const byEff = [...m7].filter(m=>m.trials>0).sort((a,b)=>(b.trials/b.spend)-(a.trials/a.spend));

            body: `${best.name.length > 40 ? best.name.slice(0,38)+'…' : best.name} — ${best.trials} trials at ${best.cpa.toFixed(2)} CPA · ${(best.trials/best.spend*1000).toFixed(1)} trials/$1k`,

    const lowVol = m7.filter(m => m.lowVolume && m.avgClicks < settings.minDailyClicks);

    const calculateHealthScore = (m, settings) => {
        let breakdown = {};
        
        // CPA Score (0-25): Distance from target
        const cpaRatio = m.cpa / (settings.targetCPA || 2.50);
        breakdown.cpa = cpaRatio <= 1 ? 25 : Math.max(0, 25 - (cpaRatio - 1) * 25);
        
        // Volume Score (0-25): Click volume vs minimum
        const volRatio = m.avgClicks / (settings.minDailyClicks || 20);
        breakdown.volume = Math.min(25, volRatio * 25);
        
        // Stability Score (0-25): Based on learning phase and data quality
        breakdown.stability = m.inLearning ? 10 : m.lowVolume ? 15 : 25;
        
        // ROI Score (0-25): Based on CPA vs target (rough proxy for ROAS)
        const roiRatio = (settings.targetCPA || 2.50) / Math.max(m.cpa, 0.01);
        breakdown.roi = Math.min(25, roiRatio * 25);
        
        const score = Math.round(Object.values(breakdown).reduce((a,b) => a+b, 0));
        const color = score >= 70 ? 'green' : score >= 40 ? 'yellow' : 'red';
        const emoji = score >= 70 ? '🟢' : score >= 40 ? '🟡' : '🔴';
        
        return { score, breakdown, color, emoji };
    };


function Campaigns({ campaigns, campaignMeta, campaigns_raw, settings, timeframes, setTimeframes, getMetrics, getRec, getBroadLearnings, updateMeta }) {
    const [selectedName, setSelectedName] = useState(null);
    const [whatIfCPI, setWhatIfCPI] = useState(null);
    const [whatIfOptIn, setWhatIfOptIn] = useState(null);

    );

    // ── Relative ranking: score each campaign vs the group ─────────────────
    // Metric: trials per $ spent (efficiency) — relative, not vs broken absolute target
    const allMetrics = campaigns.map(c => {
        const tf = timeframes[c.name] || 7;
        return getMetrics(campaigns_raw[c.name], settings, tf);
    }).filter(Boolean);

    const trialsPerDollar = allMetrics.map(m => m.spend > 0 ? m.trials / m.spend : 0);
    const maxTpd = Math.max(...trialsPerDollar, 0.001);
    const minTpd = Math.min(...trialsPerDollar);

    // Relative rank 0–100 vs peers
    function relativeScore(m) {
        const tpd = m.spend > 0 ? m.trials / m.spend : 0;
        if (maxTpd === minTpd) return 50;
        return Math.round(((tpd - minTpd) / (maxTpd - minTpd)) * 100);
    }

    // Sorted by efficiency descending
    const ranked = [...allMetrics].sort((a, b) => {
        const ta = a.spend > 0 ? a.trials / a.spend : 0;
        const tb = b.spend > 0 ? b.trials / b.spend : 0;
        return tb - ta;
    });

    // Set default selected to top-ranked campaign
    const effectiveSelected = selectedName || ranked[0]?.name;
    const selTf = effectiveSelected ? (timeframes[effectiveSelected] || 7) : 7;
    const selRaw = effectiveSelected ? campaigns_raw[effectiveSelected] : null;
    const m = selRaw ? getMetrics(selRaw, settings, selTf) : null;
    const meta = effectiveSelected ? (campaignMeta[effectiveSelected] || {}) : {};
    const broad = meta.type === 'fixed' ? getBroadLearnings(effectiveSelected) : null;
    const rec = m ? getRec(m, broad) : null;

    // ── Lever diagnosis: what's actually dragging CPA ─────────────────────
    function diagnoseLevers(m) {
        if (!m || m.trials === 0) return null;
        const levers = [];

        // CPI drag: how much is install cost contributing?
        const benchmarkCPI = Math.min(...allMetrics.filter(x => x.cpi > 0).map(x => x.cpi));
        if (m.cpi > benchmarkCPI * 1.5 && m.cpi > 0) {
            const cpiSavingPct = ((m.cpi - benchmarkCPI) / m.cpi * 100).toFixed(0);
            levers.push({ label: 'High CPI', detail: `${m.cpi.toFixed(2)} vs best ${benchmarkCPI.toFixed(2)} in portfolio — ${cpiSavingPct}% above peer best`, severity: 'high', icon: '💸' });
        }

        // Opt-in drag
        const benchmarkOptIn = Math.max(...allMetrics.filter(x => x.optInRate > 0).map(x => x.optInRate));
        if (m.optInRate > 0 && m.optInRate < benchmarkOptIn * 0.7) {
            levers.push({ label: 'Low Opt-In Rate', detail: `${(m.optInRate*100).toFixed(1)}% vs best ${(benchmarkOptIn*100).toFixed(1)}% — creative/landing page mismatch`, severity: 'high', icon: '📉' });
        }

        // Volume / learning
        if (m.inLearning) {
            levers.push({ label: 'Still Learning', detail: `${Math.round(m.conversions)} / ${settings.learningThreshold} conversions — algorithm hasn't found optimal audience yet`, severity: 'medium', icon: '🔄' });
        }
        if (m.lowVolume) {
            levers.push({ label: 'Low Click Volume', detail: `${m.avgClicks.toFixed(0)} clicks/day vs ${settings.minDailyClicks} minimum — CPC likely too low to win auctions`, severity: 'medium', icon: '📊' });
        }

        if (levers.length === 0) {
            levers.push({ label: 'No critical issues', detail: 'Performance in line with portfolio peers', severity: 'ok', icon: '✅' });
        }
        return levers;
    }

    // ── What-If logic using Financial Settings (not hardcoded) ────────────
    // ── Full Financial model (mirrors Financial tab exactly) ─────────────────
    const SUB_RETENTION = [1.000,0.676,0.587,0.531,0.494,0.474,0.460,0.449,0.444,0.438,0.431,0.404,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400];
    const PROJ_MONTHS = 24;

    function computeWhatIf(m, cpi, optIn, trialConv) {
        const arppu = settings.arppu || 2.70;
        const apiCostPerSub = settings.apiCostPerSub || 1.00;
        const monthlySpend = m.spend / m.daysCount * 30;

        // Acquisition funnel
        const installs = monthlySpend / Math.max(cpi, 0.01);
        const trials = installs * (optIn / 100);
        const newSubsPerMonth = trials * (trialConv / 100);
        const cpa = newSubsPerMonth > 0 ? monthlySpend / newSubsPerMonth : 0;

        // Full 24-month rolling projection (same as Financial buildProjection)
        const cohorts = [];
        const proj = [];
        for (let mo = 0; mo < PROJ_MONTHS; mo++) {
            cohorts.push({ newSubs: newSubsPerMonth });
            let activeSubs = 0, mrr = 0;
            cohorts.forEach((cohort, ci) => {
                const offset = mo - ci;
                const ret = SUB_RETENTION[offset] !== undefined ? SUB_RETENTION[offset] : SUB_RETENTION[SUB_RETENTION.length - 1];
                const subs = cohort.newSubs * ret;
                activeSubs += subs;
                mrr += subs * arppu;
            });
            const apiCost = activeSubs * apiCostPerSub;
            const netCF = mrr - monthlySpend - apiCost;
            proj.push({ month: mo + 1, activeSubs, mrr, adSpend: monthlySpend, apiCost, netCF, cumCF: 0 });
        }
        let cum = 0;
        proj.forEach(p => { cum += p.netCF; p.cumCF = cum; });

        // Cohort ROAS by month (same as Financial cohortROAS)
        const roasByMonth = Array.from({ length: PROJ_MONTHS }, (_, i) => {
            let rev = 0, api = 0;
            for (let j = 0; j <= i; j++) {
                const ret = SUB_RETENTION[j] !== undefined ? SUB_RETENTION[j] : SUB_RETENTION[SUB_RETENTION.length - 1];
                const subs = newSubsPerMonth * ret;
                rev += subs * arppu;
                api += subs * apiCostPerSub;
            }
            return { month: i + 1, roas: rev / (monthlySpend + api) };
        });

        // Key inflection points
        const paybackMonth = roasByMonth.find(r => r.roas >= 1);
        const breakEvenMonth = proj.find(p => p.cumCF >= 0);
        const peakDeficit = Math.min(...proj.map(p => p.cumCF));
        const roas12 = roasByMonth[11]?.roas || 0;
        const roas24 = roasByMonth[23]?.roas || 0;
        const m24mrr = proj[23]?.mrr || 0;

        return {
            monthlySpend, installs, trials, newSubsPerMonth, cpa,
            proj, roasByMonth,
            paybackMonth: paybackMonth?.month || null,
            breakEvenMonth: breakEvenMonth?.month || null,
            peakDeficit,
            roas12, roas24,
            m24mrr,
            m12activeSubs: proj[11]?.activeSubs || 0,

function History({ campaigns, snapshots, changelog }) {
    const [selected, setSelected] = useState(campaigns[0]?.name || '');

    const campSnaps = snapshots.filter(s => s.campaigns[selected]).map(s => ({
        date: s.date, time: s.time, ...s.campaigns[selected]
    }));

    return (
        <div className="space-y-6">
            <div>
                <h2 className="text-xl font-semibold mb-4">Performance History</h2>
                <select value={selected} onChange={e => setSelected(e.target.value)}
                    className="border border-gray-300 rounded-lg px-3 py-2">
                    {campaigns.map(c => <option key={c.name} value={c.name}>{c.name}</option>)}
                </select>
            </div>

            {campSnaps.length > 0 ? (
                <div className="space-y-2">
                    {campSnaps.map((s, i) => (
                        <div key={i} className="bg-white border border-gray-200 rounded-lg p-4">
                            <div className="grid grid-cols-4 gap-4 text-sm">
                                <div>
                                    <div className="text-xs text-gray-500">Date</div>
                                    <div className="font-semibold">{s.date}</div>
                                    <div className="text-xs text-gray-400">{s.time}</div>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-500">CPA</div>
                                    <div className="font-semibold">${s.cpa?.toFixed(2)}</div>
                                    {i < campSnaps.length - 1 && campSnaps[i+1]?.cpa > 0 && (
                                        <div className={"text-xs " + (s.cpa < campSnaps[i+1].cpa ? 'text-green-600' : 'text-red-600')}>
                                            {s.cpa < campSnaps[i+1].cpa ? '↓' : '↑'} {Math.abs(((s.cpa - campSnaps[i+1].cpa) / campSnaps[i+1].cpa) * 100).toFixed(1)}%
                                        </div>
                                    )}
                                </div>
                                <div>
                                    <div className="text-xs text-gray-500">Conversions</div>
                                    <div className="font-semibold">{s.conversions}</div>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-500">Spend</div>
                                    <div className="font-semibold">${s.spend?.toFixed(2)}</div>
                                </div>
                            </div>
                        </div>
                    ))}
                </div>
            ) : (
                <p className="text-gray-500 text-sm">No snapshots yet for this campaign. Upload data to start tracking.</p>
            )}

            <div>
                <h3 className="text-lg font-semibold mb-3">Activity Log</h3>
                <div className="space-y-2">
                    {changelog.map((entry, i) => (
                        <div key={i} className="bg-white border border-gray-200 rounded-lg p-3">
                            <div className="flex items-center gap-2">
                                <span className="text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded">{entry.type}</span>
                                <span className="text-xs text-gray-500">{entry.date} {entry.time}</span>
                            </div>
                            <div className="text-sm text-gray-700 mt-1">{entry.description}</div>
                        </div>
                    ))}
                    {!changelog.length && <p className="text-gray-500 text-sm">No activity yet.</p>}
                </div>
            </div>
        </div>
    );
}

function Settings({ settings, updateSettings }) {
    const [s, setS] = useState(settings);

    const Field = ({ label, fieldKey, prefix, suffix, step = '0.01', isPercent = false, hint = '' }) => (
        <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">{label}</label>
            {hint && <div className="text-xs text-gray-400 mb-1.5">{hint}</div>}
            <div className="flex items-center gap-2">
                {prefix && <span className="text-gray-500">{prefix}</span>}
                <input type="number" step={step}
                    value={isPercent ? ((s[fieldKey] || 0) * 100).toFixed(step < 0.01 ? 3 : 1) : s[fieldKey]}
                    onChange={e => setS({...s, [fieldKey]: isPercent ? parseFloat(e.target.value) / 100 : parseFloat(e.target.value)})}
                    className="border border-gray-300 rounded-lg px-3 py-2 w-32 focus:outline-none focus:border-blue-400" />
                {suffix && <span className="text-gray-500 text-sm">{suffix}</span>}
            </div>
        </div>
    );

    return (
        <div className="space-y-8 max-w-2xl">
            <h2 className="text-xl font-semibold">Settings</h2>

            {/* ── Campaign Optimization ─────────────────────────────── */}
            <div className="bg-white border border-gray-200 rounded-xl p-5 space-y-4">
                <div className="text-sm font-bold text-gray-700 border-b border-gray-100 pb-2">📊 Campaign Optimization</div>
                <div className="grid grid-cols-2 gap-4">
                    <Field label="Target CPA" fieldKey="targetCPA" prefix="$" step="0.01" />
                    <Field label="Max Acceptable CPA" fieldKey="maxCPA" prefix="$" step="0.01" />
                    <Field label="Learning Phase Threshold" fieldKey="learningThreshold" suffix="conversions" step="1" />
                    <Field label="Min Daily Clicks" fieldKey="minDailyClicks" suffix="clicks/day" step="1" />
                </div>
                <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">CPC Stability Requirement</label>
                    <select value={s.stabilityDays} onChange={e => setS({...s, stabilityDays: parseInt(e.target.value)})}
                        className="border border-gray-300 rounded-lg px-3 py-2 focus:outline-none">
                        <option value={1}>1 day (aggressive)</option>
                        <option value={3}>3 days (recommended)</option>
                        <option value={5}>5 days (conservative)</option>
                        <option value={7}>7 days (very stable)</option>
                    </select>
                </div>
            </div>

            {/* ── Ad Revenue Model (Primary) ─────────────────────────────── */}
            <div className="bg-amber-50 border border-amber-200 rounded-xl p-5 space-y-4">
                <div className="text-sm font-bold text-amber-800 border-b border-amber-200 pb-2">💰 Ad Revenue Model <span className="font-normal text-amber-600 ml-2">(Primary revenue driver)</span></div>
                <div className="grid grid-cols-2 gap-4">
                    <Field label="ARPDAU (Ad Revenue per DAU/day)" fieldKey="arpdau" prefix="$" step="0.001"
                        hint="Total daily ad rev ÷ DAU. Derived from eCPM × fill × impressions if known." />
                    <Field label="DAU / MAU Ratio (Stickiness)" fieldKey="dauMauRatio" suffix="%" step="1" isPercent={true}
                        hint="What % of monthly actives open the app on any given day." />
                    <Field label="Avg Ad Impressions per DAU/day" fieldKey="adsPerDau" step="0.1"
                        hint="How many ads the average active user sees per session day." />
                    <Field label="Effective CPM (eCPM)" fieldKey="ecpm" prefix="$" step="0.01"
                        hint="Used to sanity-check ARPDAU. ARPDAU ≈ eCPM/1000 × ads/DAU × fill." />
                    <Field label="Ad Fill Rate" fieldKey="adFillRate" suffix="%" step="1" isPercent={true}
                        hint="% of ad requests filled by your ad network." />
                </div>
                <div className="mt-2 text-xs text-amber-700 bg-amber-100 rounded-lg p-2.5 border border-amber-200">
                    ℹ️ ARPDAU implied from eCPM: <strong>${((s.ecpm||4.5)/1000 * (s.adsPerDau||3) * (s.adFillRate||0.85)).toFixed(4)}/DAU/day</strong>
                    {Math.abs(((s.ecpm||4.5)/1000 * (s.adsPerDau||3) * (s.adFillRate||0.85)) - (s.arpdau||0.035)) > 0.005
                        ? <span className="ml-2 text-amber-800">⚠️ vs your ARPDAU ${(s.arpdau||0.035).toFixed(4)} — adjust if needed</span>
                        : <span className="ml-2 text-green-700">✅ matches your ARPDAU</span>
                    }
                </div>
            </div>

            {/* ── Subscription Revenue Model (Secondary) ─────────────────────────────── */}
            <div className="bg-violet-50 border border-violet-200 rounded-xl p-5 space-y-4">
                <div className="flex items-center justify-between border-b border-violet-200 pb-2">
                    <div className="text-sm font-bold text-violet-800">🔒 Subscription Revenue <span className="font-normal text-violet-600 ml-2">(Secondary)</span></div>
                    <label className="flex items-center gap-2 text-sm text-violet-700 cursor-pointer">
                        <input type="checkbox" checked={s.subEnabled !== false} onChange={e => setS({...s, subEnabled: e.target.checked})}
                            className="accent-violet-600" />
                        Enabled
                    </label>
                </div>
                <div className="grid grid-cols-2 gap-4">
                    <Field label="Monthly ARPPU (net of store cut)" fieldKey="arppu" prefix="$" step="0.01"
                        hint="Revenue per paying subscriber per month after app store fee." />
                    <Field label="Trial → Paid Conversion Rate" fieldKey="trialConvRate" suffix="%" step="1" isPercent={true}
                        hint="% of trial starters who become paying subscribers." />
                    <Field label="Server/API Cost per Sub/Month" fieldKey="apiCostPerSub" prefix="$" step="0.01"
                        hint="Incremental server cost per active paying subscriber." />
                </div>
            </div>

            <button onClick={() => updateSettings(s)}
                className="px-6 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-medium text-sm">
                Save Settings
            </button>
        </div>
    );
}

function Retention() {
    const chartRef  = useRef(null);
    const chartInst = useRef(null);
    const ltvRef    = useRef(null);
    const ltvInst   = useRef(null);

    // ── Data sources ──────────────────────────────────────────────────────────
    // Observed DAU retention from cohort data (median across 85 cohorts, Dec 2025 – Feb 2026)
    // All values = fraction of original install cohort still active as DAU on that day
    const OBSERVED = [
        { day: 1,  ret: 0.1034, label: 'D1',  type: 'observed' },
        { day: 2,  ret: 0.0546, label: 'D2',  type: 'observed' },
        { day: 3,  ret: 0.0430, label: 'D3',  type: 'observed' },
        { day: 4,  ret: 0.0351, label: 'D4',  type: 'observed' },
        { day: 5,  ret: 0.0333, label: 'D5',  type: 'observed' },
        { day: 7,  ret: 0.0333, label: 'D7',  type: 'observed' },
        { day: 10, ret: 0.0303, label: 'D10', type: 'observed' },
        { day: 14, ret: 0.0198, label: 'D14', type: 'observed' },
        { day: 21, ret: 0.0187, label: 'D21', type: 'observed' },
        { day: 30, ret: 0.0131, label: 'D30', type: 'observed' },
        { day: 45, ret: 0.0107, label: 'D45', type: 'observed' },
        { day: 75, ret: 0.0054, label: 'D75', type: 'observed' },
    ];

    // Tail fit: f(d) = 0.0236 * exp(-0.01881 * d), half-life = 37 days
    // Anchored to D30/D45/D75 actuals, extrapolated forward
    const A_TAIL = 0.0236, K_TAIL = 0.01881;
    const tailFit = (d) => A_TAIL * Math.exp(-K_TAIL * d);

    // Daily curve for chart (D0–D365)
    const chartDays = [0,1,2,3,4,5,6,7,10,14,21,30,45,60,75,90,120,150,180,240,300,365];
    const piecewise = (d) => {
        if (d === 0) return 1.0;
        const nearby = OBSERVED.find(o => o.day === d);
        if (nearby) return nearby.ret;
        // interpolate between observed points for D1-D75
        const sorted = OBSERVED.slice().sort((a,b) => a.day - b.day);
        for (let i = 0; i < sorted.length - 1; i++) {
            const lo = sorted[i], hi = sorted[i+1];
            if (d >= lo.day && d <= hi.day) {
                const t = (d - lo.day) / (hi.day - lo.day);
                return lo.ret + t * (hi.ret - lo.ret);
            }
        }
        return tailFit(d);
    };

    // End-of-month DAU retention (used in LTV model)
    const EOM_RETENTION = [
        { m: 0,  d: 0,   ret: 1.00000,  type: 'install' },
        { m: 1,  d: 30,  ret: 0.01340,  type: 'observed' },
        { m: 2,  d: 60,  ret: 0.00762,  type: 'extrapolated' },
        { m: 3,  d: 90,  ret: 0.00434,  type: 'extrapolated' },
        { m: 4,  d: 120, ret: 0.00247,  type: 'extrapolated' },
        { m: 5,  d: 150, ret: 0.00140,  type: 'extrapolated' },
        { m: 6,  d: 180, ret: 0.00080,  type: 'extrapolated' },
        { m: 7,  d: 210, ret: 0.00045,  type: 'extrapolated' },

        { m: 10, d: 300, ret: 0.00008,  type: 'extrapolated' },
        { m: 11, d: 330, ret: 0.00005,  type: 'extrapolated' },
        { m: 12, d: 360, ret: 0.00003,  type: 'extrapolated' },
    ];

    // Cumulative ad LTV per install (integrate DAU-days × ARPDAU)
    const ARPDAU = 0.157;
    const cumulativeLTV = [];
    let running = 0;
    for (let m = 0; m <= 12; m++) {
        const dStart = m * 30, dEnd = (m + 1) * 30;
        let dauDays = 0;
        for (let d = dStart; d < dEnd; d++) {
            dauDays += d <= 75 ? piecewise(d) : tailFit(d);
        }
        running += dauDays * ARPDAU;
        cumulativeLTV.push({ m, ltv: running, dauDays });
    }

    useEffect(() => {
        if (!chartRef.current) return;
        if (chartInst.current) chartInst.current.destroy();

                <div><span className="font-medium text-gray-600">Observed range:</span> D1–D75. Median used across cohorts (more robust than mean given small cohort sizes).</div>
                <div><span className="font-medium text-gray-600">Extrapolation (D75+):</span> Exponential decay fitted to D30/D45/D75 anchor points: <code className="bg-gray-100 px-1 rounded">f(d) = 0.0236 × e^(−0.01881d)</code>. Half-life = 37 days. This is a <strong>lower bound</strong> — solitaire games often show a long-tail loyal-player floor not captured in 85 days of data.</div>
                <div><span className="font-medium text-gray-600">LTV:</span> Integrates daily DAU retention × $0.157 ARPDAU (from mediation report). Install month = 1.775 DAU-days/install (includes spike on install day).</div>
            </div>
        </div>
    );
}

function Financial({ campaigns, settings }) {
    const cashChartRef = useRef(null);
    const cashChartInst = useRef(null);
    const ltvChartRef = useRef(null);
    const ltvChartInst = useRef(null);

    // ── MODEL: Ad Revenue Primary + Subscription Secondary ───────────────────
    const MODEL = {
        // Ad revenue (primary)
        arpdau: settings.arpdau || 0.035,           // $/DAU/day
        dauMauRatio: settings.dauMauRatio || 1.0,  // 1.0 = retention curve IS DAU retention (direct from cohort data)
        // Subscription (secondary)
        trialConvRate: settings.trialConvRate || 0.40,
        arppu: settings.arppu || 2.70,
        apiCostPerSub: settings.apiCostPerSub || 1.00,
        subEnabled: settings.subEnabled !== false,
        // DAU retention curve — fitted from real Spider Solitaire cohort data (Dec 2025 - Feb 2026)
        // Observed: D1=10.3%, D7=3.3%, D30=1.31%, D45=1.07%, D75=0.54%
        // M0=install month, M1-M12 = end-of-month DAU fraction of original cohort
        // Tail fit: exponential decay, half-life ~37 days (anchored to D30/D45/D75 actuals)
        // M2-M12 extrapolated; treat as lower-bound (solitaire games can have loyal long-tail)
        mauRetention: [1.00000, 0.01340, 0.00762, 0.00434, 0.00247, 0.00140, 0.00080, 0.00045, 0.00026, 0.00015, 0.00008, 0.00005, 0.00003,
                       0.00002, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001],
        // Subscriber retention (paying subs who stay subscribed)
        subRetention: [1.000,0.676,0.587,0.531,0.494,0.474,0.460,0.449,0.444,0.438,0.431,0.404,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400],
    };

    // State
    const [selectedCampaigns, setSelectedCampaigns] = useState([]);
    const [showWorkings, setShowWorkings] = useState(false);
    const [spendMultiplier, setSpendMultiplier] = useState(1);
    const [monthlySpendOverride, setMonthlySpendOverride] = useState('');
    const [dateRange, setDateRange] = useState({ start: '', end: '' });
    const [showDeepDive, setShowDeepDive] = useState(false);
    const [activeAnalysisTab, setActiveAnalysisTab] = useState('ltv');
    const MONTHS = 24;

    useEffect(() => {
        if (campaigns.length > 0 && selectedCampaigns.length === 0) {
            setSelectedCampaigns(campaigns.map(c => c.name));
        }
    }, [campaigns]);

    const toggleCampaign = (name) => setSelectedCampaigns(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
    const selectAll = () => setSelectedCampaigns(campaigns.map(c => c.name));
    const selectNone = () => setSelectedCampaigns([]);

    const applyDateFilter = (camp) => {
        if (!dateRange.start && !dateRange.end) return camp;
        const filtered = {...camp, dailyData: {}};
        Object.keys(camp.dailyData || {}).forEach(date => {
            if (dateRange.start && date < dateRange.start) return;
            if (dateRange.end && date > dateRange.end) return;
            filtered.dailyData[date] = camp.dailyData[date];
        });
        let spend=0,clicks=0,impressions=0,installs=0,trials=0,modeledPaidSubs=0;
        Object.values(filtered.dailyData).forEach(d => {
            spend+=d.spend; clicks+=d.clicks; impressions+=d.impressions||0;
            installs+=d.installs||0; trials+=d.trials||0; modeledPaidSubs+=d.modeledPaidSubs||0;
        });
        const dates = Object.keys(filtered.dailyData).sort();
        return {...camp, dailyData:filtered.dailyData, spend,clicks,impressions,installs,trials,modeledPaidSubs,
            conversions:modeledPaidSubs, optInRate:installs>0?trials/installs:0,
            cpa:modeledPaidSubs>0?spend/modeledPaidSubs:0, cpi:installs>0?spend/installs:0,
            cpc:clicks>0?spend/clicks:0, daysCount:dates.length, startDate:dates[0], endDate:dates[dates.length-1]};
    };

    const activeCampaigns = campaigns.filter(c => selectedCampaigns.includes(c.name)).map(applyDateFilter);
    const totalActualSpend = activeCampaigns.reduce((s,c) => s+c.spend, 0);
    const totalInstalls = activeCampaigns.reduce((s,c) => s+(c.installs||0), 0);
    const totalTrials = activeCampaigns.reduce((s,c) => s+(c.trials||0), 0);
    const totalActualConversions = activeCampaigns.reduce((s,c) => s+c.conversions, 0);
    const liveOptInRate = totalInstalls > 0 ? totalTrials/totalInstalls : 0.40;
    const cpi = totalInstalls > 0 ? totalActualSpend/totalInstalls : 0.74;
    const daysOfData = activeCampaigns.length > 0 ? Math.max(...activeCampaigns.map(c=>c.daysCount)) : 30;
    const monthsOfData = daysOfData / 30;
    const baseMonthlySpend = totalActualSpend > 0 ? totalActualSpend/Math.max(monthsOfData,0.5) : 30000;
    const projectedMonthlySpend = monthlySpendOverride !== '' ? parseFloat(monthlySpendOverride)||baseMonthlySpend : baseMonthlySpend*spendMultiplier;
    const targetCPA = settings.targetCPA || 2.50;

    // ── Acquisition funnel ─────────────────────────────────────────────────
    const computeAcq = (spend) => {
        const installs = spend/cpi;
        const trials = installs*liveOptInRate;
        const newSubs = trials*MODEL.trialConvRate;
        return { installs, trials, newSubs, cpa: newSubs>0 ? spend/newSubs : 0 };
    };

    // ── Per-install LTV functions ──────────────────────────────────────────
    // Ad LTV for a cohort of installs over N months
    const adLTVperInstall = (numMonths) => {
        let ltv = 0;
        for (let i = 0; i < numMonths; i++) {
            const mauRet = MODEL.mauRetention[i] !== undefined ? MODEL.mauRetention[i] : MODEL.mauRetention[MODEL.mauRetention.length-1];
            // Monthly ad rev per install = MAU_ret × DAU/MAU × ARPDAU × 30
            ltv += mauRet * MODEL.dauMauRatio * MODEL.arpdau * 30;
        }
        return ltv;
    };

    // Sub LTV for a new subscriber cohort over N months
    const subLTVperSub = (numMonths) => {
        let ltv = 0;
        for (let i = 0; i < numMonths; i++) {
            const ret = MODEL.subRetention[i] !== undefined ? MODEL.subRetention[i] : MODEL.subRetention[MODEL.subRetention.length-1];
            ltv += ret * MODEL.arppu;
        }
        return ltv;
    };

    // Blended LTV per install (ad + sub contribution)
    const blendedLTVperInstall = (numMonths) => {
        const adLtv = adLTVperInstall(numMonths);
        if (!MODEL.subEnabled) return adLtv;
        const subConvFromInstall = liveOptInRate * MODEL.trialConvRate; // % of installs that become subs
        const subLtv = subConvFromInstall * subLTVperSub(numMonths);
        return adLtv + subLtv;
    };

    // ── Full 24-month cohort projection ───────────────────────────────────
    const buildProjection = (monthlySpend) => {
        const cohorts = []; // {month, installs, newSubs}
        const proj = [];

        for (let m = 0; m < MONTHS; m++) {
            const acq = computeAcq(monthlySpend);
            cohorts.push({ month: m, installs: acq.installs, newSubs: acq.newSubs });

            let totalMAU = 0, totalActiveSubs = 0, totalAdRev = 0, totalSubRev = 0;

            cohorts.forEach(cohort => {
                const offset = m - cohort.month;
                const mauRet = MODEL.mauRetention[offset] !== undefined ? MODEL.mauRetention[offset] : MODEL.mauRetention[MODEL.mauRetention.length-1];
                const subRet = MODEL.subRetention[offset] !== undefined ? MODEL.subRetention[offset] : MODEL.subRetention[MODEL.subRetention.length-1];

                const mau = cohort.installs * mauRet;
                const dau = mau * MODEL.dauMauRatio;
                const adRev = dau * MODEL.arpdau * 30; // monthly

                const activeSubs = cohort.newSubs * subRet;
                const subRev = activeSubs * MODEL.arppu;

                totalMAU += mau;
                totalActiveSubs += activeSubs;
                totalAdRev += adRev;
                if (MODEL.subEnabled) totalSubRev += subRev;
            });

            const apiCost = MODEL.subEnabled ? totalActiveSubs * MODEL.apiCostPerSub : 0;
            const totalRev = totalAdRev + totalSubRev;
            const totalCost = monthlySpend + apiCost;
            const netCF = totalRev - totalCost;
            const margin = totalRev > 0 ? ((totalRev-totalCost)/totalRev*100) : 0;
            const acqCur = computeAcq(monthlySpend);

            proj.push({
                month: m+1,
                installs: Math.round(acqCur.installs),
                newSubs: Math.round(acqCur.newSubs),
                mau: Math.round(totalMAU),
                dau: Math.round(totalMAU * MODEL.dauMauRatio),
                activeSubs: Math.round(totalActiveSubs),
                adRev: totalAdRev,
                subRev: totalSubRev,
                totalRev,
                adSpend: monthlySpend,
                apiCost,
                totalCost,
                netCF,
                cumCF: 0,
                margin,
            });
        }
        let cum = 0;
        proj.forEach(p => { cum += p.netCF; p.cumCF = cum; });
        return proj;
    };

    // ── Cohort ROAS ───────────────────────────────────────────────────────
    const cohortROAS = (monthlySpend, numMonths) => {
        const acq = computeAcq(monthlySpend);
        let adRev = 0, subRev = 0, apiCost = 0;
        for (let i = 0; i < numMonths; i++) {
            const mauRet = MODEL.mauRetention[i] !== undefined ? MODEL.mauRetention[i] : MODEL.mauRetention[MODEL.mauRetention.length-1];
            const subRet = MODEL.subRetention[i] !== undefined ? MODEL.subRetention[i] : MODEL.subRetention[MODEL.subRetention.length-1];
            const mau = acq.installs * mauRet;
            const dau = mau * MODEL.dauMauRatio;
            adRev += dau * MODEL.arpdau * 30;
            if (MODEL.subEnabled) {
                const subs = acq.newSubs * subRet;
                subRev += subs * MODEL.arppu;
                apiCost += subs * MODEL.apiCostPerSub;
            }
        }
        const totalRev = adRev + subRev;
        return { roas: totalRev/(monthlySpend+apiCost), adRev, subRev, apiCost, installs: acq.installs };
    };

    const acq = computeAcq(projectedMonthlySpend);
    const proj = buildProjection(projectedMonthlySpend);
    const breakEvenMonth = proj.find(p => p.cumCF >= 0);
    const paybackMonth = Array.from({length:24},(_,i) => ({month:i+1, roas:cohortROAS(projectedMonthlySpend,i+1).roas})).find(r=>r.roas>=1);

    // LTV curves (per install)
    const adLTVCurve = Array.from({length:24},(_,i) => adLTVperInstall(i+1));
    const blendedLTVCurve = Array.from({length:24},(_,i) => blendedLTVperInstall(i+1));
    const adLTV12 = adLTVCurve[11];
    const adLTV24 = adLTVCurve[23];
    const blendedLTV12 = blendedLTVCurve[11];
    const blendedLTV24 = blendedLTVCurve[23];

    // Per-MAU LTV (ad only, common metric)
    const arpmau = MODEL.dauMauRatio * MODEL.arpdau * 30; // ad revenue per MAU per month

    const roas12 = cohortROAS(projectedMonthlySpend, 12).roas;
    const roas24 = cohortROAS(projectedMonthlySpend, 24).roas;
    const isScalable = roas12 >= 1 && paybackMonth && paybackMonth.month <= 12;
    const isOptimize = roas12 >= 0.7 && (!paybackMonth || paybackMonth.month > 12);

    const fmtK = (n) => { const abs=Math.abs(n); const sign=n<0?'-':''; return abs>=1000?sign+'
</body>
<\/html>
+(abs/1000).toFixed(1)+'k':sign+'
</body>
<\/html>
+abs.toFixed(0); };
    const fmtN = (n) => n>=1000?(n/1000).toFixed(1)+'k':Math.round(n).toString();
    const fmt2 = (n) => '
</body>
<\/html>
+n.toFixed(2);
    const fmtM = (n) => n>=1000000?(n/1000000).toFixed(2)+'M':n>=1000?(n/1000).toFixed(1)+'k':Math.round(n).toString();

    // ── Charts ─────────────────────────────────────────────────────────────
    useEffect(() => {
        if (!activeCampaigns.length && campaigns.length > 0) return;

        // LTV curve chart
        if (ltvChartRef.current) {
            if (ltvChartInst.current) ltvChartInst.current.destroy();
            const labels = Array.from({length:24},(_,i)=>'M'+(i+1));
            ltvChartInst.current = new Chart(ltvChartRef.current, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Ad LTV/install', data: adLTVCurve, borderColor:'#f59e0b', backgroundColor:'rgba(245,158,11,0.1)', borderWidth:3, fill:true, tension:0.4, pointRadius:0 },
                        ...(MODEL.subEnabled ? [{ label: 'Blended LTV/install', data: blendedLTVCurve, borderColor:'#6366f1', backgroundColor:'rgba(99,102,241,0.05)', borderWidth:3, fill:false, tension:0.4, pointRadius:0, borderDash:[] }] : []),
                        { label: 'CPI (payback line)', data: Array(24).fill(cpi), borderColor:'#ef4444', borderWidth:1.5, borderDash:[4,3], pointRadius:0, fill:false },
                    ].filter(Boolean)
                },
                options: {
                    responsive:true, maintainAspectRatio:false,
                    interaction:{mode:'index',intersect:false},
                    plugins:{ legend:{position:'top',labels:{font:{size:11},boxWidth:12}}, tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: ${ctx.parsed.y.toFixed(3)}`}} },
                    scales:{ y:{ticks:{callback:v=>'
</body>
<\/html>
+v.toFixed(2)},title:{display:true,text:'$ per install',font:{size:10}}}, x:{grid:{color:'rgba(0,0,0,0.04)'}} }
                }
            });
        }

        // Cash flow chart (deep dive)
        if (cashChartRef.current && showDeepDive) {
            if (cashChartInst.current) cashChartInst.current.destroy();
            cashChartInst.current = new Chart(cashChartRef.current, {
                type:'bar',
                data:{
                    labels: proj.map(p=>'M'+p.month),
                    datasets:[
                        { label:'Ad Revenue', data:proj.map(p=>p.adRev), backgroundColor:'rgba(245,158,11,0.8)' },
                        { label:'Sub Revenue', data:proj.map(p=>p.subRev), backgroundColor:'rgba(139,92,246,0.8)' },
                        { label:'Ad Spend', data:proj.map(p=>-p.adSpend), backgroundColor:'rgba(239,68,68,0.7)' },
                        { label:'API Cost', data:proj.map(p=>-p.apiCost), backgroundColor:'rgba(251,146,60,0.7)' },
                        { label:'Cumulative CF', data:proj.map(p=>p.cumCF), type:'line', borderColor:'rgb(59,130,246)', borderWidth:3, fill:false, tension:0.3, pointRadius:3 }
                    ]
                },
                options:{
                    responsive:true, maintainAspectRatio:false,
                    plugins:{legend:{position:'top'},tooltip:{callbacks:{label:(ctx)=>(ctx.dataset.label||'')+': '+fmtK(ctx.parsed.y)}}},
                    scales:{y:{ticks:{callback:v=>fmtK(v)},grid:{color:ctx=>ctx.tick.value===0?'rgba(0,0,0,0.3)':'rgba(0,0,0,0.1)'}}}
                }
            });
        }

        return () => {
            if (cashChartInst.current) { cashChartInst.current.destroy(); cashChartInst.current = null; }
            if (ltvChartInst.current) { ltvChartInst.current.destroy(); ltvChartInst.current = null; }
        };
    }, [projectedMonthlySpend, spendMultiplier, monthlySpendOverride, selectedCampaigns, showDeepDive, MODEL.arpdau, MODEL.dauMauRatio]);

    if (campaigns.length === 0) return (
        <div className="text-center py-16">
            <div className="text-5xl mb-4">📊</div>
            <div className="text-lg font-semibold text-gray-700">Upload campaign data first</div>
            <div className="text-gray-500 text-sm mt-2">Financial projections need campaign data to calculate CPI and spend rates</div>
        </div>
    );

    const verdictBg = isScalable ? 'bg-green-50 border-green-400' : isOptimize ? 'bg-yellow-50 border-yellow-400' : 'bg-red-50 border-red-400';
    const verdictColor = isScalable ? 'text-green-700' : isOptimize ? 'text-yellow-700' : 'text-red-700';

                                        <td className={"px-2.5 py-2 font-semibold "+(p.netCF>=0?'text-green-600':'text-red-500')}>{p.netCF>=0?'+':''}{fmtK(p.netCF)}</td>
                                        <td className={"px-2.5 py-2 "+(p.margin>=0?'text-green-600':'text-red-500')}>{p.margin.toFixed(0)}%</td>
                                        <td className={"px-2.5 py-2 font-bold "+(p.cumCF>=0?'text-green-600':'text-red-500')}>{p.cumCF>=0?'+':''}{fmtK(p.cumCF)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )}
        </div>

        {/* ══ MODEL WORKINGS ══ */}
        {showWorkings && (
            <div className="bg-gray-950 text-gray-100 rounded-xl p-6 space-y-4 border border-gray-700" style={{fontFamily:'monospace',fontSize:'12px',lineHeight:'1.7'}}>
                <div style={{color:'#facc15',fontWeight:'bold',fontSize:'13px',borderBottom:'1px solid #374151',paddingBottom:'8px'}}>
                    ▶ MODEL WORKINGS — full audit trail
                </div>
                <div>
                    <div style={{color:'#34d399',fontWeight:'bold',marginBottom:'6px'}}>① LIVE FROM CAMPAIGN DATA</div>
                    <div>CPI: <span style={{color:'#fde047'}}>{fmt2(cpi)}</span> = {fmtK(totalActualSpend)} ÷ {fmtN(totalInstalls)} installs</div>
                    <div>Opt-In Rate: <span style={{color:'#fde047'}}>{(liveOptInRate*100).toFixed(2)}%</span> = {totalTrials} trials ÷ {totalInstalls} installs</div>
                    <div>Base Monthly Spend: <span style={{color:'#fde047'}}>{fmtK(baseMonthlySpend)}</span> = {fmtK(totalActualSpend)} ÷ {monthsOfData.toFixed(1)} months</div>
                </div>
                <div>
                    <div style={{color:'#fbbf24',fontWeight:'bold',marginBottom:'6px'}}>② AD REVENUE MODEL (Primary)</div>
                    <div>ARPDAU: <span style={{color:'#fde047'}}>${MODEL.arpdau.toFixed(4)}/DAU/day</span></div>
                    <div>DAU/MAU Stickiness: <span style={{color:'#fde047'}}>{(MODEL.dauMauRatio*100).toFixed(0)}%</span></div>
                    <div>ARPMAU: <span style={{color:'#fde047'}}>${arpmau.toFixed(4)}/MAU/month</span> = ARPDAU × DAU/MAU × 30</div>
                    <div>M12 MAU: <span style={{color:'#fde047'}}>{fmtM(proj[11]?.mau||0)}</span></div>
                    <div>M12 DAU: <span style={{color:'#fde047'}}>{fmtM(proj[11]?.dau||0)}</span></div>
                    <div>M12 Ad Revenue: <span style={{color:'#fde047'}}>{fmtK(proj[11]?.adRev||0)}/mo</span></div>
                </div>
                <div>
                    <div style={{color:'#c084fc',fontWeight:'bold',marginBottom:'6px'}}>③ SUBSCRIPTION MODEL (Secondary)</div>
                    <div>Trial→Paid Conv: <span style={{color:'#fde047'}}>{(MODEL.trialConvRate*100).toFixed(0)}%</span></div>
                    <div>Monthly ARPPU: <span style={{color:'#fde047'}}>${MODEL.arppu.toFixed(2)}</span> (net of app store cut)</div>
                    <div>API Cost/Sub: <span style={{color:'#fde047'}}>${MODEL.apiCostPerSub.toFixed(2)}/month</span></div>
                    <div>M12 Active Subs: <span style={{color:'#fde047'}}>{fmtN(proj[11]?.activeSubs||0)}</span></div>
                    <div>M12 Sub Revenue: <span style={{color:'#fde047'}}>{fmtK(proj[11]?.subRev||0)}/mo</span></div>
                </div>
                <div>
                    <div style={{color:'#6ee7b7',fontWeight:'bold',marginBottom:'6px'}}>④ LTV PER INSTALL</div>
                    <div>Ad LTV 12M: <span style={{color:'#fde047'}}>${adLTV12.toFixed(4)}</span> = Σ(m=0..11: MAU_ret[m] × {(MODEL.dauMauRatio*100).toFixed(0)}% × ${MODEL.arpdau.toFixed(4)} × 30)</div>
                    <div>Sub contrib/install (12M): <span style={{color:'#fde047'}}>${(blendedLTV12-adLTV12).toFixed(4)}</span> = {(liveOptInRate*100).toFixed(1)}% × {(MODEL.trialConvRate*100).toFixed(0)}% × Σ(sub_ret × ARPPU)</div>
                    <div>Blended LTV 12M: <span style={{color:'#fde047'}}>${blendedLTV12.toFixed(4)}</span> vs CPI ${cpi.toFixed(4)} → {(blendedLTV12/Math.max(cpi,0.01)).toFixed(1)}× LTV:CPI</div>
                    <div>12M Blended ROAS: <span style={{color:'#fde047'}}>{(roas12*100).toFixed(0)}%</span></div>
                </div>
                <div>
                    <div style={{color:'#6ee7b7',fontWeight:'bold',marginBottom:'6px'}}>MAU RETENTION CURVE</div>
                    <div style={{color:'#9ca3af'}}>{MODEL.mauRetention.map((r,i)=>'M'+i+':'+(r*100).toFixed(0)+'%').join('  ')}</div>
                </div>
                <div>
                    <div style={{color:'#6ee7b7',fontWeight:'bold',marginBottom:'6px'}}>SUBSCRIBER RETENTION CURVE</div>
                    <div style={{color:'#9ca3af'}}>{MODEL.subRetention.map((r,i)=>'M'+i+':'+(r*100).toFixed(0)+'%').join('  ')}</div>
                </div>
            </div>
        )}
        </div>
    );
}


ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
