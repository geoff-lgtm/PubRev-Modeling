        )
    );
}


function Financial({ campaigns, settings }) {
    const cashChartRef = useRef(null);
    const cashChartInst = useRef(null);
    const ltvChartRef = useRef(null);
    const ltvChartInst = useRef(null);

    // ── MODEL: Ad Revenue Primary + Subscription Secondary ───────────────────
    const MODEL = {
        // Ad revenue (primary)
        arpdau: settings.arpdau || 0.035,           // $/DAU/day
        dauMauRatio: settings.dauMauRatio || 1.0,  // 1.0 = retention curve IS DAU retention (direct from cohort data)
        // Subscription (secondary)
        trialConvRate: settings.trialConvRate || 0.40,
        arppu: settings.arppu || 2.70,
        apiCostPerSub: settings.apiCostPerSub || 1.00,
        subEnabled: settings.subEnabled !== false,
        // DAU retention curve — fitted from real Spider Solitaire cohort data (Dec 2025 - Feb 2026)
        // Observed: D1=10.3%, D7=3.3%, D30=1.31%, D45=1.07%, D75=0.54%
        // M0=install month, M1-M12 = end-of-month DAU fraction of original cohort
        // Tail fit: exponential decay, half-life ~37 days (anchored to D30/D45/D75 actuals)
        // M2-M12 extrapolated; treat as lower-bound (solitaire games can have loyal long-tail)
        mauRetention: [1.00000, 0.01340, 0.00762, 0.00434, 0.00247, 0.00140, 0.00080, 0.00045, 0.00026, 0.00015, 0.00008, 0.00005, 0.00003,
                       0.00002, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001, 0.00001],
        // Subscriber retention (paying subs who stay subscribed)
        subRetention: [1.000,0.676,0.587,0.531,0.494,0.474,0.460,0.449,0.444,0.438,0.431,0.404,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400],
    };

    // State
    const [selectedCampaigns, setSelectedCampaigns] = useState([]);
    const [showWorkings, setShowWorkings] = useState(false);
    const [spendMultiplier, setSpendMultiplier] = useState(1);
    const [monthlySpendOverride, setMonthlySpendOverride] = useState('');
    const [dateRange, setDateRange] = useState({ start: '', end: '' });
    const [showDeepDive, setShowDeepDive] = useState(false);
    const [activeAnalysisTab, setActiveAnalysisTab] = useState('ltv');
    const MONTHS = 24;

    useEffect(() => {
        if (campaigns.length > 0 && selectedCampaigns.length === 0) {
            setSelectedCampaigns(campaigns.map(c => c.name));
        }
    }, [campaigns]);

    const toggleCampaign = (name) => setSelectedCampaigns(prev => prev.includes(name) ? prev.filter(n => n !== name) : [...prev, name]);
    const selectAll = () => setSelectedCampaigns(campaigns.map(c => c.name));
    const selectNone = () => setSelectedCampaigns([]);

    const applyDateFilter = (camp) => {
        if (!dateRange.start && !dateRange.end) return camp;
        const filtered = {...camp, dailyData: {}};
        Object.keys(camp.dailyData || {}).forEach(date => {
            if (dateRange.start && date < dateRange.start) return;
            if (dateRange.end && date > dateRange.end) return;
            filtered.dailyData[date] = camp.dailyData[date];
        });
        let spend=0,clicks=0,impressions=0,installs=0,trials=0,modeledPaidSubs=0;
        Object.values(filtered.dailyData).forEach(d => {
            spend+=d.spend; clicks+=d.clicks; impressions+=d.impressions||0;
            installs+=d.installs||0; trials+=d.trials||0; modeledPaidSubs+=d.modeledPaidSubs||0;
        });
        const dates = Object.keys(filtered.dailyData).sort();
        return {...camp, dailyData:filtered.dailyData, spend,clicks,impressions,installs,trials,modeledPaidSubs,
            conversions:modeledPaidSubs, optInRate:installs>0?trials/installs:0,
            cpa:modeledPaidSubs>0?spend/modeledPaidSubs:0, cpi:installs>0?spend/installs:0,
            cpc:clicks>0?spend/clicks:0, daysCount:dates.length, startDate:dates[0], endDate:dates[dates.length-1]};
    };

    const activeCampaigns = campaigns.filter(c => selectedCampaigns.includes(c.name)).map(applyDateFilter);
    const totalActualSpend = activeCampaigns.reduce((s,c) => s+c.spend, 0);
    const totalInstalls = activeCampaigns.reduce((s,c) => s+(c.installs||0), 0);
    const totalTrials = activeCampaigns.reduce((s,c) => s+(c.trials||0), 0);
    const totalActualConversions = activeCampaigns.reduce((s,c) => s+c.conversions, 0);
    const liveOptInRate = totalInstalls > 0 ? totalTrials/totalInstalls : 0.40;
    const cpi = totalInstalls > 0 ? totalActualSpend/totalInstalls : 0.74;
    const daysOfData = activeCampaigns.length > 0 ? Math.max(...activeCampaigns.map(c=>c.daysCount)) : 30;
    const monthsOfData = daysOfData / 30;
    const baseMonthlySpend = totalActualSpend > 0 ? totalActualSpend/Math.max(monthsOfData,0.5) : 30000;
    const projectedMonthlySpend = monthlySpendOverride !== '' ? parseFloat(monthlySpendOverride)||baseMonthlySpend : baseMonthlySpend*spendMultiplier;
    const targetCPA = settings.targetCPA || 2.50;

    // ── Acquisition funnel ─────────────────────────────────────────────────
    const computeAcq = (spend) => {
        const installs = spend/cpi;
        const trials = installs*liveOptInRate;
        const newSubs = trials*MODEL.trialConvRate;
        return { installs, trials, newSubs, cpa: newSubs>0 ? spend/newSubs : 0 };
    };

    // ── Per-install LTV functions ──────────────────────────────────────────
    // Ad LTV for a cohort of installs over N months
    const adLTVperInstall = (numMonths) => {
        let ltv = 0;
        for (let i = 0; i < numMonths; i++) {
            const mauRet = MODEL.mauRetention[i] !== undefined ? MODEL.mauRetention[i] : MODEL.mauRetention[MODEL.mauRetention.length-1];
            // Monthly ad rev per install = MAU_ret × DAU/MAU × ARPDAU × 30
            ltv += mauRet * MODEL.dauMauRatio * MODEL.arpdau * 30;
        }
        return ltv;
    };

    // Sub LTV for a new subscriber cohort over N months
    const subLTVperSub = (numMonths) => {
        let ltv = 0;
        for (let i = 0; i < numMonths; i++) {
            const ret = MODEL.subRetention[i] !== undefined ? MODEL.subRetention[i] : MODEL.subRetention[MODEL.subRetention.length-1];
            ltv += ret * MODEL.arppu;
        }
        return ltv;
    };

    // Blended LTV per install (ad + sub contribution)
    const blendedLTVperInstall = (numMonths) => {
        const adLtv = adLTVperInstall(numMonths);
        if (!MODEL.subEnabled) return adLtv;
        const subConvFromInstall = liveOptInRate * MODEL.trialConvRate; // % of installs that become subs
        const subLtv = subConvFromInstall * subLTVperSub(numMonths);
        return adLtv + subLtv;
    };

    // ── Full 24-month cohort projection ───────────────────────────────────
    const buildProjection = (monthlySpend) => {
        const cohorts = []; // {month, installs, newSubs}
        const proj = [];

        for (let m = 0; m < MONTHS; m++) {
            const acq = computeAcq(monthlySpend);
            cohorts.push({ month: m, installs: acq.installs, newSubs: acq.newSubs });

            let totalMAU = 0, totalActiveSubs = 0, totalAdRev = 0, totalSubRev = 0;

            cohorts.forEach(cohort => {
                const offset = m - cohort.month;
                const mauRet = MODEL.mauRetention[offset] !== undefined ? MODEL.mauRetention[offset] : MODEL.mauRetention[MODEL.mauRetention.length-1];
                const subRet = MODEL.subRetention[offset] !== undefined ? MODEL.subRetention[offset] : MODEL.subRetention[MODEL.subRetention.length-1];

                const mau = cohort.installs * mauRet;
                const dau = mau * MODEL.dauMauRatio;
                const adRev = dau * MODEL.arpdau * 30; // monthly

                const activeSubs = cohort.newSubs * subRet;
                const subRev = activeSubs * MODEL.arppu;

                totalMAU += mau;
                totalActiveSubs += activeSubs;
                totalAdRev += adRev;
                if (MODEL.subEnabled) totalSubRev += subRev;
            });

            const apiCost = MODEL.subEnabled ? totalActiveSubs * MODEL.apiCostPerSub : 0;
            const totalRev = totalAdRev + totalSubRev;
            const totalCost = monthlySpend + apiCost;
            const netCF = totalRev - totalCost;
            const margin = totalRev > 0 ? ((totalRev-totalCost)/totalRev*100) : 0;
            const acqCur = computeAcq(monthlySpend);

            proj.push({
                month: m+1,
                installs: Math.round(acqCur.installs),
                newSubs: Math.round(acqCur.newSubs),
                mau: Math.round(totalMAU),
                dau: Math.round(totalMAU * MODEL.dauMauRatio),
                activeSubs: Math.round(totalActiveSubs),
                adRev: totalAdRev,
                subRev: totalSubRev,
                totalRev,
                adSpend: monthlySpend,
                apiCost,
                totalCost,
                netCF,
                cumCF: 0,
                margin,
            });
        }
        let cum = 0;
        proj.forEach(p => { cum += p.netCF; p.cumCF = cum; });
        return proj;
    };

    // ── Cohort ROAS ───────────────────────────────────────────────────────
    const cohortROAS = (monthlySpend, numMonths) => {
        const acq = computeAcq(monthlySpend);
        let adRev = 0, subRev = 0, apiCost = 0;
        for (let i = 0; i < numMonths; i++) {
            const mauRet = MODEL.mauRetention[i] !== undefined ? MODEL.mauRetention[i] : MODEL.mauRetention[MODEL.mauRetention.length-1];
            const subRet = MODEL.subRetention[i] !== undefined ? MODEL.subRetention[i] : MODEL.subRetention[MODEL.subRetention.length-1];
            const mau = acq.installs * mauRet;
            const dau = mau * MODEL.dauMauRatio;
            adRev += dau * MODEL.arpdau * 30;
            if (MODEL.subEnabled) {
                const subs = acq.newSubs * subRet;
                subRev += subs * MODEL.arppu;
                apiCost += subs * MODEL.apiCostPerSub;
            }
        }
        const totalRev = adRev + subRev;
        return { roas: totalRev/(monthlySpend+apiCost), adRev, subRev, apiCost, installs: acq.installs };
    };

    const acq = computeAcq(projectedMonthlySpend);
    const proj = buildProjection(projectedMonthlySpend);
    const breakEvenMonth = proj.find(p => p.cumCF >= 0);
    const paybackMonth = Array.from({length:24},(_,i) => ({month:i+1, roas:cohortROAS(projectedMonthlySpend,i+1).roas})).find(r=>r.roas>=1);

    // LTV curves (per install)
    const adLTVCurve = Array.from({length:24},(_,i) => adLTVperInstall(i+1));
    const blendedLTVCurve = Array.from({length:24},(_,i) => blendedLTVperInstall(i+1));
    const adLTV12 = adLTVCurve[11];
    const adLTV24 = adLTVCurve[23];
    const blendedLTV12 = blendedLTVCurve[11];
    const blendedLTV24 = blendedLTVCurve[23];

    // Per-MAU LTV (ad only, common metric)
    const arpmau = MODEL.dauMauRatio * MODEL.arpdau * 30; // ad revenue per MAU per month

    const roas12 = cohortROAS(projectedMonthlySpend, 12).roas;
    const roas24 = cohortROAS(projectedMonthlySpend, 24).roas;
    const isScalable = roas12 >= 1 && paybackMonth && paybackMonth.month <= 12;
    const isOptimize = roas12 >= 0.7 && (!paybackMonth || paybackMonth.month > 12);

    const fmtK = (n) => { const abs=Math.abs(n); const sign=n<0?'-':''; return abs>=1000?sign+'$'+(abs/1000).toFixed(1)+'k':sign+'$'+abs.toFixed(0); };
    const fmtN = (n) => n>=1000?(n/1000).toFixed(1)+'k':Math.round(n).toString();
    const fmt2 = (n) => '$'+n.toFixed(2);
    const fmtM = (n) => n>=1000000?(n/1000000).toFixed(2)+'M':n>=1000?(n/1000).toFixed(1)+'k':Math.round(n).toString();

    // ── Charts ─────────────────────────────────────────────────────────────
    useEffect(() => {
        if (!activeCampaigns.length && campaigns.length > 0) return;

        // LTV curve chart
        if (ltvChartRef.current) {
            if (ltvChartInst.current) ltvChartInst.current.destroy();
            const labels = Array.from({length:24},(_,i)=>'M'+(i+1));
            ltvChartInst.current = new Chart(ltvChartRef.current, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Ad LTV/install', data: adLTVCurve, borderColor:'#f59e0b', backgroundColor:'rgba(245,158,11,0.1)', borderWidth:3, fill:true, tension:0.4, pointRadius:0 },
                        ...(MODEL.subEnabled ? [{ label: 'Blended LTV/install', data: blendedLTVCurve, borderColor:'#6366f1', backgroundColor:'rgba(99,102,241,0.05)', borderWidth:3, fill:false, tension:0.4, pointRadius:0, borderDash:[] }] : []),
                        { label: 'CPI (payback line)', data: Array(24).fill(cpi), borderColor:'#ef4444', borderWidth:1.5, borderDash:[4,3], pointRadius:0, fill:false },
                    ].filter(Boolean)
                },
                options: {
                    responsive:true, maintainAspectRatio:false,
                    interaction:{mode:'index',intersect:false},
                    plugins:{ legend:{position:'top',labels:{font:{size:11},boxWidth:12}}, tooltip:{callbacks:{label:ctx=>` ${ctx.dataset.label}: $${ctx.parsed.y.toFixed(3)}`}} },
                    scales:{ y:{ticks:{callback:v=>'$'+v.toFixed(2)},title:{display:true,text:'$ per install',font:{size:10}}}, x:{grid:{color:'rgba(0,0,0,0.04)'}} }
                }
            });
        }

        // Cash flow chart (deep dive)
        if (cashChartRef.current && showDeepDive) {
            if (cashChartInst.current) cashChartInst.current.destroy();
            cashChartInst.current = new Chart(cashChartRef.current, {
                type:'bar',
                data:{
                    labels: proj.map(p=>'M'+p.month),
                    datasets:[
                        { label:'Ad Revenue', data:proj.map(p=>p.adRev), backgroundColor:'rgba(245,158,11,0.8)' },
                        { label:'Sub Revenue', data:proj.map(p=>p.subRev), backgroundColor:'rgba(139,92,246,0.8)' },
                        { label:'Ad Spend', data:proj.map(p=>-p.adSpend), backgroundColor:'rgba(239,68,68,0.7)' },
                        { label:'API Cost', data:proj.map(p=>-p.apiCost), backgroundColor:'rgba(251,146,60,0.7)' },
                        { label:'Cumulative CF', data:proj.map(p=>p.cumCF), type:'line', borderColor:'rgb(59,130,246)', borderWidth:3, fill:false, tension:0.3, pointRadius:3 }
                    ]
                },
                options:{
                    responsive:true, maintainAspectRatio:false,
                    plugins:{legend:{position:'top'},tooltip:{callbacks:{label:(ctx)=>(ctx.dataset.label||'')+': '+fmtK(ctx.parsed.y)}}},
                    scales:{y:{ticks:{callback:v=>fmtK(v)},grid:{color:ctx=>ctx.tick.value===0?'rgba(0,0,0,0.3)':'rgba(0,0,0,0.1)'}}}
                }
            });
        }

        return () => {
            if (cashChartInst.current) { cashChartInst.current.destroy(); cashChartInst.current = null; }
            if (ltvChartInst.current) { ltvChartInst.current.destroy(); ltvChartInst.current = null; }
        };
    }, [projectedMonthlySpend, spendMultiplier, monthlySpendOverride, selectedCampaigns, showDeepDive, MODEL.arpdau, MODEL.dauMauRatio]);

    if (campaigns.length === 0) return (
        <div className="text-center py-16">
            <div className="text-5xl mb-4">📊</div>
            <div className="text-lg font-semibold text-gray-700">Upload campaign data first</div>
            <div className="text-gray-500 text-sm mt-2">Financial projections need campaign data to calculate CPI and spend rates</div>
        </div>
    );

    const verdictBg = isScalable ? 'bg-green-50 border-green-400' : isOptimize ? 'bg-yellow-50 border-yellow-400' : 'bg-red-50 border-red-400';
    const verdictColor = isScalable ? 'text-green-700' : isOptimize ? 'text-yellow-700' : 'text-red-700';

    // ROAS scenario table
    const scenarioCPAs = [acq.cpa*1.5, acq.cpa, acq.cpa*0.75, targetCPA*1.5, targetCPA*1.25, targetCPA, targetCPA*0.75]
        .filter((v,i,a) => a.findIndex(x=>Math.abs(x-v)<0.05)===i).sort((a,b)=>b-a);

    const getScenarioROAS = (cpaVal, months) => {
        const subsPerMonth = acq.newSubs;
        const instPerMonth = acq.installs;
        const spend = instPerMonth > 0 ? instPerMonth * cpi : projectedMonthlySpend;
        let adRev=0, subRev=0, apiCost=0;
        for (let i=0;i<months;i++) {
            const mauRet = MODEL.mauRetention[i]||MODEL.mauRetention[MODEL.mauRetention.length-1];
            const subRet = MODEL.subRetention[i]||MODEL.subRetention[MODEL.subRetention.length-1];
            adRev += instPerMonth * mauRet * MODEL.dauMauRatio * MODEL.arpdau * 30;
            if (MODEL.subEnabled) {
                const subs = subsPerMonth * subRet;
                subRev += subs * MODEL.arppu;
                apiCost += subs * MODEL.apiCostPerSub;
            }
        }
        return (spend+apiCost) > 0 ? (adRev+subRev)/(spend+apiCost)*100 : 0;
    };

    return (
        <div className="space-y-5">

        {/* ══ SECTION 1: FILTERS ══ */}
        <div className="bg-white border border-gray-200 rounded-xl p-4">
            <div className="mb-3">
                <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Campaigns</div>
                <div className="flex flex-wrap gap-1.5">
                    <button onClick={selectAll} className="text-xs px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full hover:bg-blue-100 font-semibold border border-blue-200">All</button>
                    <button onClick={selectNone} className="text-xs px-2.5 py-1 bg-gray-100 text-gray-500 rounded-full hover:bg-gray-200 font-medium border border-gray-200">None</button>
                    {campaigns.map(c => {
                        const sel = selectedCampaigns.includes(c.name);
                        return <button key={c.name} onClick={() => toggleCampaign(c.name)}
                            className={"text-xs px-2.5 py-1 rounded-full border font-medium transition-all "+(sel?'bg-blue-600 text-white border-blue-600':'bg-white text-gray-500 border-gray-300 hover:border-blue-300 hover:text-blue-600')}>{c.name}</button>;
                    })}
                </div>
            </div>
            <div className="flex flex-wrap items-end gap-4 pt-3 border-t border-gray-100">
                <div className="flex items-end gap-2">
                    <div>
                        <div className="text-xs text-gray-400 mb-1">From</div>
                        <input type="date" value={dateRange.start} onChange={e=>setDateRange({...dateRange,start:e.target.value})} className="border border-gray-200 rounded-lg px-2 py-1.5 text-xs bg-gray-50 focus:bg-white focus:border-blue-400 outline-none" />
                    </div>
                    <div>
                        <div className="text-xs text-gray-400 mb-1">To</div>
                        <input type="date" value={dateRange.end} onChange={e=>setDateRange({...dateRange,end:e.target.value})} className="border border-gray-200 rounded-lg px-2 py-1.5 text-xs bg-gray-50 focus:bg-white focus:border-blue-400 outline-none" />
                    </div>
                    {(dateRange.start||dateRange.end) && <button onClick={()=>setDateRange({start:'',end:''})} className="text-xs px-2 py-1.5 bg-gray-100 rounded-lg hover:bg-red-50 hover:text-red-600 text-gray-500 border border-gray-200">✕ Clear</button>}
                </div>
                <div className="flex items-end gap-3">
                    <div>
                        <div className="text-xs text-gray-400 mb-1">Monthly spend override</div>
                        <div className="flex items-center gap-2">
                            <span className="text-gray-400 text-sm font-medium">$</span>
                            <input type="number" value={monthlySpendOverride} onChange={e=>{setMonthlySpendOverride(e.target.value);setSpendMultiplier(1);}} placeholder={Math.round(baseMonthlySpend).toString()} className="border border-gray-200 rounded-lg px-2 py-1.5 text-xs w-28 bg-gray-50 focus:bg-white focus:border-blue-400 outline-none" />
                        </div>
                    </div>
                    <div>
                        <div className="text-xs text-gray-400 mb-1">Scale: <strong className="text-blue-600">{spendMultiplier}×</strong> = <strong>{fmtK(baseMonthlySpend*spendMultiplier)}/mo</strong></div>
                        <input type="range" min="0.5" max="10" step="0.5" value={spendMultiplier} onChange={e=>{setSpendMultiplier(parseFloat(e.target.value));setMonthlySpendOverride('');}} className="w-32 accent-blue-600" />
                    </div>
                </div>
                <div className="ml-auto flex items-end">
                    <button onClick={()=>setShowWorkings(!showWorkings)} className={"text-xs px-3 py-1.5 rounded-lg font-medium border transition-all "+(showWorkings?'bg-gray-900 text-yellow-300 border-gray-700':'bg-white text-gray-500 border-gray-300 hover:bg-gray-50')}>
                        {showWorkings?'▼ Hide Workings':'▶ Show Workings'}
                    </button>
                </div>
            </div>
            {selectedCampaigns.length > 0 && (
                <div className="mt-3 flex flex-wrap gap-4 text-xs text-gray-500 pt-3 border-t border-gray-100">
                    <span>📊 <strong className="text-gray-700">{fmtK(totalActualSpend)}</strong> actual spend</span>
                    <span>📲 <strong className="text-gray-700">{fmtN(totalInstalls)}</strong> installs · CPI <strong className="text-gray-700">{fmt2(cpi)}</strong></span>
                    <span>🎯 <strong className="text-gray-700">{fmtN(totalTrials)}</strong> trials · {(liveOptInRate*100).toFixed(1)}% opt-in</span>
                    <span>💰 <strong className="text-amber-700">ARPDAU ${MODEL.arpdau.toFixed(4)}</strong> · ARPMAU <strong className="text-amber-700">${arpmau.toFixed(3)}</strong></span>
                </div>
            )}
        </div>

        {/* ══ SECTION 2: AD REVENUE KPI STRIP ══ */}
        <div>
            <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2 px-1">💰 Ad Revenue KPIs — at {fmtK(projectedMonthlySpend)}/mo spend</div>
            <div className="grid grid-cols-5 gap-3">
                {[
                    { label: 'ARPDAU', value: '$'+MODEL.arpdau.toFixed(4), sub: 'ad rev / DAU / day', bg:'bg-amber-50', border:'border-amber-200', text:'text-amber-800', sub_c:'text-amber-500', big:false },
                    { label: 'ARPMAU', value: '$'+arpmau.toFixed(3), sub: 'ARPDAU × DAU/MAU × 30', bg:'bg-amber-50', border:'border-amber-200', text:'text-amber-800', sub_c:'text-amber-500', big:false },
                    { label: 'DAU @ M12', value: fmtM(proj[11]?.dau||0), sub: (MODEL.dauMauRatio*100).toFixed(0)+'% of MAU '+fmtM(proj[11]?.mau||0), bg:'bg-orange-50', border:'border-orange-200', text:'text-orange-800', sub_c:'text-orange-500', big:false },
                    { label: 'Ad LTV/Install (12M)', value: '$'+(adLTV12).toFixed(2), sub: 'cumul. ad rev per install', bg:'bg-yellow-50', border:'border-yellow-300', text:'text-yellow-800', sub_c:'text-yellow-600', big:true },
                    { label: 'Blended LTV/Install (12M)', value: '$'+(blendedLTV12).toFixed(2), sub: 'ad + sub revenue combined', bg:'bg-indigo-50', border:'border-indigo-300', text:'text-indigo-800', sub_c:'text-indigo-500', big:true },
                ].map((item,i) => (
                    <div key={i} className={"rounded-xl px-3 py-3 text-center border "+(item.big?'ring-2 ring-offset-1 ring-amber-300 ':'')+item.bg+' '+item.border}>
                        <div className={"text-xs font-medium mb-1 "+item.sub_c}>{item.label}</div>
                        <div className={"font-bold "+item.text+(item.big?' text-xl':' text-base')}>{item.value}</div>
                        <div className={"text-xs mt-0.5 "+item.sub_c}>{item.sub}</div>
                    </div>
                ))}
            </div>
        </div>

        {/* ══ SECTION 3: ACQUISITION + VERDICT ══ */}
        <div className="grid grid-cols-2 gap-4">
            {/* Acquisition funnel */}
            <div className="bg-white border border-gray-200 rounded-xl p-5">
                <div className="text-sm font-semibold text-gray-700 mb-3">📲 Acquisition Funnel — {fmtK(projectedMonthlySpend)}/mo</div>
                <div className="space-y-2">
                    {[
                        { label:'Ad Spend/mo', value:fmtK(projectedMonthlySpend), color:'text-red-600' },
                        { label:'Installs/mo', value:fmtN(acq.installs), color:'text-gray-800' },
                        { label:'Trials/mo', value:fmtN(acq.trials), color:'text-blue-700', sub:(liveOptInRate*100).toFixed(1)+'% opt-in' },
                        ...(MODEL.subEnabled ? [
                            { label:'New Paid Subs/mo', value:fmtN(acq.newSubs), color:'text-violet-700', sub:(MODEL.trialConvRate*100).toFixed(0)+'% trial→paid' },
                        ] : []),
                        { label:'CPI', value:fmt2(cpi), color:'text-gray-700' },
                        ...(MODEL.subEnabled ? [
                            { label:'CPA (per paid sub)', value:fmt2(acq.cpa), color:acq.cpa<=targetCPA?'text-emerald-600':'text-red-600' },
                        ] : []),
                    ].filter(Boolean).map((row,i) => (
                        <div key={i} className="flex items-center justify-between px-3 py-2 bg-gray-50 rounded-lg border border-gray-100">
                            <span className="text-xs text-gray-500">{row.label}</span>
                            <div className="text-right">
                                <span className={"text-sm font-bold "+row.color}>{row.value}</span>
                                {row.sub && <div className="text-xs text-gray-400">{row.sub}</div>}
                            </div>
                        </div>
                    ))}
                </div>
            </div>

            {/* Verdict + key outcomes */}
            <div className="space-y-3">
                <div className={"rounded-xl border-2 p-4 "+verdictBg}>
                    <div className={"text-sm font-bold mb-1 "+verdictColor}>
                        {isScalable ? '🚀 SCALABLE — Positive ROAS within 12 months' : isOptimize ? '⚙️ OPTIMIZE — Positive ROAS by M12 reachable' : '⚠️ UNIT ECONOMICS NEED WORK'}
                    </div>
                    <div className={"text-xs "+verdictColor}>
                        12M Blended ROAS: <strong>{(roas12*100).toFixed(0)}%</strong> · 24M: <strong>{(roas24*100).toFixed(0)}%</strong>
                        {paybackMonth ? ` · Cohort payback at Month ${paybackMonth.month}` : ' · No payback within 24mo'}
                    </div>
                </div>

                <div className="bg-white border border-gray-200 rounded-xl p-4 grid grid-cols-2 gap-3">
                    {[
                        { label:'M12 MAU', value:fmtM(proj[11]?.mau||0), sub:'monthly actives' },
                        { label:'M12 DAU', value:fmtM(proj[11]?.dau||0), sub:(MODEL.dauMauRatio*100).toFixed(0)+'% DAU/MAU' },
                        { label:'M12 Ad Revenue', value:fmtK(proj[11]?.adRev||0)+'/mo', sub:'💰 primary' },
                        ...(MODEL.subEnabled ? [{ label:'M12 Sub Revenue', value:fmtK(proj[11]?.subRev||0)+'/mo', sub:'🔒 secondary' }] : []),
                        { label:'M12 Total Revenue', value:fmtK(proj[11]?.totalRev||0)+'/mo', sub:'combined' },
                        { label:'M12 Net CF', value:fmtK(proj[11]?.netCF||0)+'/mo', sub:(proj[11]?.margin||0).toFixed(0)+'% margin' },
                        { label:'24M Blended LTV', value:'$'+blendedLTV24.toFixed(2)+'/install', sub:'vs CPI '+fmt2(cpi) },
                        { label:'LTV:CPI Ratio', value:(blendedLTV24/Math.max(cpi,0.01)).toFixed(1)+'×', sub:'payback multiple' },
                    ].filter(Boolean).map((item,i) => (
                        <div key={i} className="bg-gray-50 rounded-lg p-2.5">
                            <div className="text-xs text-gray-500 mb-0.5">{item.label}</div>
                            <div className="text-sm font-bold text-gray-800">{item.value}</div>
                            <div className="text-xs text-gray-400">{item.sub}</div>
                        </div>
                    ))}
                </div>
            </div>
        </div>

        {/* ══ SECTION 4: MAU-BASED LTV CURVE ══ */}
        <div className="bg-white border border-gray-200 rounded-xl p-5">
            <div className="flex items-center justify-between mb-3">
                <div>
                    <div className="text-sm font-semibold text-gray-700">📈 MAU Retention × Ad Revenue — LTV Curve per Install</div>
                    <div className="text-xs text-gray-400 mt-0.5">Cumulative ad revenue per install · {(MODEL.dauMauRatio*100).toFixed(0)}% DAU/MAU · ${MODEL.arpdau.toFixed(4)} ARPDAU{MODEL.subEnabled?' · purple = ad+sub blended':''}</div>
                </div>
                <div className="flex gap-3 text-xs text-gray-500">
                    <span><span className="inline-block w-3 h-3 rounded-sm bg-amber-400 mr-1 align-middle"></span>Ad LTV/install</span>
                    {MODEL.subEnabled && <span><span className="inline-block w-3 h-3 rounded-sm bg-indigo-500 mr-1 align-middle"></span>Blended LTV</span>}
                    <span><span className="inline-block w-6 h-0 border-t-2 border-red-400 border-dashed mr-1 align-middle inline-block"></span>CPI</span>
                </div>
            </div>
            <div className="border border-gray-100 rounded-lg p-2 bg-gray-50" style={{height:'260px',position:'relative'}}>
                <canvas ref={ltvChartRef}></canvas>
            </div>
            <div className="mt-3 grid grid-cols-4 gap-3">
                {[
                    { label:'Ad LTV 3M', value:'$'+adLTVperInstall(3).toFixed(3) },
                    { label:'Ad LTV 6M', value:'$'+adLTVperInstall(6).toFixed(3) },
                    { label:'Ad LTV 12M', value:'$'+adLTV12.toFixed(3) },
                    { label:'Ad LTV 24M', value:'$'+adLTV24.toFixed(3) },
                ].map((item,i) => (
                    <div key={i} className="bg-amber-50 border border-amber-200 rounded-lg p-2.5 text-center">
                        <div className="text-xs text-amber-600 mb-0.5">{item.label}</div>
                        <div className="text-sm font-bold text-amber-800">{item.value}</div>
                    </div>
                ))}
            </div>
        </div>

        {/* ══ SECTION 5: MAU RETENTION MODEL ══ */}
        <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
            <button onClick={() => setActiveAnalysisTab(activeAnalysisTab==='retention'?'':'retention')}
                className="w-full flex items-center justify-between px-5 py-4 hover:bg-gray-50 transition-colors">
                <div>
                    <span className="font-semibold text-gray-700">📉 MAU Retention Model — Monthly Active Users by Cohort</span>
                    <span className="ml-3 text-xs text-gray-400">Retention schedule driving ad revenue projections</span>
                </div>
                <span className={"text-xs font-medium px-3 py-1 rounded-full border "+(activeAnalysisTab==='retention'?'bg-gray-100 text-gray-600 border-gray-200':'bg-blue-50 text-blue-600 border-blue-200')}>
                    {activeAnalysisTab==='retention'?'▲ Collapse':'▼ Expand'}
                </span>
            </button>
            {activeAnalysisTab==='retention' && (
                <div className="border-t border-gray-100 p-5 space-y-4">
                    <div className="text-xs text-gray-500 mb-3">
                        MAU retention curve used in the model. Month 0 = install month. These rates × DAU/MAU ({(MODEL.dauMauRatio*100).toFixed(0)}%) × ARPDAU (${MODEL.arpdau.toFixed(4)}) × 30 = monthly ad revenue per install in each month.
                    </div>
                    {/* Retention table */}
                    <div className="overflow-x-auto">
                        <table className="w-full text-xs">
                            <thead className="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    {MODEL.mauRetention.map((_,i) => (
                                        <th key={i} className="px-2 py-2 text-center font-medium text-gray-500">M{i}</th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                <tr className="border-b border-gray-100">
                                    {MODEL.mauRetention.map((r,i) => (
                                        <td key={i} className="px-2 py-2 text-center">
                                            <div className={"font-bold "+(r>=0.5?'text-green-700':r>=0.3?'text-amber-600':r>=0.2?'text-orange-500':'text-red-500')}>
                                                {(r*100).toFixed(0)}%
                                            </div>
                                        </td>
                                    ))}
                                </tr>
                                <tr>
                                    {MODEL.mauRetention.map((r,i) => (
                                        <td key={i} className="px-2 py-1.5 text-center text-gray-400 text-xs">
                                            ${(r*MODEL.dauMauRatio*MODEL.arpdau*30).toFixed(3)}
                                        </td>
                                    ))}
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div className="text-xs text-gray-400 bg-gray-50 rounded-lg p-2.5 border border-gray-100">
                        Row 1 = MAU retention rate. Row 2 = monthly ad revenue per install in that cohort month (retention × {(MODEL.dauMauRatio*100).toFixed(0)}% DAU/MAU × ${MODEL.arpdau.toFixed(4)} ARPDAU × 30 days).
                        <br/>LTV at month N = sum of row 2 from M0 to MN.
                    </div>
                    {/* ROAS scenario table */}
                    <div>
                        <div className="text-xs font-semibold text-gray-600 mb-2">ROAS Scenario Table — Blended (Ad + Sub) at different CPAs</div>
                        <div className="overflow-x-auto rounded-lg border border-gray-200">
                            <table className="w-full text-xs">
                                <thead className="bg-gray-50 border-b border-gray-200">
                                    <tr>
                                        <th className="px-3 py-2 text-left font-semibold text-gray-500">CPA</th>
                                        {[3,6,9,12,18,24].map(m => <th key={m} className="px-2 py-2 text-center font-semibold text-gray-500">M{m} ROAS</th>)}
                                    </tr>
                                </thead>
                                <tbody>
                                    {scenarioCPAs.map((cpaVal,ri) => {
                                        const isCurrent = Math.abs(cpaVal-acq.cpa)<0.15;
                                        const isTarget = Math.abs(cpaVal-targetCPA)<0.15;
                                        return (
                                            <tr key={ri} className={"border-b border-gray-100 "+(isCurrent?'bg-blue-50':isTarget?'bg-green-50':ri%2===0?'bg-white':'bg-gray-50/50')}>
                                                <td className="px-3 py-2 font-semibold text-gray-800">
                                                    ${cpaVal.toFixed(2)}
                                                    {isCurrent && <span className="ml-1 text-xs text-blue-600 font-normal">(current)</span>}
                                                    {isTarget && !isCurrent && <span className="ml-1 text-xs text-green-600 font-normal">(target)</span>}
                                                </td>
                                                {[3,6,9,12,18,24].map(m => {
                                                    const roas = getScenarioROAS(cpaVal,m);
                                                    return (
                                                        <td key={m} className={"px-2 py-2 text-center font-mono font-bold "+(roas>=100?'text-green-600':roas>=70?'text-amber-600':'text-red-500')}>
                                                            {roas.toFixed(0)}%
                                                        </td>
                                                    );
                                                })}
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            )}
        </div>

        {/* ══ SECTION 6: DEEP DIVE TABLE ══ */}
        <div className="bg-white border border-gray-200 rounded-xl overflow-hidden">
            <button onClick={() => setShowDeepDive(!showDeepDive)}
                className="w-full flex items-center justify-between px-5 py-4 hover:bg-gray-50 transition-colors">
                <div>
                    <span className="font-semibold text-gray-700">📋 Deep Dive — 24-Month Projection Table</span>
                    <span className="ml-3 text-xs text-gray-400">Ad rev + sub rev + cash flow · month by month</span>
                </div>
                <span className={"text-xs font-medium px-3 py-1 rounded-full border "+(showDeepDive?'bg-gray-100 text-gray-600 border-gray-200':'bg-blue-50 text-blue-600 border-blue-200')}>
                    {showDeepDive?'▲ Collapse':'▼ Expand'}
                </span>
            </button>
            {showDeepDive && (
                <div className="border-t border-gray-100 p-5 space-y-5">
                    <div>
                        <div className="flex items-center justify-between mb-3">
                            <h4 className="text-sm font-semibold text-gray-600">Cash Flow (24 months)</h4>
                            <div className="flex gap-3 text-xs text-gray-500">
                                <span><span className="inline-block w-2.5 h-2.5 rounded-sm bg-amber-400 mr-1"></span>Ad Rev</span>
                                <span><span className="inline-block w-2.5 h-2.5 rounded-sm bg-violet-500 mr-1"></span>Sub Rev</span>
                                <span><span className="inline-block w-2.5 h-2.5 rounded-sm bg-red-400 mr-1"></span>Ad spend</span>
                                <span><span className="inline-block w-2.5 h-2 border-2 border-blue-500 mr-1"></span>Cumulative</span>
                            </div>
                        </div>
                        <div className="border border-gray-100 rounded-lg p-2 bg-gray-50" style={{height:'300px',position:'relative'}}>
                            <canvas ref={cashChartRef}></canvas>
                        </div>
                        <div className="mt-2">
                            {breakEvenMonth
                                ? <div className="text-xs text-green-700 bg-green-50 rounded-lg p-2.5 border border-green-200">✅ Cumulative cash flow turns positive at <strong>Month {breakEvenMonth.month}</strong> · Total revenue at that point: <strong>{fmtK(breakEvenMonth.totalRev)}/mo</strong></div>
                                : <div className="text-xs text-orange-700 bg-orange-50 rounded-lg p-2.5 border border-orange-200">⚠️ Cumulative cash flow doesn't turn positive within 24 months at {fmtK(projectedMonthlySpend)}/mo spend</div>
                            }
                        </div>
                    </div>
                    <div className="overflow-x-auto rounded-lg border border-gray-200">
                        <table className="w-full text-xs">
                            <thead className="bg-gray-50 border-b border-gray-200">
                                <tr>
                                    {['Mo','Installs','MAU','DAU','Ad Rev','Sub Rev','Total Rev','Ad Spend','API Cost','Net CF','Margin','Cumul CF'].map(h => (
                                        <th key={h} className="px-2.5 py-2 text-left font-semibold text-gray-500 whitespace-nowrap">{h}</th>
                                    ))}
                                </tr>
                            </thead>
                            <tbody>
                                {proj.map((p,i) => (
                                    <tr key={i} className={"border-b border-gray-100 "+(p.cumCF>=0?'bg-green-50':i%2===0?'bg-white':'bg-gray-50/50')}>
                                        <td className="px-2.5 py-2 font-bold text-gray-500">M{p.month}</td>
                                        <td className="px-2.5 py-2 text-gray-600">{fmtN(p.installs)}</td>
                                        <td className="px-2.5 py-2 text-gray-600">{fmtN(p.mau)}</td>
                                        <td className="px-2.5 py-2 text-gray-600">{fmtN(p.dau)}</td>
                                        <td className="px-2.5 py-2 text-amber-700 font-semibold">{fmtK(p.adRev)}</td>
                                        <td className="px-2.5 py-2 text-violet-700">{fmtK(p.subRev)}</td>
                                        <td className="px-2.5 py-2 text-green-700 font-bold">{fmtK(p.totalRev)}</td>
                                        <td className="px-2.5 py-2 text-red-500">−{fmtK(p.adSpend)}</td>
                                        <td className="px-2.5 py-2 text-orange-500">−{fmtK(p.apiCost)}</td>
                                        <td className={"px-2.5 py-2 font-semibold "+(p.netCF>=0?'text-green-600':'text-red-500')}>{p.netCF>=0?'+':''}{fmtK(p.netCF)}</td>
                                        <td className={"px-2.5 py-2 "+(p.margin>=0?'text-green-600':'text-red-500')}>{p.margin.toFixed(0)}%</td>
                                        <td className={"px-2.5 py-2 font-bold "+(p.cumCF>=0?'text-green-600':'text-red-500')}>{p.cumCF>=0?'+':''}{fmtK(p.cumCF)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )}
        </div>

        {/* ══ MODEL WORKINGS ══ */}
        {showWorkings && (
            <div className="bg-gray-950 text-gray-100 rounded-xl p-6 space-y-4 border border-gray-700" style={{fontFamily:'monospace',fontSize:'12px',lineHeight:'1.7'}}>
                <div style={{color:'#facc15',fontWeight:'bold',fontSize:'13px',borderBottom:'1px solid #374151',paddingBottom:'8px'}}>
                    ▶ MODEL WORKINGS — full audit trail
                </div>
                <div>
                    <div style={{color:'#34d399',fontWeight:'bold',marginBottom:'6px'}}>① LIVE FROM CAMPAIGN DATA</div>
                    <div>CPI: <span style={{color:'#fde047'}}>{fmt2(cpi)}</span> = {fmtK(totalActualSpend)} ÷ {fmtN(totalInstalls)} installs</div>
                    <div>Opt-In Rate: <span style={{color:'#fde047'}}>{(liveOptInRate*100).toFixed(2)}%</span> = {totalTrials} trials ÷ {totalInstalls} installs</div>
                    <div>Base Monthly Spend: <span style={{color:'#fde047'}}>{fmtK(baseMonthlySpend)}</span> = {fmtK(totalActualSpend)} ÷ {monthsOfData.toFixed(1)} months</div>
                </div>
                <div>
                    <div style={{color:'#fbbf24',fontWeight:'bold',marginBottom:'6px'}}>② AD REVENUE MODEL (Primary)</div>
                    <div>ARPDAU: <span style={{color:'#fde047'}}>${MODEL.arpdau.toFixed(4)}/DAU/day</span></div>
                    <div>DAU/MAU Stickiness: <span style={{color:'#fde047'}}>{(MODEL.dauMauRatio*100).toFixed(0)}%</span></div>
                    <div>ARPMAU: <span style={{color:'#fde047'}}>${arpmau.toFixed(4)}/MAU/month</span> = ARPDAU × DAU/MAU × 30</div>
                    <div>M12 MAU: <span style={{color:'#fde047'}}>{fmtM(proj[11]?.mau||0)}</span></div>
                    <div>M12 DAU: <span style={{color:'#fde047'}}>{fmtM(proj[11]?.dau||0)}</span></div>
                    <div>M12 Ad Revenue: <span style={{color:'#fde047'}}>{fmtK(proj[11]?.adRev||0)}/mo</span></div>
                </div>
                <div>
                    <div style={{color:'#c084fc',fontWeight:'bold',marginBottom:'6px'}}>③ SUBSCRIPTION MODEL (Secondary)</div>
                    <div>Trial→Paid Conv: <span style={{color:'#fde047'}}>{(MODEL.trialConvRate*100).toFixed(0)}%</span></div>
                    <div>Monthly ARPPU: <span style={{color:'#fde047'}}>${MODEL.arppu.toFixed(2)}</span> (net of app store cut)</div>
                    <div>API Cost/Sub: <span style={{color:'#fde047'}}>${MODEL.apiCostPerSub.toFixed(2)}/month</span></div>
                    <div>M12 Active Subs: <span style={{color:'#fde047'}}>{fmtN(proj[11]?.activeSubs||0)}</span></div>
                    <div>M12 Sub Revenue: <span style={{color:'#fde047'}}>{fmtK(proj[11]?.subRev||0)}/mo</span></div>
                </div>
                <div>
                    <div style={{color:'#6ee7b7',fontWeight:'bold',marginBottom:'6px'}}>④ LTV PER INSTALL</div>
                    <div>Ad LTV 12M: <span style={{color:'#fde047'}}>${adLTV12.toFixed(4)}</span> = Σ(m=0..11: MAU_ret[m] × {(MODEL.dauMauRatio*100).toFixed(0)}% × ${MODEL.arpdau.toFixed(4)} × 30)</div>
                    <div>Sub contrib/install (12M): <span style={{color:'#fde047'}}>${(blendedLTV12-adLTV12).toFixed(4)}</span> = {(liveOptInRate*100).toFixed(1)}% × {(MODEL.trialConvRate*100).toFixed(0)}% × Σ(sub_ret × ARPPU)</div>
                    <div>Blended LTV 12M: <span style={{color:'#fde047'}}>${blendedLTV12.toFixed(4)}</span> vs CPI ${cpi.toFixed(4)} → {(blendedLTV12/Math.max(cpi,0.01)).toFixed(1)}× LTV:CPI</div>
                    <div>12M Blended ROAS: <span style={{color:'#fde047'}}>{(roas12*100).toFixed(0)}%</span></div>
                </div>
                <div>
                    <div style={{color:'#6ee7b7',fontWeight:'bold',marginBottom:'6px'}}>MAU RETENTION CURVE</div>
                    <div style={{color:'#9ca3af'}}>{MODEL.mauRetention.map((r,i)=>'M'+i+':'+(r*100).toFixed(0)+'%').join('  ')}</div>
                </div>
                <div>
                    <div style={{color:'#6ee7b7',fontWeight:'bold',marginBottom:'6px'}}>SUBSCRIBER RETENTION CURVE</div>
                    <div style={{color:'#9ca3af'}}>{MODEL.subRetention.map((r,i)=>'M'+i+':'+(r*100).toFixed(0)+'%').join('  ')}</div>
                </div>
            </div>
        )}
        </div>
    );
}


ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
