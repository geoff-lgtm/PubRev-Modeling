<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Solitaire Modeling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// Simple localStorage helpers
const store = {
    get: (key) => {
        try {
            const v = localStorage.getItem(key);
            return v ? JSON.parse(v) : null;
        } catch(e) { return null; }
    },
    set: (key, value) => {
        try {
            localStorage.setItem(key, JSON.stringify(value));
        } catch(e) { console.error('Save error:', e); }
    }
};

// ── DUMMY DATA (pre-loaded so dashboard works out of the box) ────────────────
const DUMMY_CAMPAIGNS = (() => {
    const makeDaily = (key, baseSpend, baseCPI, baseOptIn, platform, startDate, numDays) => {
        const data = {};
        const start = new Date(startDate);
        for (let i = 0; i < numDays; i++) {
            const d = new Date(start); d.setDate(d.getDate() + i);
            const dateStr = d.toISOString().split('T')[0];
            const noise = () => 0.8 + Math.random() * 0.4;
            const spend = baseSpend * noise();
            const clicks = Math.round(spend / (0.35 * noise()));
            const impressions = clicks * Math.round(15 + Math.random() * 10);
            const installs = Math.round(spend / (baseCPI * noise()));
            const trials = Math.round(installs * baseOptIn * noise());
            const modeledPaidSubs = trials * 0.40;
            data[dateStr] = { spend, clicks, impressions, installs, trials, modeledPaidSubs, cpc: clicks > 0 ? spend / clicks : 0 };
        }
        return data;
    };
    return {
        'Meta - Puzzle Lovers (US)':       { name: 'Meta - Puzzle Lovers (US)',       platform: 'Meta',    dailyData: makeDaily('meta-puzz', 210, 0.63, 0.43, 'Meta',    '2026-01-15', 40) },
        'Meta - Brain Games 35-54 (US)':   { name: 'Meta - Brain Games 35-54 (US)',   platform: 'Meta',    dailyData: makeDaily('meta-brain', 145, 0.71, 0.39, 'Meta',    '2026-01-18', 37) },
        'Google UAC - Broad (US)':         { name: 'Google UAC - Broad (US)',         platform: 'Google',  dailyData: makeDaily('goog-broad', 185, 0.58, 0.47, 'Google',  '2026-01-15', 40) },
        'Google UAC - Card Games (US)':    { name: 'Google UAC - Card Games (US)',    platform: 'Google',  dailyData: makeDaily('goog-card',  95,  0.67, 0.41, 'Google',  '2026-01-20', 35) },
        'App Store Search - US':           { name: 'App Store Search - US',           platform: 'ASA',     dailyData: makeDaily('asa-us',     230, 0.54, 0.55, 'ASA',     '2026-01-15', 40) },
        'App Store Search - CA/AU':        { name: 'App Store Search - CA/AU',        platform: 'ASA',     dailyData: makeDaily('asa-ca',     80,  0.61, 0.48, 'ASA',     '2026-01-22', 33) },
        'TikTok - Casual Gamers 18-34':    { name: 'TikTok - Casual Gamers 18-34',   platform: 'TikTok',  dailyData: makeDaily('tik-cas',    120, 0.82, 0.36, 'TikTok',  '2026-01-25', 30) },
    };
})();

// ── DUMMY INSTALL DATA (MAU tracking) ─────────────────────────────────────
// Keyed by date, each day has total installs from all sources
const DUMMY_INSTALL_DATA = (() => {
    const data = {};
    const start = new Date('2026-01-15');
    for (let i = 0; i < 40; i++) {
        const d = new Date(start); d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().split('T')[0];
        const noise = () => 0.75 + Math.random() * 0.5;
        data[dateStr] = {
            organic: Math.round(120 * noise()),
            paid: Math.round(280 * noise()),
            total: 0,
            mau: 0, // will be computed
        };
        data[dateStr].total = data[dateStr].organic + data[dateStr].paid;
    }
    return data;
})();

function App() {
    const [tab, setTab] = useState('dashboard');
    const [campaigns, setCampaigns] = useState(DUMMY_CAMPAIGNS);
    const [installData, setInstallData] = useState(DUMMY_INSTALL_DATA);
    const [adRevenueData, setAdRevenueData] = useState({});   // keyed by date
    const [campaignMeta, setCampaignMeta] = useState({});
    const [snapshots, setSnapshots] = useState([]);
    const [changelog, setChangelog] = useState([{ date: new Date().toISOString().split('T')[0], time:'', type:'seed', description:'Demo data loaded' }]);
    const [settings, setSettings] = useState({
        targetCPA: 2.50,
        maxCPA: 8.00,
        minDailyClicks: 50,
        learningThreshold: 50,
        stabilityDays: 3,
        stabilityTolerance: 0.05,
        // Ad revenue params — defaults based on real Spider Solitaire data
        arpdau: 0.157,          // avg from mediation report
        dauMauRatio: 1.0,           // 1.0 = retention curve is DAU retention (fitted from cohort data)
        adsPerDau: 121,         // avg Imp/dau from report
        ecpm: 1.32,             // avg eCPM from report
        adFillRate: 0.953,      // avg Ad Viewer Rate from report
        // Subscription params (secondary)
        arppu: 2.70,
        trialConvRate: 0.40,
        apiCostPerSub: 1.00,
        subEnabled: true,
    });
    const [uploading, setUploading] = useState(false);
    const [uploadingInstalls, setUploadingInstalls] = useState(false);
    const [uploadingAdRev, setUploadingAdRev] = useState(false);
    const [timeframes, setTimeframes] = useState({});

    useEffect(() => {
        const c = store.get('nw-campaigns'); if (c) setCampaigns(prev => ({...DUMMY_CAMPAIGNS, ...c}));
        const inst = store.get('nw-installs'); if (inst) setInstallData(prev => ({...DUMMY_INSTALL_DATA, ...inst}));
        const adrev = store.get('nw-adrev'); if (adrev) setAdRevenueData(adrev);
        const m = store.get('nw-meta'); if (m) setCampaignMeta(m);
        const s = store.get('nw-snapshots'); if (s) setSnapshots(s);
        const l = store.get('nw-changelog'); if (l) setChangelog(l);
        const st = store.get('nw-settings'); if (st) setSettings(st);
    }, []);

    const save = (key, value) => store.set(key, value);

    // ── Shared date normaliser ─────────────────────────────────────────────────
    // Handles: "2026-01-25", "Sun, Jan 25, 2026", "Jan 25, 2026", "01/25/2026"
    const normaliseDate = (raw) => {
        if (!raw) return null;
        const s = raw.toString().trim().replace(/^"+|"+$/g, '');
        // Already ISO
        if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        // "Sun, Jan 25, 2026" or "Jan 25, 2026"
        const longMatch = s.match(/(?:\w+,\s+)?(\w+ \d{1,2},\s+\d{4})/);
        if (longMatch) {
            const d = new Date(longMatch[1]);
            if (!isNaN(d)) return d.toISOString().split('T')[0];
        }
        // MM/DD/YYYY or M/D/YYYY
        const slashMatch = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        if (slashMatch) return `${slashMatch[3]}-${slashMatch[1].padStart(2,'0')}-${slashMatch[2].padStart(2,'0')}`;
        // Last-ditch
        const d = new Date(s);
        if (!isNaN(d)) return d.toISOString().split('T')[0];
        return null;
    };

    // ── UA / Ad Platform upload ───────────────────────────────────────────────
    const handleUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploading(true);

        // Derive a campaign name from the filename as fallback
        const fileBaseName = file.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').trim();

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                if (!results.data.length) { alert('No rows found in CSV'); setUploading(false); return; }
                const cols = Object.keys(results.data[0]);
                const updated = { ...campaigns };
                const newDates = new Set();
                const affected = new Set();

                // ── Format detection ──────────────────────────────────────────
                const has = (c) => cols.some(k => k.trim() === c);

                // Google Ads time-series: Date, Cost, Installs (no Campaign Name)
                const isGoogleTimeSeries = has('Cost') && has('Installs') && has('Date') && !has('Campaign Name') && !has('Adset');

                // ASA: Adset + af_subscribe
                const isASA = has('Adset') && has('af_subscribe');

                // Standard MMP: Campaign Name + (MMP) columns
                const isStandard = has('Campaign Name');

                results.data.forEach(row => {
                    const rawDate = row['Date'] || row['date'] || row['Day'] || '';
                    const date = normaliseDate(rawDate);
                    if (!date) return;

                    if (isGoogleTimeSeries) {
                        // Single-campaign totals export from Google Ads
                        const name = 'Google Ads – ' + fileBaseName;
                        if (!updated[name]) updated[name] = { name, platform: 'Google', dailyData: {} };
                        if (!updated[name].dailyData[date]) newDates.add(date);

                        const spend = parseFloat((row['Cost'] || '0').toString().replace(/[$,]/g, '')) || 0;
                        const installs = Math.round(parseFloat(row['Installs'] || 0));
                        const clicks = Math.round(parseFloat((row['Clicks'] || row['clicks'] || 0).toString().replace(/,/g,'')));
                        const impressions = Math.round(parseFloat((row['Impressions'] || row['impressions'] || 0).toString().replace(/,/g,'')));

                        updated[name].dailyData[date] = {
                            spend, clicks, impressions, installs,
                            cpc: clicks > 0 ? spend / clicks : 0,
                            trials: 0, modeledPaidSubs: 0
                        };
                        affected.add(name);
                        return;
                    }

                    if (isASA) {
                        const adset = row['Adset'];
                        if (!adset) return;
                        const name = 'ASA – ' + adset;
                        if (!updated[name]) updated[name] = { name, platform: 'ASA', dailyData: {} };
                        if (!updated[name].dailyData[date]) newDates.add(date);

                        const installs = parseInt(row['Installs appsflyer']) || 0;
                        const trials   = parseInt(row['af_subscribe']) || 0;
                        updated[name].dailyData[date] = {
                            spend: parseFloat((row['Cost']||'0').toString().replace(/[$,]/g,'')) || 0,
                            clicks: 0, cpc: 0, impressions: 0,
                            installs, trials, modeledPaidSubs: trials * 0.40
                        };
                        affected.add(name);
                        return;
                    }

                    if (isStandard) {
                        const name = (row['Campaign Name'] || '').trim();
                        if (!name) return;
                        if (!updated[name]) updated[name] = { name, dailyData: {} };
                        if (!updated[name].dailyData[date]) newDates.add(date);

                        const installs = parseInt(row['(MMP) Total App Installs'] || row['Installs'] || 0);
                        const trials   = parseInt(row['(MMP) App Purchases'] || row['Trials'] || 0);
                        const spend    = parseFloat((row['Amount Spent (USD)'] || row['Cost'] || row['Spend'] || '0').toString().replace(/[$,]/g,'')) || 0;

                        updated[name].dailyData[date] = {
                            spend,
                            clicks:      parseInt((row['Clicks']||'0').toString().replace(/,/g,'')) || 0,
                            cpc:         parseFloat(row['CPC (USD)'] || 0) || 0,
                            impressions: parseInt((row['Impressions']||'0').toString().replace(/,/g,'')) || 0,
                            installs, trials, modeledPaidSubs: trials * 0.40
                        };
                        affected.add(name);
                        return;
                    }

                    // Unknown format — try to infer a single campaign from filename
                    const name = fileBaseName || 'Imported Campaign';
                    if (!updated[name]) updated[name] = { name, platform: 'Unknown', dailyData: {} };
                    const spend = parseFloat((row['Cost'] || row['Spend'] || row['Amount Spent (USD)'] || '0').toString().replace(/[$,]/g,'')) || 0;
                    const installs = Math.round(parseFloat(row['Installs'] || 0));
                    if (!updated[name].dailyData[date]) newDates.add(date);
                    updated[name].dailyData[date] = { spend, clicks:0, cpc:0, impressions:0, installs, trials:0, modeledPaidSubs:0 };
                    affected.add(name);
                });

                if (!affected.size) {
                    alert(`Couldn't detect a recognised format.\n\nColumns found: ${cols.join(', ')}\n\nExpected one of:\n• Google Ads time-series: Date, Cost, Installs\n• Standard MMP: Campaign Name, Date, Amount Spent (USD), (MMP) Total App Installs\n• ASA: Adset, Date, Cost, Installs appsflyer, af_subscribe`);
                    setUploading(false);
                    return;
                }

                const snapshot = {
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString(),
                    timestamp: new Date().toISOString(),
                    campaigns: {}
                };
                Object.keys(updated).forEach(name => {
                    const m = getMetrics(updated[name], settings);
                    if (m) snapshot.campaigns[name] = { cpa: m.cpa, cpc: m.cpc, cvr: m.cvr, conversions: m.conversions, spend: m.spend };
                });

                const newSnapshots = [snapshot, ...snapshots].slice(0, 100);
                const newLog = [{
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString(),
                    type: 'upload',
                    description: `Uploaded: ${[...affected].join(', ')} · ${newDates.size} new dates`
                }, ...changelog];

                setCampaigns(updated);
                setSnapshots(newSnapshots);
                setChangelog(newLog);
                save('nw-campaigns', updated);
                save('nw-snapshots', newSnapshots);
                save('nw-changelog', newLog);
                setUploading(false);
                setTab('dashboard');
            },
            error: () => { alert('Error parsing CSV'); setUploading(false); }
        });
    };

    // ── Install / MAU data upload ─────────────────────────────────────────────
    const handleInstallUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadingInstalls(true);
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                const updated = { ...installData };
                let newCount = 0;

                results.data.forEach(row => {
                    const rawDate = row['Date'] || row['date'] || row['Day'] || '';
                    const date = normaliseDate(rawDate);
                    if (!date) return;

                    // Strip $ and commas from any numeric field
                    const clean = (v) => parseFloat((v||'0').toString().replace(/[$,]/g,'')) || 0;

                    const total   = Math.round(clean(row['Installs'] || row['installs'] || row['Total Installs']));
                    const organic = Math.round(clean(row['Organic Installs'] || row['organic'] || row['Organic']));
                    const paid    = Math.round(clean(row['Non-organic Installs'] || row['paid'] || row['Paid'])) || (total - organic);
                    const mau     = Math.round(clean(row['MAU'] || row['Monthly Active Users'] || row['Active Users']));
                    const dau     = Math.round(clean(row['DAU'] || row['Daily Active Users']));
                    // Google Ads time-series also works here for install-level data
                    const spend   = clean(row['Cost'] || row['Amount Spent (USD)'] || row['Spend']);

                    if (!updated[date]) newCount++;
                    updated[date] = {
                        ...updated[date],
                        total:   total   || updated[date]?.total   || 0,
                        organic: organic || updated[date]?.organic || 0,
                        paid:    paid    || updated[date]?.paid    || 0,
                        mau:     mau     || updated[date]?.mau     || 0,
                        dau:     dau     || updated[date]?.dau     || 0,
                        spend:   spend   || updated[date]?.spend   || 0,
                    };
                });

                const newLog = [{
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString(),
                    type: 'install-upload',
                    description: `Install data: ${newCount} new dates, ${Object.keys(updated).length} total days`
                }, ...changelog];

                setInstallData(updated);
                setChangelog(newLog);
                save('nw-installs', updated);
                save('nw-changelog', newLog);
                setUploadingInstalls(false);
                setTab('dashboard');
            },
            error: () => { alert('Error parsing install CSV'); setUploadingInstalls(false); }
        });
    };

    // ── Ad Revenue / Mediation report upload ──────────────────────────────────
    // Supports: pub_adv_mediation_analytics format (Day, Country, DAU, ARPDAU, Est. Revenue, eCPM, ...)
    const handleAdRevUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setUploadingAdRev(true);
        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            complete: (results) => {
                if (!results.data.length) { alert('No rows found'); setUploadingAdRev(false); return; }
                const updated = { ...adRevenueData };
                let newCount = 0;
                const clean = (v) => parseFloat((v||'0').toString().replace(/[$,]/g,'')) || 0;

                results.data.forEach(row => {
                    // Date column: 'Day' or 'Date'
                    const rawDate = row['Day'] || row['Date'] || row['date'] || '';
                    const date = normaliseDate(rawDate);
                    if (!date) return;

                    const country  = (row['Country'] || 'ALL').trim();
                    const key      = `${date}__${country}`;   // store per date+country

                    if (!updated[key]) newCount++;
                    updated[key] = {
                        date,
                        country,
                        dau:           Math.round(clean(row['DAU'])),
                        dav:           Math.round(clean(row['DAV'] || row['Daily Ad Viewers'] || 0)),
                        requests:      Math.round(clean(row['Requests'])),
                        arpdau:        clean(row['ARPDAU']),
                        estRevenue:    clean(row['Est. Revenue'] || row['Revenue'] || row['est_revenue']),
                        ecpm:          clean(row['eCPM']),
                        adViewerRate:  clean(row['Ad Viewer Rate'] || row['Fill Rate'] || 0),
                        reqPerDau:     clean(row['Req/dau'] || 0),
                        impPerDau:     clean(row['Imp/dau'] || 0),
                        app:           (row['Application Filter'] || '').replace(/\s*\(Include\)\s*$/, '').trim(),
                    };
                });

                // Compute avg ARPDAU from loaded data to auto-update settings
                const allRows = Object.values(updated);
                const avgArpdau = allRows.length
                    ? allRows.reduce((s,r) => s + r.arpdau, 0) / allRows.length
                    : settings.arpdau;
                const avgEcpm = allRows.length
                    ? allRows.reduce((s,r) => s + r.ecpm, 0) / allRows.length
                    : settings.ecpm;
                const avgFill = allRows.length
                    ? allRows.reduce((s,r) => s + r.adViewerRate, 0) / allRows.length
                    : settings.adFillRate;
                const avgImpDau = allRows.length
                    ? allRows.reduce((s,r) => s + r.impPerDau, 0) / allRows.length
                    : settings.adsPerDau;

                const updatedSettings = {
                    ...settings,
                    arpdau:       Math.round(avgArpdau * 10000) / 10000,
                    ecpm:         Math.round(avgEcpm  * 10000) / 10000,
                    adFillRate:   Math.round(avgFill  * 10000) / 10000,
                    adsPerDau:    Math.round(avgImpDau * 10) / 10,
                };

                const newLog = [{
                    date: new Date().toISOString().split('T')[0],
                    time: new Date().toLocaleTimeString(),
                    type: 'adrev-upload',
                    description: `Ad revenue data: ${newCount} new date/country rows · avg ARPDAU $${avgArpdau.toFixed(4)} · avg eCPM $${avgEcpm.toFixed(4)} · settings auto-updated`
                }, ...changelog];

                setAdRevenueData(updated);
                setSettings(updatedSettings);
                setChangelog(newLog);
                save('nw-adrev', updated);
                save('nw-settings', updatedSettings);
                save('nw-changelog', newLog);
                setUploadingAdRev(false);
                setTab('adrevenue');
            },
            error: () => { alert('Error parsing ad revenue CSV'); setUploadingAdRev(false); }
        });
    };
        if (!campaign?.dailyData) return null;
        let dates = Object.keys(campaign.dailyData).sort();
        if (!dates.length) return null;

        if (days && days !== 'all') {
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - days);
            const cutoffStr = cutoff.toISOString().split('T')[0];
            dates = dates.filter(d => d >= cutoffStr);
        }
        if (!dates.length) return null;

        let spend = 0, clicks = 0, impressions = 0, installs = 0, trials = 0, modeledPaidSubs = 0;
        dates.forEach(d => {
            const day = campaign.dailyData[d];
            spend += day.spend;
            clicks += day.clicks;
            impressions += day.impressions || 0;
            installs += day.installs || 0;
            trials += day.trials || 0;
            modeledPaidSubs += day.modeledPaidSubs || 0;
        });

        // Opt-in rate = trials / installs (live from campaign data)
        const optInRate = installs > 0 ? trials / installs : 0;
        // Conversions = modeled paid subs (trials * 40%)
        const conversions = modeledPaidSubs;
        const daysCount = dates.length;

        return {
            name: campaign.name,
            dailyData: campaign.dailyData,
            dates,
            spend,
            clicks,
            impressions,
            installs,
            trials,
            modeledPaidSubs,
            conversions,
            optInRate,
            // CPA = spend / modeled paid subs (trials * 40%)
            cpa: conversions > 0 ? spend / conversions : 0,
            cpc: clicks > 0 ? spend / clicks : 0,
            cpi: installs > 0 ? spend / installs : 0,
            ctr: impressions > 0 ? clicks / impressions * 100 : 0,
            // CVR = trials / clicks (click to trial rate)
            cvr: clicks > 0 ? trials / clicks * 100 : 0,
            daysCount,
            avgClicks: daysCount > 0 ? clicks / daysCount : 0,
            inLearning: conversions < s.learningThreshold,
            lowVolume: (daysCount > 0 ? clicks / daysCount : 0) < s.minDailyClicks,
            startDate: dates[0],
            endDate: dates[dates.length - 1]
        };
    };

    const getBroadLearnings = (name) => {
        const meta = campaignMeta[name];
        if (!meta?.learningSource) return null;
        const broad = campaigns[meta.learningSource];
        if (!broad) return null;
        const bm = getMetrics(broad, settings, 7);
        if (!bm) return null;
        const recent = bm.dates.slice(-settings.stabilityDays);
        const cpcs = recent.map(d => broad.dailyData[d].cpc);
        const avg = cpcs.reduce((a, b) => a + b, 0) / cpcs.length;
        const stable = cpcs.every(c => Math.abs(c - avg) / avg <= settings.stabilityTolerance);
        return { broadName: meta.learningSource, metrics: bm, avgCPC: avg, stable, stableDays: cpcs.length, requiredDays: settings.stabilityDays };
    };

    const getRec = (m, broad) => {
        if (!m || m.conversions === 0) return { action: 'monitor', msg: 'No conversions yet. Keep monitoring.', priority: 'low' };
        
        if (broad?.stable && m.cpc < broad.avgCPC * 0.8) {
            return { action: 'increase', msg: `Broad stable at $${broad.avgCPC.toFixed(2)} with $${broad.metrics.cpa.toFixed(2)} CPA. Increase CPC to match.`, rec: broad.avgCPC.toFixed(2), priority: 'high' };
        }
        if (m.inLearning) {
            if (m.lowVolume) return { action: 'increase', msg: `Learning phase: Need more volume. Increase CPC to get above ${settings.minDailyClicks} clicks/day.`, priority: 'high' };
            return { action: 'maintain', msg: `Learning phase: Volume good (${m.avgClicks.toFixed(0)} clicks/day). Maintain CPC until ${settings.learningThreshold} conversions.`, priority: 'medium' };
        }
        if (m.cpa > settings.maxCPA) return { action: 'pause', msg: `CPA $${m.cpa.toFixed(2)} exceeds max $${settings.maxCPA}. Consider pausing or major changes.`, priority: 'critical' };
        if (m.cpa > settings.targetCPA * 1.3 && !m.lowVolume) {
            const recCPC = (settings.targetCPA * m.cvr / 100).toFixed(2);
            return { action: 'decrease', msg: `CPA ${((m.cpa / settings.targetCPA - 1) * 100).toFixed(0)}% above target. Decrease CPC.`, rec: recCPC, cur: m.cpc.toFixed(2), priority: 'medium' };
        }
        if (m.cpa < settings.targetCPA * 0.8) return { action: 'scale', msg: `CPA below target! Room to scale. Consider increasing budget or CPC.`, priority: 'low' };
        return { action: 'maintain', msg: `On track. CPA $${m.cpa.toFixed(2)}, ${m.avgClicks.toFixed(0)} clicks/day.`, priority: 'low' };
    };

    const updateMeta = (name, updates) => {
        const updated = { ...campaignMeta, [name]: { ...campaignMeta[name], ...updates } };
        setCampaignMeta(updated);
        save('nw-meta', updated);
    };

    const updateSettings = (s) => {
        setSettings(s);
        save('nw-settings', s);
    };

    const campaignList = Object.keys(campaigns).map(n => getMetrics(campaigns[n], settings)).filter(Boolean);
    const totals = campaignList.reduce((a, c) => ({ spend: a.spend + c.spend, clicks: a.clicks + c.clicks, conversions: a.conversions + c.conversions }), { spend: 0, clicks: 0, conversions: 0 });
    const overallCPA = totals.conversions > 0 ? totals.spend / totals.conversions : 0;

    return (
        <div className="min-h-screen bg-gray-50">
            <div className="max-w-7xl mx-auto px-4 py-8">
                <div className="mb-6 flex items-center justify-between">
                    <div>
                        <h1 className="text-3xl font-bold text-gray-900">Spider Solitaire Modeling
                            <span className="ml-3 text-sm font-normal bg-blue-600 text-white px-3 py-1 rounded-full">v1 · Ad-First</span>
                        </h1>
                        <p className="text-gray-500 mt-1">UA · LTV · Ad Revenue Modeling</p>
                    </div>
                    <div className="text-right text-sm text-gray-500">
                        <div>{campaignList.length} campaigns</div>
                        <div className="text-xs text-green-600">{snapshots.length} snapshots</div>
                    </div>
                </div>

                <div className="bg-white rounded-xl shadow-sm">
                    <div className="border-b border-gray-200">
                        <nav className="flex px-6">
                            {['dashboard', 'campaigns', 'financial', 'adrevenue', 'retention', 'history', 'settings', 'upload'].map(t => (
                                <button key={t} onClick={() => setTab(t)}
                                    className={"py-4 px-4 border-b-2 font-medium text-sm capitalize mr-2 " + (tab === t ? 'border-blue-600 text-blue-600' : 'border-transparent text-gray-500 hover:text-gray-700')}>
                                    {t === 'adrevenue' ? '💰 Ad Revenue' : t === 'retention' ? '📉 Retention' : t}
                                </button>
                            ))}
                        </nav>
                    </div>

                    <div className="p-6">
                        {tab === 'dashboard' && <Dashboard campaigns={campaignList} campaigns_raw={campaigns} getMetrics={getMetrics} settings={settings} snapshots={snapshots} totals={totals} overallCPA={overallCPA} setTab={setTab} />}
                        {tab === 'campaigns' && <Campaigns campaigns={campaignList} campaignMeta={campaignMeta} campaigns_raw={campaigns} settings={settings} timeframes={timeframes} setTimeframes={setTimeframes} getMetrics={getMetrics} getRec={getRec} getBroadLearnings={getBroadLearnings} updateMeta={updateMeta} />}
                        {tab === 'financial' && <Financial campaigns={campaignList} installData={installData} settings={settings} />}
                        {tab === 'adrevenue' && <AdRevenue adRevenueData={adRevenueData} settings={settings} />}
                        {tab === 'retention' && <Retention />}
                        {tab === 'history' && <History campaigns={campaignList} snapshots={snapshots} changelog={changelog} />}
                        {tab === 'settings' && <Settings settings={settings} updateSettings={updateSettings} />}
                        {tab === 'upload' && <Upload handleUpload={handleUpload} uploading={uploading} handleInstallUpload={handleInstallUpload} uploadingInstalls={uploadingInstalls} handleAdRevUpload={handleAdRevUpload} uploadingAdRev={uploadingAdRev} />}
                    </div>
                </div>
            </div>
        </div>
    );
}

function Dashboard({ campaigns, campaigns_raw, getMetrics, settings, snapshots, totals, overallCPA, setTab }) {
    const trendRef = useRef(null);
    const trendInst = useRef(null);

    // ── 30-day windowed metrics ───────────────────────────────────────────────
    const m30 = campaigns.map(c => getMetrics(campaigns_raw[c.name], settings, 30)).filter(Boolean);
    const m7  = campaigns.map(c => getMetrics(campaigns_raw[c.name], settings, 7)).filter(Boolean);

    const sum = arr => arr.reduce((s, m) => ({
        spend: s.spend + m.spend,
        trials: s.trials + (m.trials||0),
        installs: s.installs + (m.installs||0),
        conversions: s.conversions + (m.conversions||0),
        clicks: s.clicks + (m.clicks||0),
    }), { spend:0, trials:0, installs:0, conversions:0, clicks:0 });

    const t30 = sum(m30);
    const t7  = sum(m7);

    const cpa30 = t30.conversions > 0 ? t30.spend / t30.conversions : 0;
    const cpa7  = t7.conversions  > 0 ? t7.spend  / t7.conversions  : 0;
    const cpaTrend = cpa30 > 0 && cpa7 > 0 ? ((cpa7 - cpa30) / cpa30 * 100) : null;

    // Estimated monthly paid subs from current 7d run rate
    const dailyTrials7 = t7.trials / 7;
    const projMonthlyPaid = dailyTrials7 * 30 * (settings.trialConvRate || 0.40);

    // Ad revenue metrics
    const arpdau = settings.arpdau || 0.157;
    const dauMauRatio = settings.dauMauRatio || 1.0;
    const arpmau = arpdau * dauMauRatio * 30;
    // CPI from 30d data
    const cpi30 = t30.installs > 0 ? t30.spend / t30.installs : 0;
    // Real DAU retention curve from cohort data (M0-M12 end-of-month DAU fraction)
    // Observed: D1=10.3%, D7=3.3%, D30=1.31%, D45=1.07%, D75=0.54% — tail extrap half-life 37d
    const dauRetCurve = [1.00000, 0.01340, 0.00762, 0.00434, 0.00247, 0.00140, 0.00080, 0.00045, 0.00026, 0.00015, 0.00008, 0.00005];
    // Integrate: each month contributes dauRet × ARPDAU × 30 days
    const adLTV12 = dauRetCurve.reduce((s, r) => s + r * arpdau * 30, 0);
    const subContrib12 = (settings.subEnabled!==false)
        ? ((t30.installs>0 ? t30.trials/t30.installs : 0.40) * (settings.trialConvRate||0.40) * (settings.arppu||2.70) * 2.4)
        : 0;
    const blendedLTV12 = adLTV12 + subContrib12;
    const liveOptIn30 = t30.installs > 0 ? t30.trials / t30.installs : 0;

    // Unit economics gap vs blended LTV
    const breakEvenCPA = blendedLTV12 > 0 ? blendedLTV12 : (settings.arppu||2.70) * 2.4;
    const unitEconGap = cpa7 > 0 && breakEvenCPA > 0 ? ((cpa7 - breakEvenCPA) / breakEvenCPA * 100) : null;

    // legacy arppu/apiCost for signal board
    const arppu = settings.arppu || 2.70;
    const apiCost = settings.apiCostPerSub || 1.00;

    // ── Daily trend data (last 30 days, all campaigns merged) ─────────────────
    const daily = {};
    campaigns.forEach(c => {
        if (!campaigns_raw[c.name]?.dailyData) return;
        Object.entries(campaigns_raw[c.name].dailyData).forEach(([date, day]) => {
            if (!daily[date]) daily[date] = { spend: 0, trials: 0, paid: 0 };
            daily[date].spend += day.spend || 0;
            daily[date].trials += day.trials || 0;
            daily[date].paid += day.modeledPaidSubs || 0;
        });
    });
    const cutoff30 = new Date(); cutoff30.setDate(cutoff30.getDate() - 30);
    const cutoff30Str = cutoff30.toISOString().slice(0,10);
    const trendDates = Object.keys(daily).filter(d => d >= cutoff30Str).sort();
    const trendCPAs = trendDates.map(d => daily[d].paid > 0 ? daily[d].spend / daily[d].paid : null);
    const trendTrials = trendDates.map(d => daily[d].trials);

    // 7-day rolling avg CPA
    const rollingCPA = trendCPAs.map((_, i) => {
        const window = trendCPAs.slice(Math.max(0, i-6), i+1).filter(v => v !== null);
        return window.length ? window.reduce((a,b)=>a+b,0)/window.length : null;
    });

    // ── Signal board: prioritized actions ─────────────────────────────────────
    const signals = [];

    // Best performer
    const byEff = [...m7].filter(m=>m.trials>0).sort((a,b)=>(b.trials/b.spend)-(a.trials/a.spend));
    if (byEff.length > 0) {
        const best = byEff[0];
        signals.push({
            priority: 'good',
            icon: '🏆',
            title: 'Best performer (7d)',
            body: `${best.name.length > 40 ? best.name.slice(0,38)+'…' : best.name} — ${best.trials} trials at $${best.cpa.toFixed(2)} CPA · ${(best.trials/best.spend*1000).toFixed(1)} trials/$1k`,
            action: 'campaigns'
        });
    }

    // Low volume campaigns
    const lowVol = m7.filter(m => m.lowVolume && m.avgClicks < settings.minDailyClicks);
    if (lowVol.length > 0) {
        signals.push({
            priority: 'warn',
            icon: '📊',
            title: `${lowVol.length} campaign${lowVol.length>1?'s':''} below volume threshold`,
            body: lowVol.map(m => m.name.split(' ').slice(0,4).join(' ')).join(', ') + ` — avg ${(lowVol.reduce((s,m)=>s+m.avgClicks,0)/lowVol.length).toFixed(0)} clicks/day vs ${settings.minDailyClicks} minimum`,
            action: 'campaigns'
        });
    }

    // Still in learning with low conversions
    const stillLearning = m7.filter(m => m.inLearning && m.conversions < settings.learningThreshold * 0.5);
    if (stillLearning.length > 0) {
        signals.push({
            priority: 'info',
            icon: '🔄',
            title: `${stillLearning.length} campaign${stillLearning.length>1?'s':''} early in learning`,
            body: `Less than 50% of ${settings.learningThreshold} conversion threshold — algorithm still exploring audience`,
            action: 'campaigns'
        });
    }

    // CPA trending worse
    if (cpaTrend !== null && cpaTrend > 15) {
        signals.push({
            priority: 'warn',
            icon: '📈',
            title: `CPA rising — 7d avg ${cpaTrend > 0 ? '+' : ''}${cpaTrend.toFixed(0)}% vs 30d avg`,
            body: `7-day CPA $${cpa7.toFixed(2)} vs 30-day avg $${cpa30.toFixed(2)} — check campaign mix or bid changes`,
            action: 'financial'
        });
    } else if (cpaTrend !== null && cpaTrend < -10) {
        signals.push({
            priority: 'good',
            icon: '📉',
            title: `CPA improving — ${Math.abs(cpaTrend).toFixed(0)}% below 30d avg`,
            body: `7-day CPA $${cpa7.toFixed(2)} — momentum is positive, consider scaling`,
            action: 'financial'
        });
    }

    // Unit economics signal (blended ad+sub LTV)
    if (unitEconGap !== null) {
        if (unitEconGap > 50) {
            signals.push({
                priority: 'critical',
                icon: '🚨',
                title: `CPA ${unitEconGap.toFixed(0)}% above break-even`,
                body: `CPA $${cpa7.toFixed(2)} vs blended 12M LTV/install $${blendedLTV12.toFixed(3)} (ad $${adLTV12.toFixed(3)} + sub). Break-even ≈ $${breakEvenCPA.toFixed(2)}`,
                action: 'financial'
            });
        } else if (unitEconGap > 0) {
            signals.push({
                priority: 'warn',
                icon: '⚠️',
                title: `${unitEconGap.toFixed(0)}% above break-even CPA`,
                body: `Close — blended 12M LTV $${blendedLTV12.toFixed(3)}/install, current CPA $${cpa7.toFixed(2)} vs break-even $${breakEvenCPA.toFixed(2)}`,
                action: 'financial'
            });
        } else {
            signals.push({
                priority: 'good',
                icon: '✅',
                title: `Unit economics working — CPI below blended LTV`,
                body: `CPA $${cpa7.toFixed(2)} < blended 12M LTV/install $${blendedLTV12.toFixed(3)} (ad ${(adLTV12/blendedLTV12*100).toFixed(0)}% + sub ${(subContrib12/blendedLTV12*100).toFixed(0)}%)`,
                action: 'financial'
            });
        }
    }

    // Chart
    useEffect(() => {
        if (!trendRef.current || trendDates.length === 0) return;
        if (trendInst.current) trendInst.current.destroy();
        trendInst.current = new Chart(trendRef.current, {
            data: {
                labels: trendDates.map(d => d.slice(5)), // MM-DD
                datasets: [
                    {
                        type: 'bar',
                        label: 'Daily Trials',
                        data: trendTrials,
                        backgroundColor: 'rgba(99,102,241,0.15)',
                        borderColor: 'rgba(99,102,241,0.3)',
                        borderWidth: 1,
                        yAxisID: 'y2',
                        order: 2,
                    },
                    {
                        type: 'line',
                        label: 'Daily CPA',
                        data: trendCPAs,
                        borderColor: 'rgba(148,163,184,0.5)',
                        borderWidth: 1,
                        pointRadius: 0,
                        tension: 0.3,
                        spanGaps: true,
                        yAxisID: 'y',
                        order: 3,
                    },
                    {
                        type: 'line',
                        label: '7d Rolling CPA',
                        data: rollingCPA,
                        borderColor: '#ef4444',
                        borderWidth: 2.5,
                        pointRadius: 0,
                        tension: 0.4,
                        spanGaps: true,
                        yAxisID: 'y',
                        order: 1,
                    },
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'top', labels: { font: { size: 11 }, boxWidth: 12 } },
                    tooltip: {
                        callbacks: {
                            label: ctx => {
                                if (ctx.dataset.yAxisID === 'y') return ` ${ctx.dataset.label}: $${(ctx.parsed.y||0).toFixed(2)}`;
                                return ` Trials: ${ctx.parsed.y}`;
                            }
                        }
                    }
                },
                scales: {
                    x: { grid: { color: 'rgba(0,0,0,0.04)' }, ticks: { maxTicksLimit: 10, font: { size: 10 } } },
                    y: { position: 'left', title: { display: true, text: 'CPA ($)', font: { size: 10 } }, beginAtZero: true, ticks: { callback: v => '$'+v.toFixed(0) } },
                    y2: { position: 'right', title: { display: true, text: 'Trials', font: { size: 10 } }, beginAtZero: true, grid: { drawOnChartArea: false } }
                }
            }
        });
        return () => { if (trendInst.current) trendInst.current.destroy(); };
    }, [campaigns.map(c=>c.name).join(',')]);

    const sigColors = {
        critical: { bar: 'bg-red-500',    bg: 'bg-red-50',    border: 'border-red-200',    text: 'text-red-900',    sub: 'text-red-700' },
        warn:     { bar: 'bg-amber-400',   bg: 'bg-amber-50',  border: 'border-amber-200',  text: 'text-amber-900',  sub: 'text-amber-700' },
        info:     { bar: 'bg-blue-400',    bg: 'bg-blue-50',   border: 'border-blue-200',   text: 'text-blue-900',   sub: 'text-blue-700' },
        good:     { bar: 'bg-emerald-500', bg: 'bg-emerald-50',border: 'border-emerald-200',text: 'text-emerald-900',sub: 'text-emerald-700' },
    };

    const today = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

    if (!campaigns.length) return (
        <div className="text-center py-20">
            <div className="text-5xl mb-4">🌊</div>
            <div className="text-xl font-semibold text-gray-700 mb-2">No data yet</div>
            <div className="text-gray-400 text-sm">Upload a campaign CSV to get started</div>
        </div>
    );

    return (
        <div className="space-y-6 max-w-5xl mx-auto">

            {/* ── Briefing header ── */}
            <div className="flex items-baseline justify-between">
                <div>
                    <h2 className="text-xl font-bold text-gray-900">Morning Briefing</h2>
                    <div className="text-sm text-gray-400 mt-0.5">{today} · Last 30 days</div>
                </div>
                <div className="text-xs text-gray-400">{campaigns.length} campaigns · {snapshots.length} snapshots</div>
            </div>

            {/* ── Stat row ── */}
            <div className="grid grid-cols-4 gap-4">
                {[
                    {
                        label: '30d Spend',
                        value: '$' + t30.spend.toFixed(0),
                        sub: t30.clicks.toLocaleString() + ' clicks · CPI ' + (cpi30>0?'$'+cpi30.toFixed(2):'—'),
                        note: null,
                        color: 'text-gray-900'
                    },
                    {
                        label: '30d Installs → Trials',
                        value: t30.installs.toLocaleString(),
                        sub: t30.trials.toLocaleString() + ' trials · ' + (t30.installs > 0 ? (t30.trials/t30.installs*100).toFixed(1) + '% opt-in' : '—'),
                        note: null,
                        color: 'text-gray-900'
                    },
                    {
                        label: '7d Avg CPA',
                        value: cpa7 > 0 ? '$' + cpa7.toFixed(2) : '—',
                        sub: cpa30 > 0 ? 'vs $' + cpa30.toFixed(2) + ' (30d)' : '—',
                        note: cpaTrend !== null ? { val: (cpaTrend>0?'+':'')+cpaTrend.toFixed(0)+'%', good: cpaTrend < 0 } : null,
                        color: 'text-gray-900'
                    },
                    {
                        label: 'Blended LTV/Install (12M)',
                        value: blendedLTV12 > 0 ? '$' + blendedLTV12.toFixed(3) : '—',
                        sub: 'Ad $' + adLTV12.toFixed(3) + ' + Sub $' + subContrib12.toFixed(3),
                        note: unitEconGap !== null ? { val: unitEconGap <= 0 ? '✓ LTV > CPI' : Math.round(unitEconGap)+'% CPA above b/e', good: unitEconGap <= 0 } : null,
                        color: 'text-amber-700'
                    },
                ].map(s => (
                    <div key={s.label} className="bg-white rounded-xl border border-gray-200 p-4">
                        <div className="text-xs text-gray-500 font-medium mb-1">{s.label}</div>
                        <div className={'text-2xl font-bold ' + s.color}>{s.value}</div>
                        <div className="flex items-center justify-between mt-1">
                            <div className="text-xs text-gray-400">{s.sub}</div>
                            {s.note && (
                                <div className={'text-xs font-semibold px-1.5 py-0.5 rounded ' + (s.note.good ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700')}>
                                    {s.note.val}
                                </div>
                            )}
                        </div>
                    </div>
                ))}
            </div>

            {/* ── Main content: chart + signals ── */}
            <div className="grid grid-cols-5 gap-5">

                {/* Trend chart — 3/5 width */}
                <div className="col-span-3 bg-white rounded-xl border border-gray-200 p-5">
                    <div className="flex items-center justify-between mb-4">
                        <div>
                            <div className="text-sm font-semibold text-gray-800">30-Day Trajectory</div>
                            <div className="text-xs text-gray-400 mt-0.5">Daily trials (bars) · CPA trend (red line)</div>
                        </div>
                        {cpaTrend !== null && (
                            <div className={'text-xs font-bold px-2.5 py-1 rounded-full ' + (cpaTrend < 0 ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700')}>
                                {cpaTrend > 0 ? '↑' : '↓'} {Math.abs(cpaTrend).toFixed(0)}% vs 30d avg
                            </div>
                        )}
                    </div>
                    {trendDates.length === 0
                        ? <div className="flex items-center justify-center h-48 text-gray-300 text-sm">No daily data in range</div>
                        : <div style={{height: 240}}><canvas ref={trendRef}></canvas></div>
                    }
                </div>

                {/* Signal board — 2/5 width */}
                <div className="col-span-2 bg-white rounded-xl border border-gray-200 overflow-hidden">
                    <div className="px-4 py-3 border-b border-gray-100 bg-gray-50">
                        <div className="text-sm font-semibold text-gray-800">Action Signals</div>
                        <div className="text-xs text-gray-400 mt-0.5">Prioritized · tap to navigate</div>
                    </div>
                    <div className="divide-y divide-gray-50">
                        {signals.length === 0 && (
                            <div className="px-4 py-6 text-center text-sm text-gray-400">No signals — upload data to see insights</div>
                        )}
                        {signals.map((sig, i) => {
                            const c = sigColors[sig.priority];
                            return (
                                <div key={i}
                                    onClick={() => sig.action && setTab(sig.action)}
                                    className={'flex gap-0 cursor-pointer hover:bg-gray-50 transition-colors ' + (sig.action ? 'cursor-pointer' : '')}>
                                    <div className={'w-1 shrink-0 ' + c.bar}></div>
                                    <div className="px-3 py-3 flex-1 min-w-0">
                                        <div className="flex items-start gap-2">
                                            <span className="text-sm shrink-0">{sig.icon}</span>
                                            <div className="min-w-0">
                                                <div className={'text-xs font-semibold leading-snug ' + c.text}>{sig.title}</div>
                                                <div className="text-xs text-gray-500 mt-0.5 leading-snug">{sig.body}</div>
                                                {sig.action && <div className="text-xs text-indigo-500 mt-1 font-medium">→ {sig.action}</div>}
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            </div>

            {/* ── Campaign quick-glance strip ── */}
            <div className="bg-white rounded-xl border border-gray-200 overflow-hidden">
                <div className="px-4 py-3 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
                    <div className="text-sm font-semibold text-gray-800">Campaign Quick-Glance</div>
                    <button onClick={() => setTab('campaigns')} className="text-xs text-indigo-500 hover:text-indigo-700 font-medium">Full view →</button>
                </div>
                <div className="divide-y divide-gray-50">
                    {m7.sort((a,b)=>(b.trials/Math.max(b.spend,1))-(a.trials/Math.max(a.spend,1))).map((m, i) => {
                        const tpd = m.spend > 0 ? m.trials / m.spend : 0;
                        const maxTpd7 = Math.max(...m7.map(x => x.spend>0?x.trials/x.spend:0), 0.001);
                        const rel = Math.round(tpd / maxTpd7 * 100);
                        const barCol = rel >= 66 ? '#10b981' : rel >= 33 ? '#f59e0b' : '#ef4444';
                        const tags = [
                            m.inLearning && { label: 'Learning', style: 'bg-blue-100 text-blue-700' },
                            m.lowVolume  && { label: 'Low Vol',  style: 'bg-orange-100 text-orange-700' },
                        ].filter(Boolean);
                        return (
                            <div key={m.name} className="px-4 py-2.5 flex items-center gap-4 hover:bg-gray-50 cursor-pointer" onClick={() => setTab('campaigns')}>
                                <div className="w-5 text-xs text-gray-400 font-mono shrink-0">#{i+1}</div>
                                <div className="flex-1 min-w-0">
                                    <div className="text-xs font-medium text-gray-800 truncate">{m.name}</div>
                                    <div className="flex items-center gap-1.5 mt-1">
                                        <div className="h-1 rounded-full flex-1 bg-gray-100" style={{maxWidth: 120}}>
                                            <div className="h-1 rounded-full" style={{width: rel+'%', backgroundColor: barCol}}></div>
                                        </div>
                                        <span className="text-xs text-gray-400">{rel}/100 eff.</span>
                                    </div>
                                </div>
                                <div className="flex items-center gap-4 shrink-0 text-xs">
                                    {tags.map(t => <span key={t.label} className={'px-1.5 py-0.5 rounded font-medium ' + t.style}>{t.label}</span>)}
                                    <div className="text-right">
                                        <div className="font-semibold text-gray-800">{m.trials} trials</div>
                                        <div className="text-gray-400">${m.spend.toFixed(0)} spend</div>
                                    </div>
                                    <div className={'font-bold text-sm w-16 text-right ' + (m.cpa > 0 && m.cpa < cpa7 ? 'text-emerald-600' : 'text-red-500')}>
                                        {m.cpa > 0 ? '$'+m.cpa.toFixed(2) : 'N/A'}
                                    </div>
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>

        </div>
    );
}


    const calculateHealthScore = (m, settings) => {
        let breakdown = {};
        
        // CPA Score (0-25): Distance from target
        const cpaRatio = m.cpa / (settings.targetCPA || 2.50);
        breakdown.cpa = cpaRatio <= 1 ? 25 : Math.max(0, 25 - (cpaRatio - 1) * 25);
        
        // Volume Score (0-25): Click volume vs minimum
        const volRatio = m.avgClicks / (settings.minDailyClicks || 20);
        breakdown.volume = Math.min(25, volRatio * 25);
        
        // Stability Score (0-25): Based on learning phase and data quality
        breakdown.stability = m.inLearning ? 10 : m.lowVolume ? 15 : 25;
        
        // ROI Score (0-25): Based on CPA vs target (rough proxy for ROAS)
        const roiRatio = (settings.targetCPA || 2.50) / Math.max(m.cpa, 0.01);
        breakdown.roi = Math.min(25, roiRatio * 25);
        
        const score = Math.round(Object.values(breakdown).reduce((a,b) => a+b, 0));
        const color = score >= 70 ? 'green' : score >= 40 ? 'yellow' : 'red';
        const emoji = score >= 70 ? '🟢' : score >= 40 ? '🟡' : '🔴';
        
        return { score, breakdown, color, emoji };
    };


function Campaigns({ campaigns, campaignMeta, campaigns_raw, settings, timeframes, setTimeframes, getMetrics, getRec, getBroadLearnings, updateMeta }) {
    const [selectedName, setSelectedName] = useState(null);
    const [whatIfCPI, setWhatIfCPI] = useState(null);
    const [whatIfOptIn, setWhatIfOptIn] = useState(null);
    const [whatIfTrialConv, setWhatIfTrialConv] = useState(null);
    const [showCampaignSettings, setShowCampaignSettings] = useState(false);
    const sparkRefs = useRef({});
    const sparkInsts = useRef({});
    const tfOptions = [{ v: 3, l: '3d' }, { v: 7, l: '7d' }, { v: 14, l: '14d' }, { v: 30, l: '30d' }, { v: 'all', l: 'All' }];

    if (!campaigns.length) return (
        <div className="text-center py-16 text-gray-400">
            <div className="text-4xl mb-3">📭</div>
            <div className="font-medium text-gray-600">No campaigns yet</div>
            <div className="text-sm mt-1">Upload a CSV to get started</div>
        </div>
    );

    // ── Relative ranking: score each campaign vs the group ─────────────────
    // Metric: trials per $ spent (efficiency) — relative, not vs broken absolute target
    const allMetrics = campaigns.map(c => {
        const tf = timeframes[c.name] || 7;
        return getMetrics(campaigns_raw[c.name], settings, tf);
    }).filter(Boolean);

    const trialsPerDollar = allMetrics.map(m => m.spend > 0 ? m.trials / m.spend : 0);
    const maxTpd = Math.max(...trialsPerDollar, 0.001);
    const minTpd = Math.min(...trialsPerDollar);

    // Relative rank 0–100 vs peers
    function relativeScore(m) {
        const tpd = m.spend > 0 ? m.trials / m.spend : 0;
        if (maxTpd === minTpd) return 50;
        return Math.round(((tpd - minTpd) / (maxTpd - minTpd)) * 100);
    }

    // Sorted by efficiency descending
    const ranked = [...allMetrics].sort((a, b) => {
        const ta = a.spend > 0 ? a.trials / a.spend : 0;
        const tb = b.spend > 0 ? b.trials / b.spend : 0;
        return tb - ta;
    });

    // Set default selected to top-ranked campaign
    const effectiveSelected = selectedName || ranked[0]?.name;
    const selTf = effectiveSelected ? (timeframes[effectiveSelected] || 7) : 7;
    const selRaw = effectiveSelected ? campaigns_raw[effectiveSelected] : null;
    const m = selRaw ? getMetrics(selRaw, settings, selTf) : null;
    const meta = effectiveSelected ? (campaignMeta[effectiveSelected] || {}) : {};
    const broad = meta.type === 'fixed' ? getBroadLearnings(effectiveSelected) : null;
    const rec = m ? getRec(m, broad) : null;

    // ── Lever diagnosis: what's actually dragging CPA ─────────────────────
    function diagnoseLevers(m) {
        if (!m || m.trials === 0) return null;
        const levers = [];

        // CPI drag: how much is install cost contributing?
        const benchmarkCPI = Math.min(...allMetrics.filter(x => x.cpi > 0).map(x => x.cpi));
        if (m.cpi > benchmarkCPI * 1.5 && m.cpi > 0) {
            const cpiSavingPct = ((m.cpi - benchmarkCPI) / m.cpi * 100).toFixed(0);
            levers.push({ label: 'High CPI', detail: `$${m.cpi.toFixed(2)} vs best $${benchmarkCPI.toFixed(2)} in portfolio — ${cpiSavingPct}% above peer best`, severity: 'high', icon: '💸' });
        }

        // Opt-in drag
        const benchmarkOptIn = Math.max(...allMetrics.filter(x => x.optInRate > 0).map(x => x.optInRate));
        if (m.optInRate > 0 && m.optInRate < benchmarkOptIn * 0.7) {
            levers.push({ label: 'Low Opt-In Rate', detail: `${(m.optInRate*100).toFixed(1)}% vs best ${(benchmarkOptIn*100).toFixed(1)}% — creative/landing page mismatch`, severity: 'high', icon: '📉' });
        }

        // Volume / learning
        if (m.inLearning) {
            levers.push({ label: 'Still Learning', detail: `${Math.round(m.conversions)} / ${settings.learningThreshold} conversions — algorithm hasn't found optimal audience yet`, severity: 'medium', icon: '🔄' });
        }
        if (m.lowVolume) {
            levers.push({ label: 'Low Click Volume', detail: `${m.avgClicks.toFixed(0)} clicks/day vs ${settings.minDailyClicks} minimum — CPC likely too low to win auctions`, severity: 'medium', icon: '📊' });
        }

        if (levers.length === 0) {
            levers.push({ label: 'No critical issues', detail: 'Performance in line with portfolio peers', severity: 'ok', icon: '✅' });
        }
        return levers;
    }

    // ── What-If logic using Financial Settings (not hardcoded) ────────────
    // ── Full Financial model (mirrors Financial tab exactly) ─────────────────
    const SUB_RETENTION = [1.000,0.676,0.587,0.531,0.494,0.474,0.460,0.449,0.444,0.438,0.431,0.404,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400,0.400];
    const PROJ_MONTHS = 24;

    function computeWhatIf(m, cpi, optIn, trialConv) {
        const arppu = settings.arppu || 2.70;
        const apiCostPerSub = settings.apiCostPerSub || 1.00;
        const monthlySpend = m.spend / m.daysCount * 30;

        // Acquisition funnel
        const installs = monthlySpend / Math.max(cpi, 0.01);
        const trials = installs * (optIn / 100);
        const newSubsPerMonth = trials * (trialConv / 100);
        const cpa = newSubsPerMonth > 0 ? monthlySpend / newSubsPerMonth : 0;

        // Full 24-month rolling projection (same as Financial buildProjection)
        const cohorts = [];
        const proj = [];
        for (let mo = 0; mo < PROJ_MONTHS; mo++) {
            cohorts.push({ newSubs: newSubsPerMonth });
            let activeSubs = 0, mrr = 0;
            cohorts.forEach((cohort, ci) => {
                const offset = mo - ci;
                const ret = SUB_RETENTION[offset] !== undefined ? SUB_RETENTION[offset] : SUB_RETENTION[SUB_RETENTION.length - 1];
                const subs = cohort.newSubs * ret;
                activeSubs += subs;
                mrr += subs * arppu;
            });
            const apiCost = activeSubs * apiCostPerSub;
            const netCF = mrr - monthlySpend - apiCost;
            proj.push({ month: mo + 1, activeSubs, mrr, adSpend: monthlySpend, apiCost, netCF, cumCF: 0 });
        }
        let cum = 0;
        proj.forEach(p => { cum += p.netCF; p.cumCF = cum; });

        // Cohort ROAS by month (same as Financial cohortROAS)
        const roasByMonth = Array.from({ length: PROJ_MONTHS }, (_, i) => {
            let rev = 0, api = 0;
            for (let j = 0; j <= i; j++) {
                const ret = SUB_RETENTION[j] !== undefined ? SUB_RETENTION[j] : SUB_RETENTION[SUB_RETENTION.length - 1];
                const subs = newSubsPerMonth * ret;
                rev += subs * arppu;
                api += subs * apiCostPerSub;
            }
            return { month: i + 1, roas: rev / (monthlySpend + api) };
        });

        // Key inflection points
        const paybackMonth = roasByMonth.find(r => r.roas >= 1);
        const breakEvenMonth = proj.find(p => p.cumCF >= 0);
        const peakDeficit = Math.min(...proj.map(p => p.cumCF));
        const roas12 = roasByMonth[11]?.roas || 0;
        const roas24 = roasByMonth[23]?.roas || 0;
        const m24mrr = proj[23]?.mrr || 0;

        return {
            monthlySpend, installs, trials, newSubsPerMonth, cpa,
            proj, roasByMonth,
            paybackMonth: paybackMonth?.month || null,
            breakEvenMonth: breakEvenMonth?.month || null,
            peakDeficit,
            roas12, roas24,
            m24mrr,
            m12activeSubs: proj[11]?.activeSubs || 0,
        };
    }

    // Sync what-if sliders when campaign selection changes
    const prevSel = useRef(null);
    if (m && effectiveSelected !== prevSel.current) {
        prevSel.current = effectiveSelected;
        setWhatIfCPI(m.cpi || 1.0);
        setWhatIfOptIn((m.optInRate || 0.37) * 100);
        setWhatIfTrialConv((settings.trialConvRate || 0.40) * 100);
    }

    const wifCPI = whatIfCPI ?? (m?.cpi || 1.0);
    const wifOptIn = whatIfOptIn ?? ((m?.optInRate || 0.37) * 100);
    const wifTrialConv = whatIfTrialConv ?? ((settings.trialConvRate || 0.40) * 100);

    const currentCalc = m ? computeWhatIf(m, m.cpi || 1.0, (m.optInRate||0.37)*100, (settings.trialConvRate||0.40)*100) : null;
    const wifCalc = m ? computeWhatIf(m, wifCPI, wifOptIn, wifTrialConv) : null;

    // ── Sparklines ────────────────────────────────────────────────────────
    useEffect(() => {
        ranked.forEach(camp => {
            const canv = sparkRefs.current[camp.name];
            if (!canv) return;
            if (sparkInsts.current[camp.name]) { sparkInsts.current[camp.name].destroy(); }
            const raw = campaigns_raw[camp.name];
            if (!raw?.dailyData) return;
            const dates = Object.keys(raw.dailyData).sort().slice(-14);
            const cpas = dates.map(d => {
                const day = raw.dailyData[d];
                const paid = (day.trials || 0) * (settings.trialConvRate || 0.4);
                return paid > 0 ? day.spend / paid : null;
            });
            const color = camp.name === effectiveSelected ? '#6366f1' : '#94a3b8';
            sparkInsts.current[camp.name] = new Chart(canv, {
                type: 'line',
                data: { labels: dates, datasets: [{ data: cpas, borderColor: color, borderWidth: 1.5, pointRadius: 0, tension: 0.4, spanGaps: true }] },
                options: { responsive: false, animation: false, plugins: { legend: { display: false }, tooltip: { enabled: false } }, scales: { x: { display: false }, y: { display: false } } }
            });
        });
        return () => { Object.values(sparkInsts.current).forEach(c => { try { c.destroy(); } catch(e){} }); sparkInsts.current = {}; };
    }, [ranked.map(r=>r.name).join(','), effectiveSelected, selTf]);

    const levers = m ? diagnoseLevers(m) : null;
    const score = relativeScore(m || ranked[0]);

    const recColors = { critical: 'border-red-300 bg-red-50 text-red-900', high: 'border-orange-200 bg-orange-50 text-orange-900', medium: 'border-blue-200 bg-blue-50 text-blue-900', low: 'border-green-200 bg-green-50 text-green-900' };
    const recIcons = { increase: '⬆️', scale: '🚀', decrease: '⬇️', pause: '🛑', monitor: '👁', maintain: '✅' };

    return (
        <div className="flex gap-0 min-h-96" style={{height: 'calc(100vh - 200px)', minHeight: 600}}>

            {/* ── LEFT ROSTER PANE ───────────────────────────────────────── */}
            <div className="w-72 shrink-0 border-r border-gray-200 overflow-y-auto">
                <div className="px-4 py-3 border-b border-gray-100 bg-gray-50">
                    <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Ranked by Efficiency</div>
                    <div className="text-xs text-gray-400 mt-0.5">trials per $ spent · relative to peers</div>
                </div>
                {ranked.map((camp, idx) => {
                    const isActive = camp.name === effectiveSelected;
                    const tpd = camp.spend > 0 ? camp.trials / camp.spend : 0;
                    const rel = relativeScore(camp);
                    const barColor = rel >= 66 ? '#10b981' : rel >= 33 ? '#f59e0b' : '#ef4444';
                    const campMeta = campaignMeta[camp.name] || {};
                    return (
                        <div key={camp.name}
                            onClick={() => { setSelectedName(camp.name); setShowCampaignSettings(false); }}
                            className={'px-4 py-3 cursor-pointer border-b border-gray-100 transition-colors ' + (isActive ? 'bg-indigo-50 border-l-2 border-l-indigo-500' : 'hover:bg-gray-50 border-l-2 border-l-transparent')}>
                            <div className="flex items-start justify-between gap-2 mb-1.5">
                                <div className="text-xs font-medium text-gray-800 truncate flex-1 leading-snug">{camp.name}</div>
                                <div className="text-xs font-bold shrink-0" style={{color: barColor}}>{rel}/100</div>
                            </div>
                            {/* Relative efficiency bar */}
                            <div className="h-1 bg-gray-100 rounded-full mb-2">
                                <div className="h-1 rounded-full transition-all" style={{width: rel + '%', backgroundColor: barColor}}></div>
                            </div>
                            <div className="flex items-center justify-between">
                                <div className="flex gap-3 text-xs text-gray-500">
                                    <span>{camp.trials}T · ${camp.spend.toFixed(0)}</span>
                                    {camp.cpa > 0 && <span className="font-medium text-gray-700">${camp.cpa.toFixed(2)} CPA</span>}
                                </div>
                                <canvas ref={el => sparkRefs.current[camp.name] = el} width={60} height={22}></canvas>
                            </div>
                            <div className="flex gap-1 mt-1.5 flex-wrap">
                                {campMeta.type === 'broad' && <span className="text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded font-medium">Broad</span>}
                                {campMeta.type === 'fixed' && <span className="text-xs bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded font-medium">Fixed</span>}
                                {camp.inLearning && <span className="text-xs bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded font-medium">Learning</span>}
                                {camp.lowVolume && <span className="text-xs bg-orange-100 text-orange-700 px-1.5 py-0.5 rounded font-medium">Low Vol</span>}
                            </div>
                        </div>
                    );
                })}
            </div>

            {/* ── RIGHT DETAIL PANE ──────────────────────────────────────── */}
            <div className="flex-1 overflow-y-auto">
                {!m ? (
                    <div className="flex items-center justify-center h-full text-gray-400">Select a campaign</div>
                ) : (
                    <div className="p-5 space-y-4">

                        {/* Header */}
                        <div className="flex items-start justify-between gap-3">
                            <div className="flex-1 min-w-0">
                                <h3 className="font-semibold text-gray-900 text-base truncate">{effectiveSelected}</h3>
                                <div className="text-xs text-gray-400 mt-0.5">{m.startDate} → {m.endDate} · {m.daysCount} days</div>
                            </div>
                            <div className="flex items-center gap-2 shrink-0">
                                {/* Timeframe */}
                                <div className="flex items-center gap-1 bg-gray-100 rounded-full p-0.5">
                                    {tfOptions.map(o => (
                                        <button key={o.v}
                                            onClick={() => setTimeframes({...timeframes, [effectiveSelected]: o.v})}
                                            className={'px-2.5 py-1 rounded-full text-xs font-medium transition-colors ' + (selTf === o.v ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-500 hover:text-gray-700')}>
                                            {o.l}
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setShowCampaignSettings(v => !v)}
                                    className={'text-xs px-3 py-1.5 rounded-full border font-medium transition-colors ' + (showCampaignSettings ? 'bg-gray-900 text-white border-gray-900' : 'border-gray-200 text-gray-500 hover:border-gray-400')}>
                                    ⚙ Settings
                                </button>
                            </div>
                        </div>

                        {/* Campaign Settings Panel */}
                        {showCampaignSettings && (
                            <div className="bg-gray-50 border border-gray-200 rounded-xl p-4 flex flex-wrap gap-4 text-sm">
                                <div>
                                    <label className="text-xs text-gray-600 block mb-1 font-medium">Campaign Type</label>
                                    <select value={meta.type || 'standard'} onChange={e => updateMeta(effectiveSelected, { type: e.target.value })}
                                        className="border border-gray-300 rounded-lg px-3 py-1.5 text-sm focus:outline-none">
                                        <option value="standard">Standard</option>
                                        <option value="broad">Broad Test</option>
                                        <option value="fixed">Fixed CPC</option>
                                    </select>
                                </div>
                                {meta.type === 'fixed' && (
                                    <div className="flex-1 min-w-48">
                                        <label className="text-xs text-gray-600 block mb-1 font-medium">Learn From (Broad Campaign)</label>
                                        <select value={meta.learningSource || ''} onChange={e => updateMeta(effectiveSelected, { learningSource: e.target.value })}
                                            className="border border-gray-300 rounded-lg px-3 py-1.5 text-sm w-full focus:outline-none">
                                            <option value="">None</option>
                                            {campaigns.filter(c => campaignMeta[c.name]?.type === 'broad').map(c => (
                                                <option key={c.name} value={c.name}>{c.name}</option>
                                            ))}
                                        </select>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Key metrics strip */}
                        <div className="grid grid-cols-6 gap-2">
                            {[
                                { label: 'Spend', value: '$' + m.spend.toFixed(0), sub: null },
                                { label: 'Installs', value: (m.installs||0).toLocaleString(), sub: null },
                                { label: 'Trials', value: (m.trials||0), sub: null },
                                { label: 'Modeled Paid', value: Math.round(m.modeledPaidSubs||0), sub: 'trials×' + ((settings.trialConvRate||0.4)*100).toFixed(0)+'%' },
                                { label: 'CPA', value: m.cpa > 0 ? '$'+m.cpa.toFixed(2) : 'N/A', sub: null, highlight: m.cpa > 0 ? (m.cpa < (allMetrics.reduce((s,x)=>s+x.cpa,0)/allMetrics.filter(x=>x.cpa>0).length) ? 'text-emerald-600' : 'text-red-600') : '' },
                                { label: 'Opt-In', value: m.optInRate > 0 ? (m.optInRate*100).toFixed(1)+'%' : 'N/A', sub: null },
                            ].map(s => (
                                <div key={s.label} className="bg-gray-50 rounded-lg p-3">
                                    <div className="text-xs text-gray-500 mb-1">{s.label}</div>
                                    <div className={'text-sm font-bold ' + (s.highlight || 'text-gray-900')}>{s.value}</div>
                                    {s.sub && <div className="text-xs text-gray-400 mt-0.5">{s.sub}</div>}
                                </div>
                            ))}
                        </div>

                        {/* Relative rank badge */}
                        <div className="flex items-center gap-3 px-4 py-2.5 bg-gray-50 rounded-xl border border-gray-100">
                            <div className="text-xs text-gray-500">Portfolio rank:</div>
                            <div className="flex items-center gap-2">
                                <div className="text-sm font-bold text-gray-900">#{ranked.findIndex(r=>r.name===effectiveSelected)+1} of {ranked.length}</div>
                                <div className="h-2 w-32 bg-gray-200 rounded-full overflow-hidden">
                                    <div className="h-2 rounded-full" style={{width: relativeScore(m)+'%', backgroundColor: relativeScore(m)>=66?'#10b981':relativeScore(m)>=33?'#f59e0b':'#ef4444'}}></div>
                                </div>
                                <div className="text-xs text-gray-500">{relativeScore(m)}/100 efficiency vs peers</div>
                            </div>
                            <div className="ml-auto text-xs text-gray-400">{(m.trials/Math.max(m.spend,1)*1000).toFixed(1)} trials/$1k spend</div>
                        </div>

                        {/* Lever diagnosis */}
                        {levers && (
                            <div className="space-y-2">
                                <div className="text-xs font-semibold text-gray-500 uppercase tracking-wide">Lever Diagnosis</div>
                                {levers.map((lv, i) => (
                                    <div key={i} className={'flex items-start gap-3 px-4 py-3 rounded-xl border ' +
                                        (lv.severity==='high' ? 'bg-red-50 border-red-200' : lv.severity==='medium' ? 'bg-amber-50 border-amber-200' : 'bg-emerald-50 border-emerald-200')}>
                                        <span className="text-base shrink-0 mt-0.5">{lv.icon}</span>
                                        <div>
                                            <div className={'text-sm font-semibold ' + (lv.severity==='high' ? 'text-red-800' : lv.severity==='medium' ? 'text-amber-800' : 'text-emerald-800')}>{lv.label}</div>
                                            <div className="text-xs text-gray-600 mt-0.5">{lv.detail}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        )}

                        {/* Broad learnings */}
                        {broad && (
                            <div className={'px-4 py-3 rounded-xl border ' + (broad.stable ? 'bg-emerald-50 border-emerald-200' : 'bg-amber-50 border-amber-200')}>
                                <div className="flex items-center justify-between mb-2">
                                    <div className="text-sm font-semibold text-gray-800">🎓 Learning from: <span className="text-gray-600">{broad.broadName}</span></div>
                                    <span className={'text-xs px-2 py-0.5 rounded-full font-medium ' + (broad.stable ? 'bg-emerald-600 text-white' : 'bg-amber-500 text-white')}>
                                        {broad.stable ? '✅ Stable' : '⏳ ' + broad.stableDays + '/' + broad.requiredDays + 'd'}
                                    </span>
                                </div>
                                <div className="grid grid-cols-4 gap-3 text-xs">
                                    {[
                                        { label: 'Broad CPC', val: '$'+broad.avgCPC.toFixed(2), color: '' },
                                        { label: 'Broad CPA', val: '$'+broad.metrics.cpa.toFixed(2), color: '' },
                                        { label: 'Your CPC', val: '$'+m.cpc.toFixed(2)+' ('+ ((m.cpc/broad.avgCPC-1)*100).toFixed(0)+'%)', color: m.cpc < broad.avgCPC ? 'text-orange-600' : 'text-emerald-600' },
                                        { label: 'Your CPA', val: '$'+m.cpa.toFixed(2)+' ('+((m.cpa/broad.metrics.cpa-1)*100).toFixed(0)+'%)', color: m.cpa > broad.metrics.cpa ? 'text-orange-600' : 'text-emerald-600' },
                                    ].map(s => <div key={s.label}><div className="text-gray-500 mb-0.5">{s.label}</div><div className={'font-semibold '+s.color}>{s.val}</div></div>)}
                                </div>

                        {/* Recommendation */}
                        {rec && (
                            <div className={'px-4 py-3 rounded-xl border ' + (recColors[rec.priority] || recColors.low)}>
