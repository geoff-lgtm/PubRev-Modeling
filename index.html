<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Solitaire Modeling</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const e = React.createElement;
const { useState, useEffect, useRef } = React;

// ── storage ───────────────────────────────────────────────────────────────────
const store = {
    get: k => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(_){return null;} },
    set: (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(_){} }
};

// ── helpers ───────────────────────────────────────────────────────────────────
const fmtK = v => v >= 1e6 ? (v/1e6).toFixed(1)+'M' : v >= 1e3 ? (v/1e3).toFixed(1)+'k' : Math.round(v).toString();
const fmtD = v => '$' + (v||0).toFixed(2);
const fmtM = v => v >= 1e6 ? '$'+(v/1e6).toFixed(2)+'M' : v >= 1e3 ? '$'+(v/1e3).toFixed(1)+'k' : '$'+Math.round(v||0);
const cls = (...a) => a.filter(Boolean).join(' ');

// ── normalise date ────────────────────────────────────────────────────────────
function normaliseDate(raw) {
    if (!raw) return null;
    const s = raw.toString().trim().replace(/^"+|"+$/g,'');
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const MONTHS = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    // "Sun, Jan 25, 2026" or "Jan 25, 2026"
    const longUS = s.replace(/^[A-Za-z]+,\s*/,'').match(/^([A-Za-z]+)\s+(\d+),?\s+(\d{4})/);
    if (longUS) { const m=MONTHS[longUS[1].slice(0,3).toLowerCase()]; if(m) return `${longUS[3]}-${String(m).padStart(2,'0')}-${String(longUS[2]).padStart(2,'0')}`; }
    // slash
    const sl = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if (sl) return `${sl[3]}-${sl[1].padStart(2,'0')}-${sl[2].padStart(2,'0')}`;
    return null;
}

// ── dummy data ────────────────────────────────────────────────────────────────
const DUMMY_CAMPAIGNS = (() => {
    const makeDaily = (key, baseSpend, baseCPI, baseOptIn, platform, startDate, numDays) => {
        const data = {};
        const start = new Date(startDate);
        for (let i=0; i<numDays; i++) {
            const d = new Date(start); d.setDate(d.getDate()+i);
            const date = d.toISOString().split('T')[0];
            const v = 0.8 + Math.sin(i*0.7+key.length)*0.2;
            const spend = Math.round(baseSpend * v * 100)/100;
            const installs = Math.round(spend / baseCPI);
            const trials = Math.round(installs * baseOptIn);
            const clicks = Math.round(installs * (2.5 + Math.random()));
            const impressions = Math.round(clicks * (12 + Math.random()*8));
            data[date] = { spend, clicks, impressions, installs, trials, modeledPaidSubs: 0 };
        }
        return { platform, dailyData: data, spend: Object.values(data).reduce((s,r)=>s+r.spend,0), installs: Object.values(data).reduce((s,r)=>s+r.installs,0), trials: Object.values(data).reduce((s,r)=>s+r.trials,0) };
    };
    return {
        'Meta - Puzzle Lovers (US)': makeDaily('meta-puzzle', 210, 0.63, 0.43, 'Meta', '2026-01-01', 40),
        'Meta - Brain Games 35-54 (US)': makeDaily('meta-brain', 145, 0.71, 0.39, 'Meta', '2026-01-01', 37),
        'Google UAC - Broad (US)': makeDaily('google-broad', 185, 0.58, 0.47, 'Google', '2026-01-01', 40),
        'Google UAC - Card Games (US)': makeDaily('google-card', 95, 0.67, 0.41, 'Google', '2026-01-05', 35),
        'App Store Search - US': makeDaily('asa-us', 230, 0.54, 0.55, 'ASA', '2026-01-01', 40),
        'App Store Search - CA/AU': makeDaily('asa-ca', 80, 0.61, 0.48, 'ASA', '2026-01-08', 33),
        'TikTok - Casual Gamers 18-34': makeDaily('tiktok', 120, 0.82, 0.36, 'TikTok', '2026-01-10', 30),
    };
})();

const DUMMY_INSTALL_DATA = {};

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
    const [tab, setTab] = useState('dashboard');
    const [campaigns, setCampaigns] = useState(DUMMY_CAMPAIGNS);
    const [installData, setInstallData] = useState(DUMMY_INSTALL_DATA);
    const [adRevenueData, setAdRevenueData] = useState({});
    const [campaignMeta, setCampaignMeta] = useState({});
    const [snapshots, setSnapshots] = useState([]);
    const [changelog, setChangelog] = useState([{date:new Date().toISOString().split('T')[0],time:'',type:'seed',description:'Demo data loaded'}]);
    const [settings, setSettings] = useState({
        targetCPA:2.50, maxCPA:8.00, minDailyClicks:50, learningThreshold:50, stabilityDays:3, stabilityTolerance:0.05,
        arpdau:0.157, dauMauRatio:1.0, adsPerDau:121, ecpm:1.32, adFillRate:0.953,
        arppu:2.70, trialConvRate:0.40, subEnabled:true,
    });
    const [uploading, setUploading] = useState(false);
    const [uploadingInstalls, setUploadingInstalls] = useState(false);
    const [uploadingAdRev, setUploadingAdRev] = useState(false);
    const [timeframes, setTimeframes] = useState({});
    const [hasRealData, setHasRealData] = useState(!!store.get('nw-has-real-data'));

    useEffect(() => {
        const c = store.get('nw-campaigns'); if (c) setCampaigns(c);  // real data only, no dummy merge
        const inst = store.get('nw-installs'); if (inst) setInstallData(inst);
        const adrev = store.get('nw-adrev'); if (adrev) setAdRevenueData(adrev);
        const m = store.get('nw-meta'); if (m) setCampaignMeta(m);
        const s = store.get('nw-snapshots'); if (s) setSnapshots(s);
        const l = store.get('nw-changelog'); if (l) setChangelog(l);
        const st = store.get('nw-settings'); if (st) setSettings(st);
    }, []);

    const save = (k,v) => store.set(k,v);

    // ── metrics ───────────────────────────────────────────────────────────────
    function getMetrics(campaign, s, days=null) {
        if (!campaign) return null;
        const daily = campaign.dailyData || {};
        let dates = Object.keys(daily).sort();
        if (days) { const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-days); dates = dates.filter(d => new Date(d) >= cutoff); }
        if (!dates.length) return null;
        let spend=0,clicks=0,impressions=0,installs=0,trials=0;
        dates.forEach(d => { const r=daily[d]; spend+=r.spend||0; clicks+=r.clicks||0; impressions+=r.impressions||0; installs+=r.installs||0; trials+=r.trials||0; });
        const cpa = trials>0 ? spend/trials : 0;
        const cpi = installs>0 ? spend/installs : 0;
        const cpc = clicks>0 ? spend/clicks : 0;
        const ctr = impressions>0 ? clicks/impressions*100 : 0;
        const cvr = clicks>0 ? trials/clicks*100 : 0;
        const optInRate = installs>0 ? trials/installs : 0;
        const avgClicks = dates.length>0 ? clicks/dates.length : 0;
        const inLearning = clicks < (s.learningThreshold||50);
        const lowVolume = avgClicks < (s.minDailyClicks||50);
        const stableDays = s.stabilityDays||3;
        const tol = s.stabilityTolerance||0.05;
        let stable=false;
        if (dates.length >= stableDays) {
            const recent = dates.slice(-stableDays).map(d=>daily[d]);
            const avgCPA = recent.reduce((a,r)=>a+(r.spend/(r.trials||1)),0)/stableDays;
            stable = recent.every(r => Math.abs((r.spend/(r.trials||1))-avgCPA)/avgCPA < tol);
        }
        return { name: campaign.name||'', platform: campaign.platform||'', spend, clicks, impressions, installs, trials, cpa, cpi, cpc, ctr, cvr, optInRate, avgClicks, inLearning, lowVolume, stable, days: dates.length };
    }

    function getRec(m) {
        if (!m) return {action:'pause',msg:'No data'};
        if (m.inLearning) {
            if (m.lowVolume) return {action:'increase',msg:`Learning phase: Need more volume. Increase bid.`};
            return {action:'maintain',msg:`Learning phase: Volume good (${m.avgClicks.toFixed(0)} clicks/day). Wait.`};
        }
        if (m.cpa > settings.maxCPA) return {action:'pause',msg:`CPA ${m.cpa.toFixed(2)} exceeds max ${settings.maxCPA}. Pause.`};
        if (m.cpa > settings.targetCPA*1.3 && !m.lowVolume) {
            const recCPC = (settings.targetCPA*m.cvr/100).toFixed(2);
            return {action:'decrease',msg:`CPA ${(((m.cpa/settings.targetCPA)-1)*100).toFixed(0)}% above target. Reduce bid to ~$${recCPC}.`};
        }
        if (m.cpa < settings.targetCPA*0.8) return {action:'scale',msg:`CPA below target! Room to scale. Increase budget.`};
        return {action:'maintain',msg:`On track. CPA ${m.cpa.toFixed(2)}, ${m.avgClicks.toFixed(0)} clicks/day.`};
    }

    function getBroadLearnings(name) {
        const c = campaigns[name]; if (!c) return null;
        const daily = c.dailyData||{}; const dates = Object.keys(daily).sort();
        if (dates.length < 14) return null;
        const first7 = dates.slice(0,7), last7 = dates.slice(-7);
        const avg = arr => arr.reduce((s,d)=>{const r=daily[d]; return {spend:s.spend+(r.spend||0),trials:s.trials+(r.trials||1)};},{spend:0,trials:0});
        const f=avg(first7), l=avg(last7);
        const fCPA=f.spend/f.trials, lCPA=l.spend/l.trials;
        return { improving: lCPA<fCPA, deltaPct: ((lCPA-fCPA)/fCPA*100).toFixed(1), firstCPA: fCPA.toFixed(2), lastCPA: lCPA.toFixed(2), stable: Math.abs((lCPA-fCPA)/fCPA) < (settings.stabilityTolerance||0.05) };
    }

    const updateMeta = (name, updates) => {
        const updated = {...campaignMeta,[name]:{...campaignMeta[name],...updates}};
        setCampaignMeta(updated); save('nw-meta',updated);
    };
    const updateSettings = s => { setSettings(s); save('nw-settings',s); };

    const campaignList = Object.keys(campaigns).map(n=>({...getMetrics(campaigns[n],settings), name:n, platform:campaigns[n].platform||''})).filter(Boolean);
    const totals = campaignList.reduce((a,c)=>({spend:a.spend+c.spend,clicks:a.clicks+c.clicks,impressions:a.impressions+c.impressions,installs:a.installs+c.installs,trials:a.trials+c.trials,conversions:a.conversions+(c.trials||0)}),{spend:0,clicks:0,impressions:0,installs:0,trials:0,conversions:0});
    const overallCPA = totals.conversions>0 ? totals.spend/totals.conversions : 0;

    // ── upload handlers ───────────────────────────────────────────────────────
    const handleUpload = ev => {
        const file = ev.target.files[0]; if (!file) return;
        setUploading(true);
        Papa.parse(file, { header:true, skipEmptyLines:true, complete: results => {
            if (!results.data.length) { setUploading(false); return; }
            const cols = Object.keys(results.data[0]);
            const isGoogleTS = cols.includes('Date') && cols.includes('Cost') && cols.includes('Installs') && !cols.includes('Campaign Name');
            const isASA = cols.includes('Adset') && cols.includes('af_subscribe');
            const clean = v => parseFloat((v||'0').toString().replace(/[$,]/g,''))||0;
            // First real upload: wipe dummy data
            const base = hasRealData ? {...campaigns} : {};
            const updated = {...base};
            let newDates = new Set();
            if (isGoogleTS) {
                const campName = file.name.replace(/\.[^.]+$/,'').replace(/_/g,' ');
                if (!updated[campName]) updated[campName] = {platform:'Google',dailyData:{}};
                results.data.forEach(row => {
                    const date=normaliseDate(row.Date); if (!date) return;
                    if (!updated[campName].dailyData[date]) newDates.add(date);
                    updated[campName].dailyData[date] = {spend:clean(row.Cost),installs:Math.round(clean(row.Installs)),trials:0,clicks:Math.round(clean(row.Installs)*2.5),impressions:Math.round(clean(row.Installs)*30)};
                });
            } else {
                results.data.forEach(row => {
                    const date=normaliseDate(row.Date||row.date); if (!date) return;
                    const name = row['Campaign Name']||row['Adset']||row['Campaign']||file.name.replace(/\.[^.]+$/,'');
                    if (!updated[name]) updated[name]={platform:'Unknown',dailyData:{}};
                    if (!updated[name].dailyData[date]) newDates.add(date);
                    updated[name].dailyData[date]={
                        spend:clean(row['Amount Spent (USD)']||row['Cost']||row['Spend']||0),
                        clicks:Math.round(clean(row['Link Clicks']||row['Clicks']||0)),
                        impressions:Math.round(clean(row['Impressions']||0)),
                        installs:Math.round(clean(row['(MMP) Total App Installs']||row['Installs']||0)),
                        trials:Math.round(clean(row['(MMP) App Purchases']||row['af_subscribe']||row['Trials']||0)),
                        modeledPaidSubs:0
                    };
                });
            }
            const snap = {id:Date.now(),date:new Date().toISOString().split('T')[0],data:campaignList};
            const newLog = [{date:new Date().toISOString().split('T')[0],time:new Date().toLocaleTimeString(),type:'upload',description:`UA upload: ${[...newDates].slice(0,3).join(', ')}… · ${newDates.size} new dates`},...changelog];
            const newSnaps = [...snapshots,snap].slice(-20);
            setCampaigns(updated); setChangelog(newLog); setSnapshots(newSnaps);
            if (!hasRealData) { setHasRealData(true); store.set('nw-has-real-data', true); }
            save('nw-campaigns',updated); save('nw-changelog',newLog); save('nw-snapshots',newSnaps);
            setUploading(false);
        }, error:()=>setUploading(false) });
    };

    const handleInstallUpload = ev => {
        const file = ev.target.files[0]; if (!file) return;
        setUploadingInstalls(true);
        Papa.parse(file, { header:true, skipEmptyLines:true, complete: results => {
            if (!results.data.length) { setUploadingInstalls(false); return; }
            const updated = {...installData};
            const clean = v => parseFloat((v||'0').toString().replace(/[$,]/g,''))||0;
            let newCount=0;
            results.data.forEach(row => {
                const date=normaliseDate(row.Date||row.date); if (!date) return;
                if (!updated[date]) newCount++;
                updated[date]={installs:Math.round(clean(row.Installs||row.installs||0)),organic:Math.round(clean(row['Organic Installs']||0)),paid:Math.round(clean(row['Non-organic Installs']||0)),mau:Math.round(clean(row.MAU||0)),dau:Math.round(clean(row.DAU||0))};
            });
            const newLog = [{date:new Date().toISOString().split('T')[0],time:new Date().toLocaleTimeString(),type:'install-upload',description:`Install data: ${newCount} new dates`},...changelog];
            setInstallData(updated); setChangelog(newLog);
            save('nw-installs',updated); save('nw-changelog',newLog);
            setUploadingInstalls(false);
        }, error:()=>setUploadingInstalls(false) });
    };

    const handleAdRevUpload = ev => {
        const file = ev.target.files[0]; if (!file) return;
        setUploadingAdRev(true);
        Papa.parse(file, { header:true, skipEmptyLines:true, complete: results => {
            if (!results.data.length) { setUploadingAdRev(false); return; }
            const updated = {...adRevenueData};
            const clean = v => parseFloat((v||'0').toString().replace(/[$,]/g,''))||0;
            let newCount=0;
            results.data.forEach(row => {
                const date=normaliseDate(row.Day||row.Date); if (!date) return;
                const country=(row.Country||'ALL').trim();
                const key=`${date}__${country}`;
                if (!updated[key]) newCount++;
                updated[key]={date,country,dau:Math.round(clean(row.DAU)),dav:Math.round(clean(row.DAV||0)),requests:Math.round(clean(row.Requests||0)),arpdau:clean(row.ARPDAU),estRevenue:clean(row['Est. Revenue']||row.Revenue||0),ecpm:clean(row.eCPM),adViewerRate:clean(row['Ad Viewer Rate']||0),reqPerDau:clean(row['Req/dau']||0),impPerDau:clean(row['Imp/dau']||0),app:(row['Application Filter']||'').replace(/\s*\(Include\)\s*$/,'').trim()};
            });
            const allRows=Object.values(updated);
            const avg = key => allRows.reduce((s,r)=>s+(r[key]||0),0)/allRows.length;
            const updatedSettings={...settings,arpdau:Math.round(avg('arpdau')*10000)/10000,ecpm:Math.round(avg('ecpm')*10000)/10000,adFillRate:Math.round(avg('adViewerRate')*10000)/10000,adsPerDau:Math.round(avg('impPerDau')*10)/10};
            const newLog=[{date:new Date().toISOString().split('T')[0],time:new Date().toLocaleTimeString(),type:'adrev-upload',description:`Ad revenue: ${newCount} new rows · avg ARPDAU $${avg('arpdau').toFixed(4)}`},...changelog];
            if (!hasRealData) { setHasRealData(true); store.set('nw-has-real-data', true); setCampaigns({}); save('nw-campaigns', {}); }
            setAdRevenueData(updated); setSettings(updatedSettings); setChangelog(newLog);
            save('nw-adrev',updated); save('nw-settings',updatedSettings); save('nw-changelog',newLog);
            setUploadingAdRev(false); setTab('adrevenue');
        }, error:()=>setUploadingAdRev(false) });
    };

    // ── render ────────────────────────────────────────────────────────────────
    const TABS = ['dashboard','campaigns','financial','adrevenue','retention','history','settings','upload'];
    const tabLabel = t => t==='adrevenue'?'💰 Ad Revenue':t==='retention'?'📉 Retention':t.charAt(0).toUpperCase()+t.slice(1);

    return e('div', {className:'min-h-screen bg-gray-50'},
        !hasRealData && e('div', {className:'bg-amber-50 border-b border-amber-200 px-4 py-2 text-center text-xs text-amber-700'}, '⚠️ Showing demo data — upload your CSVs in the ', e('button', {onClick:()=>setTab('upload'), className:'underline font-semibold'}, 'Upload tab'), ' to replace it'),
        e('div', {className:'max-w-7xl mx-auto px-4 py-8'},
            e('div', {className:'mb-6 flex items-center justify-between'},
                e('div', null,
                    e('h1', {className:'text-3xl font-bold text-gray-900'}, 'Spider Solitaire Modeling ',
                        e('span', {className:'ml-2 text-sm font-normal bg-blue-600 text-white px-3 py-1 rounded-full'}, 'v2 · Ad-First')
                    ),
                    e('p', {className:'text-gray-500 mt-1'}, 'UA · LTV · Ad Revenue Modeling')
                ),
                e('div', {className:'text-right text-sm text-gray-500'},
                    e('div', null, campaignList.length + ' campaigns'),
                    e('div', {className:'text-xs text-green-600'}, snapshots.length + ' snapshots')
                )
            ),
            e('div', {className:'bg-white rounded-xl shadow-sm'},
                e('div', {className:'border-b border-gray-200'},
                    e('nav', {className:'flex px-6 overflow-x-auto'},
                        TABS.map(t => e('button', {key:t, onClick:()=>setTab(t), className:cls('py-4 px-4 border-b-2 font-medium text-sm mr-1 whitespace-nowrap', tab===t?'border-blue-600 text-blue-600':'border-transparent text-gray-500 hover:text-gray-700')}, tabLabel(t)))
                    )
                ),
                e('div', {className:'p-6'},
                    tab==='dashboard' && e(Dashboard, {campaigns:campaignList, campaigns_raw:campaigns, getMetrics, settings, snapshots, totals, overallCPA, setTab}),
                    tab==='campaigns' && e(Campaigns, {campaigns:campaignList, campaignMeta, campaigns_raw:campaigns, settings, timeframes, setTimeframes, getMetrics, getRec, getBroadLearnings, updateMeta}),
                    tab==='financial' && e(Financial, {campaigns:campaignList, settings}),
                    tab==='adrevenue' && e(AdRevenue, {adRevenueData, settings}),
                    tab==='retention' && e(Retention, null),
                    tab==='history' && e(History, {campaigns:campaignList, snapshots, changelog}),
                    tab==='settings' && e(Settings, {settings, updateSettings}),
                    tab==='upload' && e(Upload, {handleUpload, uploading, handleInstallUpload, uploadingInstalls, handleAdRevUpload, uploadingAdRev})
                )
            )
        )
    );
}

// ── KPI card helper ───────────────────────────────────────────────────────────
function KPI({label, value, sub, color='text-blue-700', bg='bg-blue-50', border='border-blue-200'}) {
    return e('div', {className:cls('border rounded-xl p-4', bg, border)},
        e('div', {className:'text-xs text-gray-500'}, label),
        e('div', {className:cls('text-xl font-bold mt-0.5', color)}, value),
        sub && e('div', {className:'text-xs text-gray-400 mt-0.5'}, sub)
    );
}

// ── Dashboard ─────────────────────────────────────────────────────────────────
function Dashboard({campaigns, campaigns_raw, getMetrics, settings, snapshots, totals, overallCPA, setTab}) {
    const trendRef = useRef(null), trendInst = useRef(null);
    const cpaRef = useRef(null), cpaInst = useRef(null);

    const t30 = campaigns.reduce((a,c)=>({spend:a.spend+c.spend,installs:a.installs+c.installs,trials:a.trials+c.trials,clicks:a.clicks+c.clicks}),{spend:0,installs:0,trials:0,clicks:0});
    const t7 = campaigns.map(c=>getMetrics(campaigns_raw[c.name],settings,7)).filter(Boolean).reduce((a,c)=>({spend:a.spend+c.spend,installs:a.installs+c.installs,trials:a.trials+c.trials,clicks:a.clicks+c.clicks}),{spend:0,installs:0,trials:0,clicks:0});
    const cpa7 = t7.trials>0?t7.spend/t7.trials:0;
    const cpi30 = t30.installs>0?t30.spend/t30.installs:0;
    const dauRetCurve = [1.0,0.01340,0.00762,0.00434,0.00247,0.00140,0.00080,0.00045,0.00026,0.00015,0.00008,0.00005];
    const adLTV12 = dauRetCurve.reduce((s,r)=>s+r*(settings.arpdau||0.157)*30,0);
    const subContrib12 = settings.subEnabled!==false ? ((t30.installs>0?t30.trials/t30.installs:0.40)*(settings.trialConvRate||0.40)*(settings.arppu||2.70)*2.4) : 0;
    const blendedLTV12 = adLTV12 + subContrib12;

    // build daily trend
    const daily = {};
    campaigns.forEach(c => {
        Object.entries(campaigns_raw[c.name]?.dailyData||{}).forEach(([date,r])=>{
            if (!daily[date]) daily[date]={spend:0,installs:0,trials:0};
            daily[date].spend+=r.spend||0; daily[date].installs+=r.installs||0; daily[date].trials+=r.trials||0;
        });
    });
    const trendDates = Object.keys(daily).sort().slice(-30);

    useEffect(()=>{
        if (!trendRef.current||!trendDates.length) return;
        if (trendInst.current) trendInst.current.destroy();
        trendInst.current = new Chart(trendRef.current, {type:'line',data:{labels:trendDates.map(d=>d.slice(5)),datasets:[
            {label:'Spend',data:trendDates.map(d=>daily[d]?.spend||0),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.08)',borderWidth:2,fill:true,tension:0.3,pointRadius:2,yAxisID:'y'},

        return ()=>cpaInst.current?.destroy();

    const kpis = [

        {label:'30d Installs',value:fmtK(t30.installs),sub:'all campaigns',bg:'bg-indigo-50',border:'border-indigo-200',color:'text-indigo-700'},

        {label:'7d CPA',value:cpa7>0?fmtD(cpa7):'—',sub:`target ${fmtD(settings.targetCPA)}`,bg:cpa7>0&&cpa7<settings.targetCPA?'bg-emerald-50':cpa7>settings.maxCPA?'bg-red-50':'bg-amber-50',border:cpa7>0&&cpa7<settings.targetCPA?'border-emerald-200':cpa7>settings.maxCPA?'border-red-200':'border-amber-200',color:cpa7>0&&cpa7<settings.targetCPA?'text-emerald-700':cpa7>settings.maxCPA?'text-red-700':'text-amber-700'},

        {label:'Blended LTV',value:fmtD(blendedLTV12),sub:'ad + sub',bg:'bg-orange-50',border:'border-orange-200',color:'text-orange-700'},

    return e('div', {className:'space-y-6'},

                e('div', {className:'text-sm font-semibold text-gray-700 mb-3'}, '30-Day Spend & Trials'),
                e('div', {style:{height:200}}, e('canvas',{ref:trendRef}))
            ),
            e('div', {className:'bg-white border border-gray-200 rounded-xl p-4'},
                e('div', {className:'text-sm font-semibold text-gray-700 mb-3'}, 'CPA by Campaign'),
                e('div', {style:{height:200}}, e('canvas',{ref:cpaRef}))

        e('div', {className:'bg-white border border-gray-200 rounded-xl overflow-hidden'},
            e('div', {className:'bg-gray-50 px-4 py-2.5 border-b border-gray-200 text-xs font-semibold text-gray-600 uppercase tracking-wide'}, 'Campaign Summary'),
            e('table', {className:'w-full text-sm'},
                e('thead', null,
                    e('tr', {className:'text-xs text-gray-400 border-b border-gray-100'},

                        return e('tr', {key:c.name, className:'border-b border-gray-50 hover:bg-gray-50'},

}

// ── Campaigns ─────────────────────────────────────────────────────────────────
function Campaigns({campaigns, campaignMeta, campaigns_raw, settings, timeframes, setTimeframes, getMetrics, getRec, getBroadLearnings, updateMeta}) {
    const [selected, setSelected] = useState(null);
    const sparkRefs = useRef({});
    const sparkInsts = useRef({});

    // Retention/LTV helpers (same as Financial)
    const A_FIT=0.0259, K_FIT=0.02075;
    const OBS_RET=[[0,1.0],[1,0.15996],[2,0.07865],[3,0.05923],[4,0.05000],[5,0.04255],[6,0.05112],[7,0.03647],[10,0.03077],[14,0.03279],[18,0.02857],[21,0.01713],[30,0.0131],[45,0.0107],[75,0.0054]];
    const retAtDay = d => {
        if(d===0) return 1.0;
        for(let i=0;i<OBS_RET.length-1;i++){const[d0,r0]=OBS_RET[i],[d1,r1]=OBS_RET[i+1];if(d>=d0&&d<=d1)return r0+(d-d0)/(d1-d0)*(r1-r0);}
        return A_FIT*Math.exp(-K_FIT*d);
    };
    const adLTV12 = (() => { let s=0; for(let m=0;m<=12;m++){let dd=0;for(let d=m*30;d<(m+1)*30;d++)dd+=retAtDay(d);s+=dd*(settings.arpdau||0.157);} return s; })();
    const arpdau = settings.arpdau||0.157;

    useEffect(()=>{
        campaigns.forEach(c=>{
            const raw = campaigns_raw[c.name];
            if (!raw||!sparkRefs.current[c.name]) return;
            if (sparkInsts.current[c.name]) sparkInsts.current[c.name].destroy();
            const dates = Object.keys(raw.dailyData||{}).sort().slice(-14);
            sparkInsts.current[c.name] = new Chart(sparkRefs.current[c.name],{type:'line',data:{labels:dates,datasets:[{data:dates.map(d=>(raw.dailyData[d]?.spend||0)),borderColor:'#3b82f6',borderWidth:1.5,pointRadius:0,fill:false,tension:0.3}]},options:{responsive:false,plugins:{legend:{display:false},tooltip:{enabled:false}},scales:{x:{display:false},y:{display:false}}}});
        });
        return ()=>Object.values(sparkInsts.current).forEach(c=>c?.destroy());
    },[campaigns]);

    const recColor = {scale:'text-emerald-600 bg-emerald-50 border-emerald-200',increase:'text-blue-600 bg-blue-50 border-blue-200',maintain:'text-amber-600 bg-amber-50 border-amber-200',decrease:'text-orange-600 bg-orange-50 border-orange-200',pause:'text-red-600 bg-red-50 border-red-200'};
    const recEmoji = {scale:'🚀',increase:'⬆️',maintain:'🟡',decrease:'⬇️',pause:'⛔'};

    // Sort by spend descending
    const sorted = [...campaigns].sort((a,b)=>b.spend-a.spend);

    return e('div', {className:'space-y-4'},
        // Header
        e('div', {className:'flex items-center justify-between'},
            e('div', null,
                e('h2',{className:'text-xl font-semibold'},'Campaigns'),
                e('p',{className:'text-xs text-gray-400 mt-0.5'},'Click any campaign for full unit economics · Ad LTV uses real retention curve')
            ),
            e('div',{className:'text-right text-xs text-gray-400'},
                e('div',null,sorted.length+' campaigns · sorted by spend'),
                e('div',{className:'text-emerald-600 font-semibold'},'12M ad LTV/install: $'+adLTV12.toFixed(3))
            )
        ),

        // Campaign rows
        sorted.map(c => {
            const rec = getRec(c);
            const broad = getBroadLearnings(c.name);
            const isOpen = selected===c.name;
            const raw = campaigns_raw[c.name];

            // Per-campaign unit economics
            const cpi = c.cpi||0;
            const optInRate = c.optInRate||0;
            const trialConv = settings.trialConvRate||0.40;
            const arppu = settings.arppu||2.70;
            const subEnabled = settings.subEnabled!==false;
            const cpa = c.cpa||0;
            // Ad LTV vs CPA
            const adROAS = cpi>0 ? adLTV12/cpi : 0;
            // Blended LTV (ad + sub)
            const subLTV12 = subEnabled ? optInRate*trialConv*arppu*2.4 : 0;
            const blendedLTV = adLTV12 + subLTV12;
            const blendedROAS = cpi>0 ? blendedLTV/cpi : 0;

            // 7d metrics
            const m7 = getMetrics(raw, settings, 7);
            const spend7 = m7?.spend||0;
            const cpa7 = m7?.cpa||0;

            return e('div', {key:c.name, className:'border border-gray-200 rounded-xl overflow-hidden bg-white'},
                // Row header
                e('div', {className:'flex items-center gap-4 px-4 py-3 cursor-pointer hover:bg-gray-50', onClick:()=>setSelected(isOpen?null:c.name)},
                    e('div', {className:'flex-1 min-w-0'},
                        e('div',{className:'font-medium text-sm text-gray-800 truncate'},c.name),
                        e('div',{className:'text-xs text-gray-400 mt-0.5'},c.platform+' · '+c.days+'d data · $'+fmtK(c.spend).replace('$','')+' spend')
                    ),
                    e('canvas',{ref:el=>{if(el)sparkRefs.current[c.name]=el;},width:80,height:28,style:{display:'block',flexShrink:0}}),
                    // Key stats inline
                    e('div',{className:'hidden sm:flex items-center gap-4 text-xs'},
                        e('div',{className:'text-center'},e('div',{className:'text-gray-400'},'CPI'),e('div',{className:'font-mono font-semibold text-gray-700'},cpi>0?fmtD(cpi):'—')),
                        e('div',{className:'text-center'},e('div',{className:'text-gray-400'},'CPA'),e('div',{className:cls('font-mono font-semibold',cpa<settings.targetCPA?'text-emerald-600':cpa<settings.maxCPA?'text-amber-600':'text-red-600')},cpa>0?fmtD(cpa):'—')),
                        e('div',{className:'text-center'},e('div',{className:'text-gray-400'},'Ad ROAS'),e('div',{className:cls('font-mono font-semibold',adROAS>=1?'text-emerald-600':adROAS>=0.7?'text-amber-600':'text-red-600')},(adROAS*100).toFixed(0)+'%')),
                        e('div',{className:'text-center'},e('div',{className:'text-gray-400'},'Blended'),e('div',{className:cls('font-mono font-semibold',blendedROAS>=1?'text-emerald-600':blendedROAS>=0.7?'text-amber-600':'text-red-600')},(blendedROAS*100).toFixed(0)+'%'))
                    ),
                    e('div',{className:cls('text-xs px-2 py-1 rounded-full border font-medium ml-2',recColor[rec.action]||'text-gray-600 bg-gray-100 border-gray-200')},recEmoji[rec.action]+' '+rec.action),
                    e('div',{className:'text-gray-300 text-xs ml-1'},isOpen?'▲':'▼')
                ),

                // Expanded detail
                isOpen && e('div', {className:'border-t border-gray-100 bg-gray-50/50'},

                    // ── THE VERDICT ──
                    e('div',{className:cls('mx-4 mt-4 rounded-xl p-4 border-2',
                        blendedROAS>=1?'bg-emerald-50 border-emerald-400':blendedROAS>=0.7?'bg-amber-50 border-amber-400':'bg-red-50 border-red-400')},
                        e('div',{className:'flex items-start justify-between gap-4'},
                            e('div',{className:'flex-1'},
                                e('div',{className:cls('text-xs font-bold uppercase tracking-wider mb-1 opacity-60',blendedROAS>=1?'text-emerald-700':blendedROAS>=0.7?'text-amber-700':'text-red-700')},'Campaign Verdict'),
                                e('div',{className:cls('text-2xl font-black mb-1.5',blendedROAS>=1?'text-emerald-700':blendedROAS>=0.7?'text-amber-700':'text-red-700')},
                                    blendedROAS>=1?'✅ PROFITABLE':'🛑 UNDERWATER'
                                ),
                                e('div',{className:cls('text-sm',blendedROAS>=1?'text-emerald-800':blendedROAS>=0.7?'text-amber-800':'text-red-800')},
                                    blendedROAS>=1
                                        ? `12M blended LTV $${blendedLTV.toFixed(2)} vs CPI $${cpi.toFixed(2)} — ${(blendedROAS*100).toFixed(0)}% ROAS. ${rec.msg}`
                                        : `12M blended LTV $${blendedLTV.toFixed(2)} vs CPI $${cpi.toFixed(2)} — need LTV to reach $${cpi.toFixed(2)} to break even. ${rec.msg}`
                                )
                            ),
                            e('div',{className:'text-right shrink-0'},
                                e('div',{className:cls('text-4xl font-black tabular-nums',blendedROAS>=1?'text-emerald-700':blendedROAS>=0.7?'text-amber-700':'text-red-700')},(blendedROAS*100).toFixed(0)+'%'),
                                e('div',{className:'text-xs text-gray-500 mt-0.5'},'12M blended ROAS'),
                                e('div',{className:'text-xs text-gray-400'},'break-even = 100%')
                            )
                        )
                    ),

                    // ── Unit Economics Funnel ──
                    e('div',{className:'mx-4 mt-3'},
                        e('div',{className:'text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2'},'Unit Economics Funnel'),
                        e('div',{className:'flex items-stretch gap-1'},
                            ...[
                                {label:'CPI',value:fmtD(cpi),sub:'cost/install',bg:'bg-blue-50',border:'border-blue-200',text:'text-blue-800'},
                                null,
                                {label:'Opt-in Rate',value:(optInRate*100).toFixed(1)+'%',sub:(c.trials||0)+' trials',bg:'bg-indigo-50',border:'border-indigo-200',text:'text-indigo-800'},
                                null,
                                {label:'Trial Conv',value:(trialConv*100).toFixed(0)+'%',sub:'trial→paid',bg:'bg-violet-50',border:'border-violet-200',text:'text-violet-800'},
                                null,
                                {label:'CPA',value:cpa>0?fmtD(cpa):'—',sub:cpa<settings.targetCPA?'✅ on target':'⚠️ above $'+settings.targetCPA,bg:cpa<settings.targetCPA?'bg-emerald-50':'bg-red-50',border:cpa<settings.targetCPA?'border-emerald-300':'border-red-300',text:cpa<settings.targetCPA?'text-emerald-800':'text-red-700'},
                            ].map((item,i)=>item===null
                                ? e('div',{key:i,className:'flex items-center text-gray-300 text-sm font-bold self-center px-0.5'},'→')
                                : e('div',{key:i,className:cls('flex-1 rounded-lg px-2 py-2.5 text-center border',item.bg,item.border)},
                                    e('div',{className:'text-xs text-gray-500 mb-0.5'},item.label),
                                    e('div',{className:cls('font-bold text-sm',item.text)},item.value),
                                    e('div',{className:'text-xs text-gray-400 mt-0.5'},item.sub)
                                )
                            )
                        )
                    ),

                    // ── LTV vs CPI breakdown ──
                    e('div',{className:'mx-4 mt-3 grid grid-cols-4 gap-2'},
                        [
                            {label:'12M Ad LTV',value:'$'+adLTV12.toFixed(3),sub:'per install · real retention',color:'text-amber-600',bg:'bg-amber-50',border:'border-amber-200'},
                            {label:'12M Sub LTV',value:subEnabled?'$'+subLTV12.toFixed(3):'disabled',sub:subEnabled?`${(optInRate*100).toFixed(1)}% opt-in × ${(trialConv*100).toFixed(0)}% conv`:'toggle in Settings',color:'text-violet-600',bg:'bg-violet-50',border:'border-violet-200'},
                            {label:'12M Blended LTV',value:'$'+blendedLTV.toFixed(3),sub:'ad + sub combined',color:'text-blue-700',bg:'bg-blue-50',border:'border-blue-200'},
                            {label:'ARPDAU',value:'$'+(arpdau).toFixed(4),sub:'from mediation data',color:'text-emerald-600',bg:'bg-emerald-50',border:'border-emerald-200'},
                        ].map(k=>e('div',{key:k.label,className:cls('rounded-lg p-3 border',k.bg,k.border)},
                            e('div',{className:'text-xs text-gray-500'},k.label),
                            e('div',{className:cls('font-bold text-base mt-0.5',k.color)},k.value),
                            e('div',{className:'text-xs text-gray-400 mt-0.5'},k.sub)
                        ))
                    ),

                    // ── 7d vs all time stats ──
                    e('div',{className:'mx-4 mt-3'},
                        e('div',{className:'text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2'},'Performance Detail'),
                        e('div',{className:'grid grid-cols-4 gap-2'},
                            [
                                ['Spend (all)',fmtM(c.spend),'total'],
                                ['Spend (7d)',fmtM(spend7),'last 7 days'],
                                ['Installs',fmtK(c.installs||0),'total'],
                                ['Opt-ins',fmtK(c.trials||0),(c.optInRate*100).toFixed(1)+'% rate'],
                                ['CPA (all)',cpa>0?fmtD(cpa):'—','subscription CPA'],
                                ['CPA (7d)',cpa7>0?fmtD(cpa7):'—','7-day window'],
                                ['CTR',c.ctr.toFixed(2)+'%','click-through rate'],
                                ['CVR',c.cvr.toFixed(2)+'%','click-to-trial'],
                            ].map(([l,v,s])=>e('div',{key:l,className:'bg-white border border-gray-200 rounded-lg p-2.5'},
                                e('div',{className:'text-xs text-gray-400'},l),
                                e('div',{className:'font-semibold text-gray-800 mt-0.5 text-sm'},v),
                                e('div',{className:'text-xs text-gray-400'},s)
                            ))
                        )
                    ),

                    // ── Trend & advice ──
                    e('div',{className:'mx-4 mt-3 grid grid-cols-2 gap-3'},
                        // Recommendation
                        e('div',{className:cls('rounded-lg p-3 border',recColor[rec.action]||'bg-gray-50 border-gray-200')},
                            e('div',{className:'text-xs font-semibold uppercase tracking-wide mb-1 opacity-70'},'Recommendation'),
                            e('div',{className:'text-sm font-medium'},recEmoji[rec.action]+' '+rec.msg)
                        ),
                        // Trend
                        broad
                            ? e('div',{className:cls('rounded-lg p-3 border',broad.improving?'bg-emerald-50 border-emerald-200':'bg-red-50 border-red-200')},
                                e('div',{className:'text-xs font-semibold uppercase tracking-wide mb-1 opacity-70'},'CPA Trend (first 7d → last 7d)'),
                                e('div',{className:cls('text-sm font-medium',broad.improving?'text-emerald-700':'text-red-700')},
                                    (broad.improving?'↓ Improving':'↑ Worsening')+' · $'+broad.firstCPA+' → $'+broad.lastCPA+' ('+broad.deltaPct+'%)'
                                )
                            )
                            : e('div',{className:'rounded-lg p-3 border bg-gray-50 border-gray-200'},
                                e('div',{className:'text-xs font-semibold uppercase tracking-wide mb-1 text-gray-400'},'CPA Trend'),
                                e('div',{className:'text-xs text-gray-400'},'Need 14+ days of data for trend analysis')
                            )
                    ),

                    // Notes
                    e('div',{className:'mx-4 mt-3 mb-4'},
                        e('textarea',{className:'w-full text-xs border border-gray-200 rounded-lg p-2.5 resize-none bg-white',rows:2,placeholder:'Campaign notes...',value:campaignMeta[c.name]?.notes||'',onChange:ev=>updateMeta(c.name,{notes:ev.target.value})})
                    )
                )
            );
        })
    );
}

// ── Settings ──────────────────────────────────────────────────────────────────
function Settings({settings, updateSettings}) {
    const s = settings;
    const upd = (k,v) => updateSettings({...s,[k]:parseFloat(v)||v});

    const Field = ({label, fieldKey, prefix, suffix, step='0.01', isPercent=false, hint=''}) =>
        e('div', {className:'flex flex-col gap-1'},
            e('label', {className:'text-xs font-medium text-gray-600'}, label),
            e('div', {className:'flex items-center gap-1'},
                prefix && e('span',{className:'text-xs text-gray-400'},prefix),
                e('input', {type:'number', step, value:isPercent?+(s[fieldKey]*100).toFixed(2):s[fieldKey], onChange:ev=>upd(fieldKey,isPercent?parseFloat(ev.target.value)/100:parseFloat(ev.target.value)), className:'w-full border border-gray-200 rounded px-2 py-1.5 text-sm focus:outline-none focus:border-blue-400'}),
                suffix && e('span',{className:'text-xs text-gray-400'},suffix)
            ),
            hint && e('div',{className:'text-xs text-gray-400'},hint)
        );

    return e('div', {className:'space-y-6 max-w-2xl'},
        e('h2', {className:'text-xl font-semibold'}, 'Settings'),
        e('div', {className:'border border-gray-200 rounded-xl p-5 space-y-4'},

// ── Retention ─────────────────────────────────────────────────────────────────
function Retention() {
    const chartRef = useRef(null), chartInst = useRef(null);
    const ltvRef = useRef(null), ltvInst = useRef(null);

    const OBSERVED = [
        {day:1,ret:0.15996},{day:2,ret:0.07865},{day:3,ret:0.05923},{day:4,ret:0.05000},{day:5,ret:0.04255},
        {day:6,ret:0.05112},{day:7,ret:0.03647},{day:10,ret:0.03077},{day:14,ret:0.03279},
        {day:18,ret:0.02857},{day:21,ret:0.01713},
        {day:30,ret:0.0131},{day:45,ret:0.0107},{day:75,ret:0.0054},
    ];
    const A=0.0259, K=0.02075; // half-life 33.4d · blended: new D1-D21 + old D30-D75 anchors
    const tailFit = d => A*Math.exp(-K*d);
    const piecewise = d => {
        if (d===0) return 1.0;
        const exact = OBSERVED.find(o=>o.day===d);
        if (exact) return exact.ret;
        const sorted = OBSERVED.slice().sort((a,b)=>a.day-b.day);
        for (let i=0;i<sorted.length-1;i++) {
            if (d>=sorted[i].day&&d<=sorted[i+1].day) {
                const t=(d-sorted[i].day)/(sorted[i+1].day-sorted[i].day);
                return sorted[i].ret+t*(sorted[i+1].ret-sorted[i].ret);
            }
        }
        return tailFit(d);
    };

    const EOM = [
        {m:0,d:1.0,ret:1.00000,type:'install'},
        {m:1,d:30,ret:0.01310,type:'observed'},
        {m:2,d:60,ret:0.00746,type:'extrap'},
        {m:3,d:90,ret:0.00400,type:'extrap'},
        {m:4,d:120,ret:0.00215,type:'extrap'},
        {m:5,d:150,ret:0.00115,type:'extrap'},
        {m:6,d:180,ret:0.00062,type:'extrap'},
        {m:7,d:210,ret:0.00033,type:'extrap'},
        {m:8,d:240,ret:0.00018,type:'extrap'},
        {m:9,d:270,ret:0.00010,type:'extrap'},
        {m:10,d:300,ret:0.00005,type:'extrap'},
        {m:11,d:330,ret:0.00003,type:'extrap'},
        {m:12,d:360,ret:0.00001,type:'extrap'},
    ];

    const ARPDAU=0.157; // from mediation report
    const cumulativeLTV=[]; let running=0;
    for (let m=0;m<=12;m++) {
        let dauDays=0;
        for (let d=m*30;d<(m+1)*30;d++) dauDays+=(d<=75?piecewise(d):tailFit(d));
        running+=dauDays*ARPDAU;
        cumulativeLTV.push({m,ltv:running,dauDays});
    }

    const CHART_DAYS = [0,1,2,3,4,5,6,7,10,14,21,30,45,60,75,90,120,150,180,240,300,365];

    useEffect(()=>{
        if (!chartRef.current) return;
        if (chartInst.current) chartInst.current.destroy();
        chartInst.current = new Chart(chartRef.current,{type:'line',data:{datasets:[
            {label:'DAU Retention',data:CHART_DAYS.map(d=>({x:d,y:+(piecewise(d)*100).toFixed(3)})),borderColor:'#3b82f6',backgroundColor:'rgba(59,130,246,0.08)',borderWidth:2.5,fill:true,tension:0.3,pointRadius:0,parsing:false},
            {label:'Observed',data:OBSERVED.map(o=>({x:o.day,y:+(o.ret*100).toFixed(3)})),borderColor:'transparent',backgroundColor:'#10b981',pointRadius:6,type:'scatter',parsing:false},
            {label:'Tail extrapolation',data:[30,45,60,75,90,120,150,180].map(d=>({x:d,y:+(tailFit(d)*100).toFixed(3)})),borderColor:'#f59e0b',borderWidth:2,borderDash:[5,4],pointRadius:3,backgroundColor:'#f59e0b',parsing:false},
        ]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{type:'linear',title:{display:true,text:'Days since install',font:{size:11}},ticks:{font:{size:10}}},y:{beginAtZero:true,title:{display:true,text:'DAU Retention (%)',font:{size:11}},ticks:{callback:v=>v+'%',font:{size:10}}}},plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:11}}}}}});
        return ()=>chartInst.current?.destroy();
    },[]);

    useEffect(()=>{
        if (!ltvRef.current) return;
        if (ltvInst.current) ltvInst.current.destroy();
        ltvInst.current = new Chart(ltvRef.current,{type:'line',data:{labels:cumulativeLTV.map(r=>'M'+r.m),datasets:[{label:'Cumul ad LTV/install',data:cumulativeLTV.map(r=>+r.ltv.toFixed(4)),borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.1)',borderWidth:2.5,fill:true,tension:0.3,pointRadius:4}]},options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+v.toFixed(3),font:{size:10}}},x:{ticks:{font:{size:10}}}},plugins:{legend:{display:false}}}});
        return ()=>ltvInst.current?.destroy();
    },[]);

    const fmtPct = v => (v*100).toFixed(v<0.001?4:v<0.01?3:2)+'%';
    const benchmarks = [{l:'D1',v:fmtPct(0.15996),badge:'OBSERVED',cls:'bg-emerald-50 text-emerald-700 border-emerald-200'},{l:'D7',v:fmtPct(0.03647),badge:'OBSERVED',cls:'bg-emerald-50 text-emerald-700 border-emerald-200'},{l:'D14',v:fmtPct(0.03279),badge:'OBSERVED',cls:'bg-emerald-50 text-emerald-700 border-emerald-200'},{l:'D21',v:fmtPct(0.01713),badge:'OBSERVED',cls:'bg-emerald-50 text-emerald-700 border-emerald-200'},{l:'D30',v:fmtPct(0.0131),badge:'OBSERVED (old)',cls:'bg-blue-50 text-blue-700 border-blue-200'},{l:'Tail half-life',v:'33 days',badge:'FITTED',cls:'bg-amber-50 text-amber-700 border-amber-200'}];

    return e('div', {className:'space-y-6'},
        e('div', {className:'flex items-start justify-between'},
            e('div', null,
                e('h2',{className:'text-xl font-semibold'},'DAU Retention Curve'),
                e('p',{className:'text-sm text-gray-500 mt-0.5'},'85 cohorts · Dec 2025 – Feb 2026 · US · Spider Solitaire Android')
            ),
            e('div', {className:'bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 text-xs text-blue-700 text-right'},
                e('div',{className:'font-semibold'},'12M Ad LTV/install'),
                e('div',{className:'text-2xl font-bold text-blue-800 mt-0.5'},'$'+cumulativeLTV[12].ltv.toFixed(3)),
                e('div',{className:'text-blue-500 mt-0.5'},'@ ARPDAU $'+ARPDAU)
            )
        ),
        e('div', {className:'grid grid-cols-6 gap-3'},
            benchmarks.map(b=>e('div',{key:b.l,className:'bg-white border border-gray-200 rounded-xl p-3'},
                e('div',{className:'text-xs text-gray-500'},b.l),
                e('div',{className:'text-lg font-bold mt-0.5 text-blue-700'},b.v),
                e('span',{className:cls('text-xs px-1.5 py-0.5 rounded font-medium border',b.cls)},b.badge)
            ))
        ),
        e('div', {className:'grid grid-cols-2 gap-5'},
            e('div',{className:'bg-white border border-gray-200 rounded-xl p-4'},e('div',{className:'text-sm font-semibold text-gray-700 mb-3'},'DAU Retention Curve (D0–D365)'),e('div',{style:{height:240}},e('canvas',{ref:chartRef}))),
            e('div',{className:'bg-white border border-gray-200 rounded-xl p-4'},e('div',{className:'text-sm font-semibold text-gray-700 mb-1'},'Cumulative Ad LTV / Install'),e('div',{className:'text-xs text-gray-400 mb-3'},'Daily DAU × $'+ARPDAU+' ARPDAU × 12 months'),e('div',{style:{height:224}},e('canvas',{ref:ltvRef})))

        e('div', {className:'grid grid-cols-2 gap-5'},
            e('div',{className:'bg-white border border-gray-200 rounded-xl overflow-hidden'},

                    e('tbody',null,EOM.map(r=>e('tr',{key:r.m,className:'border-b border-gray-50 hover:bg-gray-50'},

                        e('td',{className:'px-4 py-1.5 text-right font-mono text-xs font-semibold text-blue-700'},fmtPct(r.ret)),
                        e('td',{className:'px-4 py-1.5 text-right text-gray-600'},(r.ret*1000).toFixed(1)),
                        e('td',{className:'px-4 py-1.5'},e('span',{className:cls('text-xs px-1.5 py-0.5 rounded font-medium border',r.type==='observed'?'bg-emerald-50 text-emerald-700 border-emerald-200':r.type==='install'?'bg-blue-50 text-blue-700 border-blue-200':'bg-amber-50 text-amber-700 border-amber-200')},r.type))
                    )))
                )
            ),
            e('div',{className:'bg-white border border-gray-200 rounded-xl overflow-hidden'},
                e('div',{className:'bg-gray-50 px-4 py-2.5 border-b text-xs font-semibold text-gray-600 uppercase tracking-wide'},'Monthly Rev per Install'),
                e('table',{className:'w-full text-sm'},
                    e('thead',null,e('tr',{className:'text-xs text-gray-400 border-b border-gray-100'},['Month','DAU-days','Monthly rev','Cumul LTV'].map(h=>e('th',{key:h,className:'px-4 py-2 text-left font-medium'},h)))),
                    e('tbody',null,cumulativeLTV.map(r=>e('tr',{key:r.m,className:cls('border-b border-gray-50 hover:bg-gray-50',r.m===0?'bg-amber-50/30':'')},
                        e('td',{className:'px-4 py-1.5 font-medium text-gray-700'},'M'+r.m),
                        e('td',{className:'px-4 py-1.5 font-mono text-xs text-gray-500'},r.dauDays.toFixed(3)),
                        e('td',{className:'px-4 py-1.5 font-mono text-xs text-amber-700'},'$'+(r.dauDays*ARPDAU).toFixed(4)),
                        e('td',{className:'px-4 py-1.5 font-bold text-blue-700'},'$'+r.ltv.toFixed(4))
                    )))
                )
            )
        ),
        e('div',{className:'bg-gray-50 border border-gray-200 rounded-xl p-4 text-xs text-gray-500 space-y-1.5'},
            e('div',{className:'font-semibold text-gray-700 text-sm'},'📐 Methodology'),
            e('div',null,e('span',{className:'font-medium text-gray-600'},'Data:'),' Blended: 29 cohorts Jan–Feb 2026 (D1–D21, higher quality) + 85 cohorts Dec 2025–Feb 2026 (D30–D75 anchors). US market.'),
            e('div',null,e('span',{className:'font-medium text-gray-600'},'Extrapolation:'),' Tail fit anchored to D21 (new cohorts) + D30/D45/D75 (85-cohort data): f(d) = 0.0259 × e^(−0.02075d). Half-life = 33.4 days.')
        )
    );
}

// ── Financial ─────────────────────────────────────────────────────────────────
function Financial({campaigns, settings}) {
    const ltvRef = useRef(null), ltvInst = useRef(null);
    const cashRef = useRef(null), cashInst = useRef(null);
    const [selectedCampaigns, setSelectedCampaigns] = useState([]);
    const [spendMultiplier, setSpendMultiplier] = useState(1);
    const [monthlySpendOverride, setMonthlySpendOverride] = useState('');
    const [showDeepDive, setShowDeepDive] = useState(false);
    const [activeTab, setActiveTab] = useState('scenarios'); // scenarios | howwegothere | workings
    const [scenarioRetBoost, setScenarioRetBoost] = useState(0);    // % boost to D1 retention
    const [scenarioCpiCut, setScenarioCpiCut] = useState(0);         // % CPI reduction
    const [scenarioArpdauBoost, setScenarioArpdauBoost] = useState(0); // % ARPDAU boost
    const MONTHS = 24;

    useEffect(()=>{ if(campaigns.length>0&&selectedCampaigns.length===0) setSelectedCampaigns(campaigns.map(c=>c.name)); },[campaigns]);

    // ── Retention curve (blended: new D1-D21 + old D30-D75) ──
    const A_FIT=0.0259, K_FIT=0.02075;
    const OBS_RET=[[0,1.0],[1,0.15996],[2,0.07865],[3,0.05923],[4,0.05000],[5,0.04255],[6,0.05112],[7,0.03647],[10,0.03077],[14,0.03279],[18,0.02857],[21,0.01713],[30,0.0131],[45,0.0107],[75,0.0054]];
    const retAtDay = (d, retBoostFrac=0) => {
        // retBoostFrac shifts early retention proportionally
        let base;
        if(d===0) return 1.0;
        for(let i=0;i<OBS_RET.length-1;i++){const[d0,r0]=OBS_RET[i],[d1,r1]=OBS_RET[i+1];if(d>=d0&&d<=d1){base=r0+(d-d0)/(d1-d0)*(r1-r0);break;}}
        if(base===undefined) base=A_FIT*Math.exp(-K_FIT*d);
        // decay the boost so it's full at D1, zero by D75
        const boost = retBoostFrac * Math.max(0, 1 - d/75);
        return Math.min(1, base*(1+boost));
    };

    const dauDaysPerMonth = (retBoostFrac=0) => {
        const arr = [];
        for(let m=0;m<=MONTHS;m++){let dd=0;for(let d=m*30;d<(m+1)*30;d++)dd+=retAtDay(d,retBoostFrac);arr.push(dd);}
        return arr;
    };

    // ── Inputs ──
    const selCamps = campaigns.filter(c=>selectedCampaigns.includes(c.name));
    const totalSpend = selCamps.reduce((s,c)=>s+c.spend,0);
    const totalInstalls = selCamps.reduce((s,c)=>s+c.installs,0);
    const totalTrials = selCamps.reduce((s,c)=>s+c.trials,0);
    const days = selCamps.length>0 ? Math.max(...selCamps.map(c=>c.days||1)) : 30;
    const dailySpend = totalSpend/days;
    const dailyInstalls = totalInstalls/days;
    const dailyTrials = totalTrials/days;
    const overriddenMonthly = monthlySpendOverride ? parseFloat(monthlySpendOverride)||0 : null;
    const monthlySpend = overriddenMonthly || dailySpend*30*spendMultiplier;
    const scaleF = overriddenMonthly ? overriddenMonthly/(dailySpend*30||1) : spendMultiplier;
    const monthlyInstalls = dailyInstalls*30*scaleF;
    const monthlyTrials = dailyTrials*30*scaleF;
    const cpi = totalInstalls>0 ? totalSpend/totalInstalls : 0;
    const optInRate = totalInstalls>0 ? totalTrials/totalInstalls : 0;
    const trialConv = settings.trialConvRate||0.40;
    const arpdau = settings.arpdau||0.157;
    const arppu = settings.arppu||2.70;
    const subEnabled = settings.subEnabled!==false;
    const targetCPA = settings.targetCPA||2.50;
    const monthsOfData = days/30;
    const baseMonthlySpend = totalSpend/Math.max(monthsOfData,0.5)||3000;

    const SUB_RET=[1.0,0.676,0.587,0.531,0.494,0.474,0.460,0.449,0.444,0.438,0.431,0.404,...Array(12).fill(0.400)];

    // ── Build projection with optional scenario overrides ──
    const buildProj = (opts={}) => {
        const retBoost = (opts.retBoostPct||0)/100;
        const cpiMult = 1-(opts.cpiCutPct||0)/100;
        const arpdauMult = 1+(opts.arpdauBoostPct||0)/100;
        const effCpi = cpi*cpiMult;
        const effArpdau = arpdau*arpdauMult;
        const effMonthlyInstalls = effCpi>0 ? monthlySpend/effCpi : monthlyInstalls;
        const effMonthlyTrials = effMonthlyInstalls*optInRate;
        const dd = dauDaysPerMonth(retBoost);
        const proj=[];
        for(let m=0;m<MONTHS;m++){
            let adRev=0,subRev=0;
            for(let cm=0;cm<=m;cm++){
                const offset=m-cm;
                adRev+=effMonthlyInstalls*(dd[offset]||0)*effArpdau;
                if(subEnabled){
                    const sr=SUB_RET[offset]!==undefined?SUB_RET[offset]:0.4;
                    const ps=effMonthlyTrials*trialConv;
                    subRev+=ps*sr*arppu;
                }
            }
            const totalRev=adRev+subRev;
            proj.push({m,adRev,subRev,totalRev,spend:monthlySpend,profit:totalRev-monthlySpend});
        }
        let cum=0; proj.forEach(p=>{cum+=p.profit;p.cumProfit=cum;});
        return proj;
    };

    // ── Per-install LTV (for display) ──
    const ltvPerInstall = (retBoostFrac=0,arpdauBoostFrac=0) => {
        const dd=dauDaysPerMonth(retBoostFrac);
        const effArpdau=arpdau*(1+arpdauBoostFrac);
        let cum=0;
        return Array.from({length:13},(_,m)=>{cum+=dd[m]*effArpdau;return cum;});
    };

    const proj = buildProj();
    const adLTV12 = ltvPerInstall()[12];
    const subLTV12 = subEnabled ? optInRate*trialConv*arppu*2.4 : 0;
    const blendedLTV12 = adLTV12+subLTV12;
    const cpa = monthlyInstalls>0 ? monthlySpend/(monthlyInstalls*optInRate*trialConv) : 0;
    const breakEvenMonth = proj.findIndex((p,i)=>i>0&&p.cumProfit>=0);
    const cohortPayback = ltvPerInstall().findIndex((ltv,m)=>m>0&&ltv>=cpi);
    const roas12 = monthlySpend>0 ? proj.slice(0,12).reduce((s,p)=>s+p.totalRev,0)/proj.slice(0,12).reduce((s,p)=>s+p.spend,0) : 0;
    const cumulRev12 = proj.slice(0,12).reduce((s,p)=>s+p.totalRev,0);
    const cumulSpend12 = proj.slice(0,12).reduce((s,p)=>s+p.spend,0);

    // ── Verdict logic ──
    const isScalable = roas12>=1 && (breakEvenMonth>=0&&breakEvenMonth<=12);
    const isOptimize = roas12>=0.7 && !isScalable;

    // ── Scenario table CPAs ──
    // CPI scenario rows anchored to actual CPI
    const scenarioCPIs = cpi>0
        ? [cpi*2, cpi*1.5, cpi*1.25, cpi, cpi*0.75, cpi*0.5, cpi*0.33]
            .map(v=>+v.toFixed(2)).filter((v,i,a)=>a.indexOf(v)===i)
        : [3.00,2.00,1.50,1.00,0.75,0.50];

    // Scenario ROAS: pure CPI sensitivity, no sub assumptions.
    // At CPI=$X with same spend, you get more/fewer installs → more/less ad revenue.
    // Formula: revenue = Σ(months) Σ(cohorts) (spend/cpiSc) × dauDays[offset] × arpdau
    // Simplifies to: (adLTV_per_dollar_at_cpiSc) vs 1 dollar of spend
    const scenarioROAS = (cpiSc, months) => {
        const dd = dauDaysPerMonth();
        if(cpiSc<=0||monthlySpend<=0) return 0;
        let totalRev=0, totalSpend=0;
        for(let m=0;m<months;m++){
            let adRev=0;
            for(let c=0;c<=m;c++){
                const offset=m-c;
                // installs per month at this CPI scenario, same spend
                const installs = monthlySpend/cpiSc;
                adRev+=installs*(dd[offset]||0)*arpdau;
            }
            totalRev+=adRev;
            totalSpend+=monthlySpend;
        }
        return totalSpend>0?totalRev/totalSpend*100:0;
    };

    // ── What-if scenario comparison ──
    const whatIfProj = buildProj({retBoostPct:scenarioRetBoost,cpiCutPct:scenarioCpiCut,arpdauBoostPct:scenarioArpdauBoost});
    const whatIfRoas12 = monthlySpend>0 ? whatIfProj.slice(0,12).reduce((s,p)=>s+p.totalRev,0)/whatIfProj.slice(0,12).reduce((s,p)=>s+p.spend,0) : 0;
    const whatIfLTV = ltvPerInstall(scenarioRetBoost/100,scenarioArpdauBoost/100)[12];
    const whatIfBreakEven = whatIfProj.findIndex((p,i)=>i>0&&p.cumProfit>=0);
    const effCpiWhatIf = cpi*(1-scenarioCpiCut/100);

    // ── Charts ──
    useEffect(()=>{
        if (!ltvRef.current) return;
        if (ltvInst.current) ltvInst.current.destroy();
        const baseLTV = ltvPerInstall();
        const whatIfLTVArr = ltvPerInstall(scenarioRetBoost/100,scenarioArpdauBoost/100);
        const labels = Array.from({length:13},(_,m)=>'M'+m);
        const datasets = [
            {label:'Ad LTV (base)',data:baseLTV.map(v=>+v.toFixed(4)),borderColor:'#f59e0b',backgroundColor:'rgba(245,158,11,0.08)',borderWidth:2.5,fill:true,tension:0.3,pointRadius:3},
        ];
        if(scenarioRetBoost>0||scenarioCpiCut>0||scenarioArpdauBoost>0){
            datasets.push({label:'Ad LTV (scenario)',data:whatIfLTVArr.map(v=>+v.toFixed(4)),borderColor:'#10b981',borderDash:[5,4],borderWidth:2,tension:0.3,pointRadius:3,backgroundColor:'transparent'});
        }
        // CPI line
        if(cpi>0) datasets.push({label:'CPI (break-even line)',data:Array(13).fill(+cpi.toFixed(2)),borderColor:'#ef4444',borderDash:[3,3],borderWidth:1.5,pointRadius:0,backgroundColor:'transparent'});
        ltvInst.current = new Chart(ltvRef.current,{type:'line',data:{labels,datasets},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:12,font:{size:10}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'$'+v.toFixed(3),font:{size:9}}},x:{ticks:{font:{size:10}}}}}});
        return ()=>ltvInst.current?.destroy();
    },[settings,selectedCampaigns,spendMultiplier,monthlySpendOverride,scenarioRetBoost,scenarioCpiCut,scenarioArpdauBoost]);

    useEffect(()=>{
        if (!cashRef.current||!showDeepDive) return;
        if (cashInst.current) cashInst.current.destroy();
        cashInst.current = new Chart(cashRef.current,{type:'bar',data:{labels:proj.map(p=>'M'+p.m),datasets:[
            {label:'Ad Revenue',data:proj.map(p=>+p.adRev.toFixed(0)),backgroundColor:'rgba(245,158,11,0.7)',stack:'rev'},
            {label:'Sub Revenue',data:proj.map(p=>+p.subRev.toFixed(0)),backgroundColor:'rgba(139,92,246,0.7)',stack:'rev'},
            {label:'Ad Spend',data:proj.map(p=>+(-p.spend).toFixed(0)),backgroundColor:'rgba(239,68,68,0.5)',stack:'cost'},
            {label:'Cumulative P&L',data:proj.map(p=>+p.cumProfit.toFixed(0)),type:'line',borderColor:'#3b82f6',borderWidth:2,pointRadius:0,tension:0.3,fill:false,yAxisID:'y'},
        ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',labels:{boxWidth:10,font:{size:10}}}},scales:{y:{ticks:{callback:v=>fmtM(v),font:{size:9}},stacked:true},x:{ticks:{font:{size:9},maxRotation:45}}}}});
        return ()=>cashInst.current?.destroy();
    },[showDeepDive,settings,selectedCampaigns,spendMultiplier,monthlySpendOverride]);

    const verdictBg = isScalable?'bg-emerald-50 border-emerald-400':isOptimize?'bg-amber-50 border-amber-400':'bg-red-50 border-red-400';
    const verdictColor = isScalable?'text-emerald-700':isOptimize?'text-amber-700':'text-red-700';

    const kpis = [
        {label:'Monthly Spend',value:fmtM(monthlySpend),sub:'at current rate',bg:'bg-blue-50',border:'border-blue-200',color:'text-blue-700'},
        {label:'Monthly Installs',value:fmtK(monthlyInstalls),sub:fmtD(cpi)+' CPI',bg:'bg-indigo-50',border:'border-indigo-200',color:'text-indigo-700'},
        {label:'12M Revenue',value:fmtM(cumulRev12),sub:fmtM(cumulSpend12)+' spend',bg:'bg-amber-50',border:'border-amber-200',color:'text-amber-700'},
        {label:'12M ROAS',value:(roas12*100).toFixed(0)+'%',sub:roas12>=1?'✅ profitable':'needs work',bg:roas12>=1?'bg-emerald-50':roas12>=0.7?'bg-amber-50':'bg-red-50',border:roas12>=1?'border-emerald-200':roas12>=0.7?'border-amber-200':'border-red-200',color:roas12>=1?'text-emerald-700':roas12>=0.7?'text-amber-700':'text-red-700'},
        {label:'Break-even',value:breakEvenMonth>=0?'M'+breakEvenMonth:'>M'+MONTHS,sub:'monthly profitable',bg:'bg-violet-50',border:'border-violet-200',color:'text-violet-700'},
        {label:'Ad LTV 12M',value:'$'+adLTV12.toFixed(3),sub:'per install · real curve',bg:'bg-orange-50',border:'border-orange-200',color:'text-orange-700'},
    ];

    return e('div', {className:'space-y-5'},

        // ── Controls ──
        e('div',{className:'bg-white border border-gray-200 rounded-xl p-4'},
            e('div',{className:'text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2'},'Campaigns & Spend'),
            e('div',{className:'flex flex-wrap gap-1.5 mb-3'},
                e('button',{onClick:()=>setSelectedCampaigns(campaigns.map(c=>c.name)),className:'text-xs px-2.5 py-1 bg-blue-50 text-blue-600 rounded-full border border-blue-200 font-semibold'},'All'),
                e('button',{onClick:()=>setSelectedCampaigns([]),className:'text-xs px-2.5 py-1 bg-gray-100 text-gray-500 rounded-full border border-gray-200'},'None'),
                campaigns.map(c=>{
                    const sel=selectedCampaigns.includes(c.name);
                    return e('button',{key:c.name,onClick:()=>setSelectedCampaigns(prev=>sel?prev.filter(n=>n!==c.name):[...prev,c.name]),className:cls('text-xs px-2.5 py-1 rounded-full border font-medium transition-colors',sel?'bg-blue-600 text-white border-blue-600':'bg-white text-gray-500 border-gray-200 hover:border-blue-300')},c.name);
                })
            ),
            e('div',{className:'flex flex-wrap items-end gap-4 pt-3 border-t border-gray-100'},
                e('div',null,
                    e('div',{className:'text-xs text-gray-400 mb-1'},'Scale: ',e('strong',{className:'text-blue-600'},spendMultiplier+'×'),' = ',e('strong',null,fmtM(baseMonthlySpend*spendMultiplier)+'/mo')),
                    e('input',{type:'range',min:0.25,max:10,step:0.25,value:spendMultiplier,onChange:ev=>{setSpendMultiplier(+ev.target.value);setMonthlySpendOverride('');},className:'w-36 accent-blue-600'})
                ),
                e('div',null,
                    e('div',{className:'text-xs text-gray-400 mb-1'},'Monthly spend override'),
                    e('input',{type:'number',value:monthlySpendOverride,onChange:ev=>setMonthlySpendOverride(ev.target.value),placeholder:'$'+Math.round(baseMonthlySpend),className:'border border-gray-200 rounded px-2 py-1.5 text-xs w-28'})
                ),
                selCamps.length>0 && e('div',{className:'text-xs text-gray-500 flex gap-4 flex-wrap'},
                    e('span',null,'📊 ',e('strong',null,fmtM(totalSpend)),' actual · ',Math.round(monthsOfData*10)/10,'mo of data'),
                    e('span',null,'📲 ',e('strong',null,fmtK(totalInstalls)),' installs · ',e('strong',null,(optInRate*100).toFixed(1)+'%'),' opt-in'),
                    e('span',null,'💰 ',e('strong',null,fmtD(cpi)),' CPI · ',e('strong',null,fmtD(cpa)),' CPA')
                )
            )
        ),

        // ── THE VERDICT ──
        e('div',{className:cls('rounded-2xl p-6 border-2',verdictBg)},
            e('div',{className:'flex items-start justify-between gap-6'},
                e('div',{className:'flex-1'},
                    e('div',{className:cls('text-xs font-bold uppercase tracking-widest mb-1 opacity-60',verdictColor)},'The Verdict'),
                    e('div',{className:cls('text-3xl font-black mb-2',verdictColor)},
                        isScalable?'✅ SCALE IT':isOptimize?'⚡ OPTIMIZE FIRST':'🛑 NEEDS WORK'
                    ),
                    e('div',{className:cls('text-sm leading-relaxed',verdictColor.replace('700','800'))},
                        isScalable
                            ? `12M ROAS ${(roas12*100).toFixed(0)}% — profitable. Break-even at M${breakEvenMonth}. Ad LTV $${adLTV12.toFixed(3)} vs CPI $${cpi.toFixed(2)} (${(adLTV12/cpi*100).toFixed(0)}% on ad alone). Economics support scaling.`
                            : isOptimize
                            ? `12M ROAS ${(roas12*100).toFixed(0)}% — close but not there. Blended LTV $${blendedLTV12.toFixed(3)} vs CPI $${cpi.toFixed(2)}. Need CPI to drop to ~$${(blendedLTV12*0.95).toFixed(2)} or ARPDAU up to $${(arpdau*(cpi/blendedLTV12)).toFixed(4)} to break even on ad revenue alone.`
                            : `12M ROAS only ${(roas12*100).toFixed(0)}% (need 100%). Ad LTV $${adLTV12.toFixed(3)} vs CPI $${cpi.toFixed(2)} — spending $${(cpi/adLTV12).toFixed(2)} to earn $1 in ad revenue. ${breakEvenMonth>=0?'Break-even M'+breakEvenMonth+' but slow.':'No break-even in 24mo.'} Use scenarios below to find the path.`
                    )
                ),
                e('div',{className:'text-right shrink-0'},
                    e('div',{className:cls('text-5xl font-black tabular-nums',verdictColor)},(roas12*100).toFixed(0)+'%'),
                    e('div',{className:'text-xs text-gray-500 mt-1'},'12M blended ROAS'),
                    e('div',{className:'text-xs text-gray-400'},'100% = break-even')
                )
            ),
            e('div',{className:'mt-4 grid grid-cols-4 gap-3 pt-4 border-t border-current border-opacity-20'},
                [
                    {label:'Ad LTV 12M',value:'$'+adLTV12.toFixed(3),sub:'vs CPI $'+cpi.toFixed(2)+' = '+(adLTV12/cpi*100).toFixed(0)+'%',ok:adLTV12>=cpi},
                    {label:'Blended LTV 12M',value:'$'+blendedLTV12.toFixed(3),sub:'ad + sub per install',ok:blendedLTV12>=cpi},
                    {label:'Ad payback',value:cohortPayback>=0?'M'+cohortPayback:'>M12',sub:'when ad LTV > CPI',ok:cohortPayback>=0&&cohortPayback<=12},
                    {label:'M12 margin',value:proj[11]?(((proj[11].totalRev-proj[11].spend)/Math.max(proj[11].totalRev,1))*100).toFixed(0)+'%':'—',sub:proj[11]&&proj[11].profit>=0?'profitable M12':'still burning M12',ok:proj[11]&&proj[11].profit>=0},
                ].map(m=>e('div',{key:m.label,className:'text-center'},
                    e('div',{className:'text-xs text-gray-500 mb-0.5'},m.label),
                    e('div',{className:cls('text-lg font-bold',m.ok?verdictColor.replace('50','').replace('border-',''):'text-red-600')},m.value),
                    e('div',{className:'text-xs text-gray-400 mt-0.5'},m.sub)
                ))
            )
        ),

        // ── KPIs ──
        e('div',{className:'grid grid-cols-6 gap-3'},kpis.map(k=>e(KPI,{key:k.label,...k}))),

        // ── Unit Economics Funnel ──
        e('div',{className:'bg-white border border-gray-200 rounded-xl p-5'},
            e('div',{className:'text-xs font-semibold text-gray-600 uppercase tracking-wide mb-3'},'Unit Economics — How Every Dollar Flows'),
            e('div',{className:'flex items-stretch gap-1.5 flex-wrap mb-4'},
                ...[
                    {label:'Monthly Spend',value:fmtM(monthlySpend),sub:'budget in',bg:'bg-gray-50',border:'border-gray-200',text:'text-gray-800'},
                    null,
                    {label:'Installs',value:fmtK(monthlyInstalls),sub:fmtD(cpi)+' CPI',bg:'bg-blue-50',border:'border-blue-200',text:'text-blue-800'},
                    null,
                    {label:'Trials',value:fmtK(monthlyTrials),sub:(optInRate*100).toFixed(1)+'% opt-in',bg:'bg-indigo-50',border:'border-indigo-200',text:'text-indigo-800'},
                    null,
                    {label:'Paid Subs',value:subEnabled?fmtK(monthlyTrials*trialConv):'—',sub:(trialConv*100).toFixed(0)+'% conv',bg:'bg-violet-50',border:'border-violet-200',text:'text-violet-800'},
                    null,
                    {label:'CPA',value:fmtD(cpa),sub:cpa<=targetCPA?'✅ on target':'⚠️ $'+fmtD(targetCPA)+' target',bg:cpa<=targetCPA?'bg-emerald-50':'bg-red-50',border:cpa<=targetCPA?'border-emerald-300':'border-red-300',text:cpa<=targetCPA?'text-emerald-800':'text-red-700',big:true},

                    e('tbody',null,proj.map((p,i)=>e('tr',{key:i,className:cls('border-b border-gray-100',p.cumProfit>=0?'bg-emerald-50/30':i%2===0?'bg-white':'bg-gray-50/30')},
                        e('td',{className:'px-3 py-2 font-bold text-gray-500'},'M'+p.m),
                        e('td',{className:'px-3 py-2 text-gray-600'},fmtK(monthlyInstalls)),
                        e('td',{className:'px-3 py-2 text-gray-600'},fmtK(monthlyTrials*trialConv)),
                        e('td',{className:'px-3 py-2 text-amber-600 font-medium'},fmtM(p.adRev)),
                        e('td',{className:'px-3 py-2 text-violet-600'},subEnabled?fmtM(p.subRev):'—'),
                        e('td',{className:'px-3 py-2 text-gray-700 font-semibold'},fmtM(p.totalRev)),
                        e('td',{className:'px-3 py-2 text-blue-600'},'−'+fmtM(p.spend)),
                        e('td',{className:cls('px-3 py-2 font-semibold',p.profit>=0?'text-emerald-600':'text-red-500')},fmtM(p.profit)),
                        e('td',{className:cls('px-3 py-2 font-bold',p.cumProfit>=0?'text-emerald-600':'text-red-500')},(p.cumProfit>=0?'+':'')+fmtM(p.cumProfit))
                    )))
                )
            )
        )
    );
}



ReactDOM.render(React.createElement(App), document.getElementById('root'));
</script>
</body>
</html>
